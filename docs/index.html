idates, and every one of them is a potential leak. every longitudinal lap, every circumferential lap, every screw and rivet hole, every band, every termination at a flange, valve, support, nozzle or instrument tapping. suppose, purely illustratively, that a single detail has a one percent annual probability of admitting water and a hundred-metre circuit carries three hundred such details. the expected number of wet paths in the first year is about three, and the probability that at least one is open is essentially one. now age the system: sealant loses elasticity, debonds from the substrate and pulls away from the adjacent sheet; jacket gets walked on, dented and re-fitted around scaffolding; a fitter drills through a lap. over a twenty-five year life the probability of ingress somewhere on the circuit converges to one regardless of how good the original jacket specification was. a design whose primary barrier is water exclusion has therefore chosen a barrier that is guaranteed to fail. that is not an argument for a worse jacket — the jacket controls how often and how much, which is a real and valuable term. it is an argument that the coating is the layer you must never trade away, because it is the only one still working on the day the assumption breaks. the numbers above are illustrative and not a calibrated model; the structure is what matters — a series system, many elements, all of them ageing. now the part that is genuinely counter-intuitive, and the one worth being able to say out loud in a design review. under a jacket, the electrolyte is not the water that arrived . rainwater, washdown, deluge test water, steam leakage and condensate arrive carrying perhaps a few to a few tens of parts per million of chloride. but the annulus around a line running at eighty to a hundred and twenty degrees celsius is an evaporator. water reaching the hot metal flashes off; the dissolved salt does not. and unlike an exposed external surface, nothing flushes it away, because the jacket that failed to keep water out is perfectly effective at keeping salt in. cycle after cycle, the surface concentratio","summaryHtml":"Four deep-dives in, every one of them has sat downstream of damage that already happened. Part 5 assessed the wall you already lost. Part 9 assessed the crack you already have. Integrity operating windows watched the rate of a mechanism already running. Corrosion loops and CMLs estimated the condition of a circuit already degrading. None of that stops anything. The controls that actually stop CUI, external chloride stress corrosion cracking and corrosion under fireproofing are the layers of the insulated system itself — the coating, the insulation, the vapour barrier, the jacket, the sealant and the geometry — and the standard that governs them puts its whole argument in its title: NACE/AMPP SP0198, Control of Corrosion Under Thermal Insulation and Fireproofing Materials, A Systems Approach. This week goes upstream to that system. The organising idea is that the layers are not redundant copies of one barrier; each one acts on a different, multiplicative term in how much corrosion you get, which is why swapping one for another is an engineering error rather than a trade-off. And the timing is good, because the document your whole programme is anchored to has just moved edition."},{"id":"D_2026_08_24","stream":"integrity","date":"2026-08-24","title":"The record is the deliverable — owning a risk position instead of producing an analysis","summary":"Digest #7, and a deliberate change of track. Digests #2 through #6 built a single arc on CUI prediction modelling: a physics-informed prior, a Bayesian posterior, a probability of exceedance that sets an interval, a back-test that says whether the numbers are honest, and a detection term that says what a clean inspection is actually worth. That arc is closed and it is technically defensible. It is also, on its own, not promotable. The gap between a Senior Inspection Engineer and a Lead is rarely analytical horsepower — it is whether the organisation can still rely on your position six months after you have left the room. That shifts the deliverable from the number to the record that carries it: what was assumed, on what basis, who owns it, and what would make you re-open it. This week covers what API RP 580 requires you to write down, what keeps that record alive, and a public regulatory audit published in June 2026 where the engineering was competent and the paperwork was the finding.","sections":[{"heading":"What API RP 580 requires you to write down — and why a risk number without it is not a programme","html":"\u003cp>API RP 580, Elements of a Risk-Based Inspection Program, is now in its 4th Edition (August 2023) and is an ANSI/API standard, balloted through the ANSI consensus process. That status change has a practical consequence worth knowing: the 4th Edition distinguishes the elements that are required for a programme to be considered API 580 compliant from those that are merely recommended. In other words there are now clauses you can point at rather than good practice you have to argue for. The edition also expanded the treatment of the damage mechanism review process and pushed harder on documentation.\u003c/p>\n\u003cp>Hold the division of labour clearly, because it is the thing most often muddled in interviews and in review meetings. API RP 581 is the calculation — the damage factors, the consequence areas, the arithmetic that turns data into a risk number, now in its 4th Edition (January 2025). API RP 580 is the programme built around that calculation: scope, team roles and competency, data quality, risk acceptance, reassessment, documentation and management review. Running 581 arithmetic without the 580 frame produces a risk figure with no governance behind it. That is not a programme, and an auditor will not treat it as one.\u003c/p>\n\u003cp>The documentation element asks four things in substance: what were the input data and the assumptions, what was the logic, on what basis were the assessment and its decisions taken, and what was done to eliminate or mitigate the risk. The practical form this takes is an assumption register, and this is where the Track 2 arc becomes a Lead-level artefact instead of a personal spreadsheet. Every quantity that arc produced is a row: the prior corrosion rate and the basis for it, the posterior and the updating method, the coverage and probability of detection credited to each inspection (Digest #6), the calibration status of the model (Digest #5), the risk acceptance threshold and whose threshold it is (Digest #4), the source and vintage of the insulation and jacket condition data. Each row carries a value, a source classified as measured, estimated or assumed, a confidence grade, a named owner, and a date.\u003c/p>\n\u003cp>That source-and-confidence labelling is not bureaucracy; it is the defence against the single most common quiet failure in a mature integrity programme. A number enters the system three years ago as an engineering assumption, gets carried into a report, then into a plan, then into a software field, and by the fourth citation it is being quoted as though it were measured. Nobody decided to do that. It is confidence laundering by repetition, and the only thing that stops it is that the original entry was labelled and the label travelled with the number. Where a data gap genuinely cannot be closed, the discipline is a documented conservative assumption with the conservatism stated — not a silent software default, which is an assumption nobody can find later.\u003c/p>\n\u003cp>One more line belongs in the register and it is the one most often left blank: who owns the risk acceptance criteria. Not the software, not the RBI contractor, not the analyst who ran the case. The Owner/User sets the risk target, which is the point Digest #4 made when it observed that API 581 supplies the probability of exceedance but not the threshold you compare it against. An acceptance criterion with no name against it defaults, in practice, to whoever last touched the model — which is exactly the accountability you are trying to move up and out of your own hands as you step toward Lead.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.api.org/products-and-services/individual-certification-programs/certifications/api580\" target=\"_blank\" rel=\"noopener noreferrer\">API 580 — Risk Based Inspection (certification and standard overview)\u003c/a>\n        \u003cspan class=\"lnk-src\">American Petroleum Institute\u003c/span>\u003cspan class=\"lnk-note\">The standard's own page — confirms scope and the body of knowledge the API 580 certification is examined against.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/api+rp+580\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 580 — Risk Based Inspection (topic hub)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Running collection of articles on the 4th Edition, its required-versus-recommended elements, and how programmes are built around it.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://ifluids.com/standard/rbi-data-package-requirements/\" target=\"_blank\" rel=\"noopener noreferrer\">RBI data package requirements\u003c/a>\n        \u003cspan class=\"lnk-src\">iFluids Engineering\u003c/span>\u003cspan class=\"lnk-note\">A concrete worked list of what an RBI data package has to contain, including data confidence grading and closing gaps with documented conservative assumptions.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://nwegroup.no/rbi-data-requirements-api-580-581/\" target=\"_blank\" rel=\"noopener noreferrer\">API 580/581 RBI inputs to inspection plans\u003c/a>\n        \u003cspan class=\"lnk-src\">NWE Group\u003c/span>\u003cspan class=\"lnk-note\">Useful on source traceability and data-quality status per field — the practical shape of an assumption register.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Evergreening: write the re-open triggers before you need them, and mind the gap between the plan and what got done","html":"\u003cp>An RBI assessment is a snapshot of a belief about risk, and beliefs go stale. API RP 580 therefore treats reassessment as a required element rather than an optional refresh, and common industry practice is to revalidate risk rankings on a defined cycle — three to five years is the figure usually quoted — or sooner on process change or when inspection results show degradation running faster than predicted. Treat the calendar cycle as the floor. It is the thing that catches drift you did not notice; it is not the mechanism you should be relying on.\u003c/p>\n\u003cp>The Lead-level version is to define the re-open triggers in advance and put them in the plan, so that re-opening an assessment is a defined event rather than an argument someone has to win. The arc so far has already produced four good ones. A measured corrosion rate above the upper bound of the posterior credible interval is a model-wrong signal, not a data point to average in (Digest #5). An integrity operating window exceedance invalidates the rate assumption the interval was built on, which is why an IOW exceedance is an inspection-plan event. A finding whose morphology contradicts the assumed damage mechanism — under-band pitting where you modelled general thinning — breaks the damage factor, not just the number. And the one people consistently forget: an inspection executed at lower coverage or by a different method than the effectiveness grade credited (Digest #6). That one is missed because the plan reads as complete. It was done. It just was not the inspection the risk number assumed.\u003c/p>\n\u003cp>Keep the exceedance and change boundary clean, because it is where inspection quietly gets bypassed. An exceedance is an unplanned excursion that triggers a response inside the integrity programme. A deliberate, sustained change to how the plant is operated or maintained is management of change, and calling it an exceedance routes it around the review it should have had. In your domain the trap has a specific shape: insulation removal and reinstatement, a change of insulation or jacketing material, a revised coating specification, or a decision to leave a line spared and idle are all integrity-relevant changes that frequently escape MOC because they are booked as maintenance. Every one of them moves a CUI driver.\u003c/p>\n\u003cp>Then there is the gap that audits are best at finding: the distance between the plan and what was actually executed. An inspection plan is a set of commitments, and the risk number stays valid only while those commitments are met as specified. Three quiet failures recur. Partial execution — fewer thickness locations, less coverage, one deferred vessel — closed out as complete. Deferral without a documented risk basis, which is an interval extension that nobody signed. And method substitution, where a screening technique stands in for the credited technique without the effectiveness grade being reconsidered. Each of these silently invalidates the damage factor the interval came from, and none of them looks like a problem in a completion metric. A backlog with an owner, a due date and a documented risk basis is a managed risk. An untracked backlog is an undocumented interval extension with nobody's name on it.\u003c/p>\n\u003cp>What an auditor actually tests is worth internalising, because it is not what most engineers prepare for. They are not assessing whether your number is right — they usually cannot, and it is not their role. They are testing whether the trail is complete and traceable: data, to assumption, to decision, to execution, to reassessment, with an owner at each step. That is why repeat findings across successive audit cycles are read so severely. A recurring finding is not a technical failure; it is evidence that the management system did not close the previous one, which is a much larger statement about the organisation.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2025-02-27/11449/api-rp-581-risk-based-inspection-technology-summary-of-changes-in-the-newly-rel\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 581 Risk-Based Inspection Technology — summary of changes in the newly released 4th Edition\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">What moved in the January 2025 edition — worth knowing which edition your site's software is actually running against.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2026-06-25/12095/field-notes-creating-a-repair-plan-for-fixed-equipment-mechanical-integrity\" target=\"_blank\" rel=\"noopener noreferrer\">Field Notes: Creating a Repair Plan for Fixed Equipment Mechanical Integrity\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering (June 2026)\u003c/span>\u003cspan class=\"lnk-note\">The downstream half of the same discipline: turning a finding into a documented, owned, scheduled commitment rather than an observation.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2025-10-30/11669/statistical-risk-based-inspection\" target=\"_blank\" rel=\"noopener noreferrer\">Risk-Based Inspection Using a Statistical Approach\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Connects the statistical machinery from Digests #3-#6 back to programme-level RBI decisions — useful framing for a reassessment argument.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.machapsm.com/5-year-mechanical-integrity-audit\" target=\"_blank\" rel=\"noopener noreferrer\">The 5-year mechanical integrity audit\u003c/a>\n        \u003cspan class=\"lnk-src\">Macha PSM\u003c/span>\u003cspan class=\"lnk-note\">What a PSM mechanical-integrity audit looks for and how findings are structured — read it as the test your records will eventually sit.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Worth knowing — a June 2026 audit where the engineering was sound and the record was the finding","html":"\u003cp>On 15 June 2026, Eastern Research Group published a draft for public comment of a Full Facility Audit and Management Systems Evaluation of the Martinez Refining Company, prepared on behalf of Contra Costa Health and the Contra Costa County Fire Protection District. It runs to roughly thirty numbered findings across operating procedures, training, management of change, compliance auditing, process safety metrics and emergency response. One of them sits squarely in fixed-equipment integrity, and it is worth reading slowly.\u003c/p>\n\u003cp>Finding F.7 concerns a fitness-for-service evaluation. The refinery had a Record of FFS Assessment for a 2024 evaluation performed by a specialist engineering contractor and documented in an April 2024 report; the record was accepted by the site's Responsible Engineer in September 2024. The audit did not challenge the assessment. What it found was that the Record of FFS Assessment did not include a verification by a site Inspector, as the refinery's own procedure requires, and that no documentation was provided of the review by the site's Operations, Engineering, Maintenance and Inspection team, also required by that procedure. The companion finding, F.8, notes that the procedure itself had not been revised since November 2020 and still assigned responsibilities to corporate functions that no longer existed in that form.\u003c/p>\n\u003cp>Read that as a career document rather than a compliance story. A competent contractor did the analysis. A qualified engineer reviewed and accepted it. The equipment was approved for continued operation. And it still became a public regulatory finding — because two verification steps that the site had itself decided were necessary could not be evidenced. Note what the finding costs: it enters a public document, it generates a corrective action, and it becomes part of how that refinery's integrity programme is publicly characterised. None of that is proportionate to the effort the two missing signatures would have taken.\u003c/p>\n\u003cp>Two habits transfer directly. First, when a procedure requires a review, the evidence of that review is part of the deliverable, not an administrative afterthought that follows it. In audit terms an undocumented review did not happen, and that is not pedantry — it is the only way an outsider can distinguish a review that was done from one that was assumed. Second, and this is the more senior point, procedures decay. F.8 is a Lead-level responsibility: owning the procedure, not merely complying with it. Apply that test to your own patch. If the CUI, ECLSCC and CUF programme documents still describe an inspection technology mix predating pulsed eddy current screening, 3D scanning for remaining wall thickness and real-time moisture monitoring, then the written programme no longer describes the programme you actually run. Closing that gap is unglamorous, entirely non-confidential, and precisely the kind of visible ownership a promotion case is built from — far more so than another model.\u003c/p>\n\u003cp>The companion standard here is API RP 585, Pressure Equipment Integrity Incident Investigation (2nd Edition, April 2021, with a further edition now appearing in distributor catalogues). It sets out three levels of investigation, from a quick single-person review of a minor event up to a full multi-month root cause investigation. Its recurring theme is the same one this digest keeps circling: pressure equipment integrity incidents very often trace back not to an absent analysis but to a decision that was taken, recorded thinly, and never revisited.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.cccfpd.org/DocumentCenter/View/1437/Draft_Full-Facility-Audit-and-Management-Systems-Evaluation-of-MRC_06152026\" target=\"_blank\" rel=\"noopener noreferrer\">Full Facility Audit and Management Systems Evaluation of the Martinez Refining Company LLC (Draft for Public Comment, 15 June 2026)\u003c/a>\n        \u003cspan class=\"lnk-src\">Eastern Research Group, for Contra Costa Health / CCCFPD\u003c/span>\u003cspan class=\"lnk-note\">This week's current development. Go to the mechanical integrity findings F.6-F.8 — a rare public, specific view of how an integrity record is judged from outside.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.cchealth.org/health-and-safety-information/hazmat-programs/martinez-refining-company-oversight\" target=\"_blank\" rel=\"noopener noreferrer\">Martinez Refining Company Oversight\u003c/a>\n        \u003cspan class=\"lnk-src\">Contra Costa Health\u003c/span>\u003cspan class=\"lnk-note\">The oversight programme the audit sits inside, with the incident history that prompted it — context for why the findings are framed as management-system failures.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.csb.gov/assets/1/6/marathon_martinez_2025-03-12_forpublication.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Fired Heater Tube Rupture and Fire at Marathon Martinez Refinery\u003c/a>\n        \u003cspan class=\"lnk-src\">US Chemical Safety Board\u003c/span>\u003cspan class=\"lnk-note\">A CSB investigation of a fixed-equipment failure at a neighbouring refinery — the same argument made through an incident rather than an audit.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/api+rp+585\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 585 — Pressure Equipment Integrity Incident Investigation (topic hub)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Background on the three investigation levels and how PEI incident investigation feeds back into the integrity programme.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Build a one-page Assumption and Decision Record for a single synthetic insulated circuit (about 45 min, no company data — invent the circuit). Six columns: quantity, value, source (measured / estimated / assumed), confidence, named owner, re-open trigger. Populate it with every number the Track 2 arc actually produced — prior corrosion rate and its basis, posterior mean and credible interval, the coverage and POD credited to the last inspection, model calibration status, the risk acceptance threshold, the age and source of the insulation and jacket condition data, and the resulting interval. Then run two tests on your own sheet. First, the confidence-laundering test: mark every row you would instinctively quote as fact in a review but which entered as an assumption. Second, the sensitivity test: pick the single row whose failure would move the interval most — after Digest #6 that is very likely the POD or effectiveness assumption — and check whether the record contains a trigger that would actually catch it going wrong. If it does not, you have found a concrete, publishable improvement you can take to your own programme with no confidential data attached, and a missing trigger is a far easier proposal to get accepted than a new model.","html":"\u003cp>Build a one-page Assumption and Decision Record for a single synthetic insulated circuit (about 45 min, no company data — invent the circuit). Six columns: quantity, value, source (measured / estimated / assumed), confidence, named owner, re-open trigger. Populate it with every number the Track 2 arc actually produced — prior corrosion rate and its basis, posterior mean and credible interval, the coverage and POD credited to the last inspection, model calibration status, the risk acceptance threshold, the ta package has to contain, including data confidence grading and closing gaps with documented conservative assumptions. api 580/581 rbi inputs to inspection plans nwe group useful on source traceability and data-quality status per field — the practical shape of an assumption register. evergreening: write the re-open triggers before you need them, and mind the gap between the plan and what got done an rbi assessment is a snapshot of a belief about risk, and beliefs go stale. api rp 580 therefore treats reassessment as a required element rather than an optional refresh, and common industry practice is to revalidate risk rankings on a defined cycle — three to five years is the figure usually quoted — or sooner on process change or when inspection results show degradation running faster than","summaryHtml":"Digest #7, and a deliberate change of track. Digests #2 through #6 built a single arc on CUI prediction modelling: a physics-informed prior, a Bayesian posterior, a probability of exceedance that sets an interval, a back-test that says whether the numbers are honest, and a detection term that says what a clean inspection is actually worth. That arc is closed and it is technically defensible. It is also, on its own, not promotable. The gap between a Senior Inspection Engineer and a Lead is rarely analytical horsepower — it is whether the organisation can still rely on your position six months after you have left the room. That shifts the deliverable from the number to the record that carries it: what was assumed, on what basis, who owns it, and what would make you re-open it. This week covers what API RP 580 requires you to write down, what keeps that record alive, and a public regulatory audit published in June 2026 where the engineering was competent and the paperwork was the finding."},{"id":"AI_2026_08_22","stream":"asset","date":"2026-08-22","title":"API 579 Part 9 and the crack you found under the jacket: why the FAD passes an ECLSCC flaw that will still put you on the ground","summary":"Deep-Dive #1 took a CUI wall-loss finding through API 579 Part 5 and showed that a thin area below t_min can still be fit for service. This week takes the other finding that comes out from under the same jacket — external chloride stress corrosion cracking on austenitic stainless — into Part 9, Assessment of Crack-Like Flaws. The machinery is different: no remaining strength factor, no thickness averaging, but a fracture-mechanics assessment plotted on a Failure Assessment Diagram. The lesson is sharper than the machinery, and it is genuinely counter-intuitive. Run the numbers honestly on a lightly stressed austenitic line and the FAD will pass a crack that is eighty-five percent through the wall. That is not a defect in the standard. It is the standard telling you that fracture is not the governing limit state for this mechanism — and that if you read the pass as permission to run, you have used a correct calculation to answer the wrong question.","sections":[{"heading":"Concept of the week — the Failure Assessment Diagram, and the stress split that decides the answer","html":"\u003cp>Part 9 of API 579-1/ASME FFS-1 governs crack-like flaws: planar cracks, lack of fusion, lack of penetration, sharp groove-like corrosion, and — explicitly named in scope — environmental cracking. The first thing to internalise is that Part 9 uses a completely different acceptance criterion from the local metal loss work in Deep-Dive #1. Part 5 asks whether enough load-carrying material remains, and answers with a remaining strength factor. Part 9 asks whether a sharp flaw will propagate unstably, and answers with fracture mechanics. There is no RSF, no thickness averaging, no critical thickness profile. The inputs are a flaw depth, a flaw length, a stress field, and a material fracture toughness, and the output is a point plotted on a two-dimensional diagram.\u003c/p>\n\u003cp>The diagram is the \u003cstrong>Failure Assessment Diagram\u003c/strong>, and its two axes exist because a cracked component can fail two ways. The vertical axis is the toughness ratio, K_r, the ratio of the applied crack driving force to the material fracture toughness — the brittle-fracture axis. The horizontal axis is the load ratio, L_r, the ratio of a reference stress in the cracked ligament to the material yield strength — the plastic-collapse axis. Pure brittle fracture is the point (0, 1): no plasticity, failure when the driving force reaches toughness. Pure plastic collapse is the point (L_r max, 0): infinite toughness, failure when the remaining ligament yields through. Real components fail somewhere between, and the FAD curve is the locus of that transition. The Level 2 curve is the standard Option 1 form, K_r = (1 − 0.14·L_r²)·[0.3 + 0.7·exp(−0.65·L_r⁶)], valid up to a cut-off L_r max = (σ_ys + σ_uts)/(2·σ_ys). Plot your assessment point; inside the curve and left of the cut-off is acceptable, outside is not. The curve dips below both intercepts in the middle, and that dip is the whole reason the diagram exists: fracture and collapse \u003cstrong>interact\u003c/strong>, so a flaw comfortably safe against each mechanism taken alone can still be unacceptable when they are considered together.\u003c/p>\n\u003cp>The assessment levels follow the usual pattern but with a specific trap. Level 1 is a screening-curve route and its restrictions are severe — simple geometry, base metal or as-welded joints, membrane loading, and a known or assumed toughness. Level 2 is the real working method: full stress decomposition, stress intensity factor solutions from the Part 9 annexes, reference stress solutions, and the FAD plot. Level 3 is numerical, typically finite element with a J-integral evaluation, and it is also the route the standard points you to when a crack growth analysis is required. Level 2 in Part 9 also offers \u003cstrong>partial safety factors\u003c/strong> applied to stress, flaw size and fracture toughness, which is how the standard converts input uncertainty into margin. Note where the largest of those factors sits: on flaw size. The standard already knows that measured crack depth is the least reliable number you will bring to the assessment.\u003c/p>\n\u003cp>Now the part that decides more Part 9 assessments than anything else, and the part most often got wrong: \u003cstrong>the classification of stress into primary and secondary\u003c/strong>. Primary stresses are those needed to satisfy equilibrium with applied loads — pressure, weight, sustained mechanical loads. They are not relieved by local yielding, and they contribute to \u003cstrong>both\u003c/strong> axes: they drive K_r through the applied stress intensity factor, and they drive L_r through the reference stress. Secondary and residual stresses are self-equilibrating — thermal gradients, weld residual stress, fabrication and cold-work stress. They are relieved by local yielding, so they do \u003cstrong>not\u003c/strong> contribute to plastic collapse and do \u003cstrong>not\u003c/strong> appear in L_r. But they absolutely do contribute to the crack driving force, so they enter K_r, through a plasticity interaction factor that accounts for the coupling between the two stress systems. API 579 supplies default residual stress distributions for as-welded joints, and the default is unforgiving: in the absence of post-weld heat treatment or measured data, assume weld residual stress at yield magnitude through the thickness.\u003c/p>\n\u003cp>Carry that split as a working rule, because on an insulated stainless line it produces a specific and non-obvious consequence. The stress that drives external chloride SCC is overwhelmingly \u003cstrong>residual and fabrication stress, not pressure stress\u003c/strong>. A typical utility or process line in austenitic stainless is running a hoop membrane stress of a few tens of MPa against a yield-magnitude weld residual field an order of magnitude larger. So L_r is small, K_r is dominated by a term that has nothing to do with the process, and the practical corollary is one worth stating out loud in a review: \u003cstrong>you cannot de-risk external chloride SCC by de-rating the equipment\u003c/strong>. Dropping the MAWP moves your assessment point to the left along an axis that was never the problem, and barely moves it down the axis that was. The same logic explains why ECLSCC concentrates at welds, at cold-formed bends, at repair patches and at attachment welds regardless of where the pressure stress happens to be highest.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://becht.com/becht-blog/entry/ffs-assessment-of-crack-like-flaws-discovered-in-pressurized-equipment/\" target=\"_blank\" rel=\"noopener noreferrer\">FFS Assessment of Crack-like Flaws Discovered in Pressurized Equipment\u003c/a>\n        \u003cspan class=\"lnk-src\">Becht\u003c/span>\u003cspan class=\"lnk-note\">The clearest practitioner walk-through of the Part 9 sequence — characterise, recharacterise, plot on the FAD, then extend to crack growth and limiting flaw size.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.inspection-for-industry.com/api-579-part-9-crack-like-flaws-assessment.html\" target=\"_blank\" rel=\"noopener noreferrer\">API 579 Part 9 Crack-Like Flaws Assessment — screening and assessment levels\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspection for Industry\u003c/span>\u003cspan class=\"lnk-note\">Sets out what Level 1 screening actually restricts you to, which is the fastest way to see why almost every real ECLSCC finding goes to Level 2 or 3.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.codeware.com/products/inspect/api-579-part-9-level-1-and-2-crack-like-flaw-assessments/\" target=\"_blank\" rel=\"noopener noreferrer\">API 579 Part 9 Level 1 and 2 Crack-Like Flaw Assessments\u003c/a>\n        \u003cspan class=\"lnk-src\">Codeware\u003c/span>\u003cspan class=\"lnk-note\">A software-vendor description of the Level 1 and Level 2 inputs — useful as a checklist of every number you must supply before an assessment is possible.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.asnt.org/me/26/3/api-579-asme-ffs-1-fitness-for-service-evaluation\" target=\"_blank\" rel=\"noopener noreferrer\">API 579-1/ASME FFS-1: Fitness-For-Service Evaluation for Industry Assets\u003c/a>\n        \u003cspan class=\"lnk-src\">ASNT Materials Evaluation\u003c/span>\u003cspan class=\"lnk-note\">A 2026 overview of how FFS assessment consumes NDT output — read it for the inspection-side framing of what the assessment actually demands of you.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Where it bites — you cannot size the crack, you cannot bound its growth, and the FAD passes it anyway","html":"\u003cp>Work a synthetic case, because the numbers are the argument. Take a 6-inch Schedule 40S 304L line, OD 168.3 mm, wall 7.11 mm, insulated, operating at 90 °C under 2.0 MPa, with an axial ECLSCC crack found on the outside surface next to a girth weld after the jacket came off. Hoop membrane stress is P·D_mean/(2t) = 2.0 × 161.2 / (2 × 7.11) ≈ 22.7 MPa. Yield at temperature is on the order of 150 MPa. Assume the joint is as-welded, so residual stress is taken at yield magnitude, 150 MPa. Fracture toughness for austenitic stainless in this condition is very high — comfortably above 200 MPa·√m.\u003c/p>\n\u003cp>At a crack depth of 2 mm the applied stress intensity from pressure is roughly M·σ_m·√(π·a) ≈ 1.1 × 22.7 × 0.079 ≈ 2 MPa·√m, and the residual contribution is about 13 MPa·√m, so K_r is around 0.08. The reference stress on a simple ligament basis is σ_m/(1 − a/t) ≈ 31.6 MPa, giving L_r ≈ 0.21. The point (0.21, 0.08) is nowhere near the curve. Now push the crack to 6 mm in a 7.11 mm wall — eighty-five percent through. The reference stress climbs to about 145 MPa and L_r to about 0.97, because the remaining ligament is now close to yielding through. K_r rises to roughly 0.19. Evaluate the Level 2 curve at L_r = 0.97 and it sits at about 0.61, and the cut-off L_r max for 304L is about 1.9. The point (0.97, 0.19) is still \u003cstrong>inside\u003c/strong>. The assessment passes.\u003c/p>\n\u003cp>That result is correct arithmetic and it is the single most important thing to understand about applying Part 9 to this mechanism. Austenitic stainless steel is extremely tough and a lightly stressed utility line is nowhere near collapse, so the FAD has enormous headroom and will keep passing until the ligament itself gives out. What it is telling you is that \u003cstrong>brittle fracture is not the governing limit state for ECLSCC\u003c/strong>. The governing limit state is through-wall penetration — a leak, a loss of containment, and on hydrocarbon or cryogenic service the consequence is not proportional to the size of the hole. A Part 9 pass on an active chloride SCC crack demonstrates the pipe will not burst. It says nothing whatever about whether it will leak, and leaking is the failure you are actually managing.\u003c/p>\n\u003cp>The second problem is that Part 9 needs numbers you very probably do not have. The assessment consumes a depth, a. External chloride SCC is normally found by visual inspection and dye penetrant after insulation removal, and PT gives you \u003cstrong>length only\u003c/strong> — a surface trace, with no depth information at all. Depth sizing on austenitic stainless is genuinely hard: the coarse, anisotropic grain structure of wrought and welded austenitics scatters and attenuates ultrasound and generates spurious indications, so conventional UT and PAUT become reliable only once cracks are on the order of 2 to 3 mm deep. Eddy current array is the method of choice for \u003cstrong>detection\u003c/strong> of surface-breaking SCC and will map the network beautifully, but has historically not sized depth; tangential eddy current array is the recent advance aimed exactly at depth on shallow SCC clusters, and remains a specialist technique. So the honest position on a fresh finding is that you have a length, a lower bound on depth, and no upper bound. The only defensible conservative input is then a = t, through-wall — and if the assessment only passes because you assumed the crack was already through the wall, the assessment was not the thing that made the decision.\u003c/p>\n\u003cp>The third problem is growth, and it is the one that closes the argument. Part 9 assesses the flaw as it is now. To convert a pass into a run interval you need a crack growth law, and that is why the standard directs environmental cracking toward Level 3 with a remaining-life step. For chloride SCC in austenitics there is no defensible da/dt: growth rate varies over orders of magnitude with temperature, surface chloride concentration, moisture availability, pH, oxygen and stress state, and every one of those is uncontrolled and unmeasured under a jacket. You cannot substantiate a rate, so you cannot substantiate an interval, so a run-and-monitor decision has no technical floor under it. This is why the practical outcome of Part 9 on active environmental cracking is nearly always that either the flaw goes or the environment goes.\u003c/p>\n\u003cp>Two more things worth carrying. First, \u003cstrong>recharacterisation\u003c/strong>. ECLSCC does not arrive as a single planar crack; it arrives as a branched, multiply-initiated network, and Part 9 idealises flaws as single semi-elliptical surface cracks. The interaction rules require you to combine adjacent and parallel flaws into a bounding flaw, and on a dense SCC colony that bounding flaw is dramatically larger than any individual crack you can see — which is the correct answer, not a conservatism to argue away. Second, \u003cstrong>the removal route and where it lands you\u003c/strong>. The standard repair is to grind out the cracking, verify removal by PT on the excavated surface, and then assess the remaining wall. Note what that does: the excavation converts a Part 9 crack-like flaw problem into a Part 5 local metal loss problem — the RSF machinery from Deep-Dive #1 — which is exactly why those two parts belong in the same mental toolkit. The trap on the back end is that grinding leaves a cold-worked surface layer, so if the chloride environment is still present you have prepared the ground for re-initiation. Removing the crack without removing the water, the salt or the temperature buys a shorter interval than people expect.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2004-05-01/3178/99-diseases-of-pressure-equipm\" target=\"_blank\" rel=\"noopener noreferrer\">99 Diseases of Pressure Equipment: External Chloride Stress Corrosion Cracking\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering Journal\u003c/span>\u003cspan class=\"lnk-note\">The classic statement of the ECLSCC susceptibility envelope — most active roughly 60 to 150 °C, with documented cases well outside it, which is why a temperature screen alone is a weak filter.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.joiff.com/members/sharedlearning/topics/archive2011/documents/ChlorideStressCorrosionReportHSE.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Chloride Stress Corrosion Cracking in Austenitic Stainless Steel (HSE report)\u003c/a>\n        \u003cspan class=\"lnk-src\">UK Health and Safety Executive\u003c/span>\u003cspan class=\"lnk-note\">A regulator-level treatment of the mechanism, the role of residual and fabrication stress, and the detection difficulty — the source to quote when arguing that residual stress is the driver.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://blog.eddyfi.com/en/catch-chloride-stress-corrosion-cracking-cscc-early-with-eddy-current-array-eca\" target=\"_blank\" rel=\"noopener noreferrer\">Catch Chloride Stress Corrosion Cracking Early with Eddy Current Array\u003c/a>\n        \u003cspan class=\"lnk-src\">Eddyfi Technologies\u003c/span>\u003cspan class=\"lnk-note\">States plainly why UT on austenitics only becomes useful once cracks exceed roughly 2 to 3 mm — the sizing gap that sits between the finding and the Part 9 assessment.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://blog.eddyfi.com/en/dont-crack-under-pressure-how-eddy-current-array-helps-spot-chloride-stress-corrosion-cracking-in-stainless-steel-pipes\" target=\"_blank\" rel=\"noopener noreferrer\">How Eddy Current Array Helps Spot Chloride Stress Corrosion Cracking in Stainless Steel Pipes\u003c/a>\n        \u003cspan class=\"lnk-src\">Eddyfi Technologies\u003c/span>\u003cspan class=\"lnk-note\">Detection versus sizing on insulated stainless piping — read it for the distinction between mapping the network and supplying a depth.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Industry watch — the 2021 interaction rules, a 2026 pinhole leak, and depth sizing that is finally moving","html":"\u003cp>Code baseline first. API 579-1/ASME FFS-1 remains at its \u003cstrong>4th Edition, published December 2021\u003c/strong>, unsuperseded as of August 2026, and it carries a published errata. Deep-Dive #1 flagged the proposed Part 16 for fibre reinforced polymer equipment as the visible development work; the change that matters for this week is inside Part 9 itself. The 4th Edition \u003cstrong>redefined the crack-like flaw interaction and recategorisation rules\u003c/strong>, explicitly to reduce conservatism and to align better with ASME Section XI. That is directly load-bearing for ECLSCC work, because the interaction rules are what turn a colony of individual cracks into the single bounding flaw you assess. Two engineers assessing the same SCC network under different editions can arrive at materially different assessed flaw dimensions, and therefore at different answers. When you review an FFS report on a cracking finding, the edition of the interaction rules used is a legitimate and often overlooked review question — and it is the sort of check that separates a reviewer from a reader.\u003c/p>\n\u003cp>On the failure side there is a current case worth reading rather than a historical one. Early in 2026 a petrochemical refinery took an unplanned shutdown from a \u003cstrong>pinhole leak in insulated 304L stainless steel\u003c/strong>, with the root cause analysis identifying chloride-induced stress corrosion cracking. Note the failure mode in that sentence: not a rupture, not a burst, a \u003cstrong>pinhole\u003c/strong>. That is the empirical version of the FAD argument in the section above. The line did not fail by fracture or collapse; it failed by a crack reaching the far surface, and the consequence came from loss of containment and the unplanned outage, not from structural failure. It is a useful case to put in front of anyone who reads a Part 9 pass as a licence to run.\u003c/p>\n\u003cp>The same period produced a materials-side framework worth knowing, in the April 2026 issue of Stainless Steel World, which organises chloride corrosion and SCC management around the pitting resistance equivalent number as a measure of passive film stability and pit nucleation resistance. Its most useful conclusion for an inspection engineer is a corrective one: \u003cstrong>316L is not a universal fix for chloride SCC\u003c/strong>. Molybdenum makes pit initiation less likely relative to 304L, but once localised attack has started, 316L remains highly susceptible to cracking. The mitigation that actually changes the mechanism is a change of microstructure — duplex grades, whose dual-phase structure both reduces susceptibility and arrests cracks at phase boundaries, or nickel alloys where the environment justifies them. This matters when you are asked to endorse a material upgrade in a repair or replacement scope: a 304L to 316L substitution buys less than the specification change suggests, and if the driver is external chloride under insulation, the higher-leverage change is usually to the barrier system and the chloride source rather than to the pipe.\u003c/p>\n\u003cp>Finally, the technology gap identified above is genuinely narrowing. \u003cstrong>Tangential eddy current array\u003c/strong> is being applied to depth assessment of shallow SCC clusters, which is the specific measurement that has been missing — historically ECA detected and PAUT sized, with a gap between them where shallow cracks in coarse-grained austenitics fell through. Track it, because it directly changes what you can put in front of a Part 9 assessment. The way to frame that in a proposal is the same structural argument as the moisture-sensor case in Deep-Dive #2: this is not an incremental improvement in data quality, it is the difference between having an input and not having one. Without a credible depth you must assume through-wall and the assessment cannot support a decision; with one, Part 9 becomes usable and the run-versus-repair conversation acquires an actual technical basis. That is a much stronger argument for a technique trial than better detection.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://cadeengineering.com/asme-api-579-1-asme-ffs-1-new-edition-2021/\" target=\"_blank\" rel=\"noopener noreferrer\">ASME API 579-1 / ASME FFS-1 New Edition 2021 — summary of changes\u003c/a>\n        \u003cspan class=\"lnk-src\">CADE Engineered Technologies\u003c/span>\u003cspan class=\"lnk-note\">Lists the 4th Edition changes including the redefined crack-like flaw interaction and recategorisation rules aligned to ASME Section XI — the change that moves assessed flaw size on SCC colonies.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://cstools.asme.org/csconnect/Filedownload.cfm?thisfile=R023879.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Errata 1 for API 579-1/ASME FFS-1 2021 Edition\u003c/a>\n        \u003cspan class=\"lnk-src\">ASME Codes and Standards Connect\u003c/span>\u003cspan class=\"lnk-note\">The published errata against the current edition — worth a scan before you rely on a printed equation.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://stainless-steel-world.net/managing-chloride-induced-corrosion-and-scc/\" target=\"_blank\" rel=\"noopener noreferrer\">Managing chloride-induced corrosion and SCC\u003c/a>\n        \u003cspan class=\"lnk-src\">Stainless Steel World\u003c/span>\u003cspan class=\"lnk-note\">April 2026 — the PREN framework, the 2026 insulated 304L pinhole-leak case, and the argument that 316L is not a universal fix for chloride SCC.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.researchgate.net/publication/390858641_Recent_Advances_in_Depth_Assessment_of_Stress_Corrosion_Cracking_Using_Tangential_Eddy_Current_Array_on_Carbon_Steel_Pipelines\" target=\"_blank\" rel=\"noopener noreferrer\">Recent Advances in Depth Assessment of Stress Corrosion Cracking Using Tangential Eddy Current Array\u003c/a>\n        \u003cspan class=\"lnk-src\">ResearchGate\u003c/span>\u003cspan class=\"lnk-note\">The emerging answer to shallow-SCC depth sizing — the input Part 9 needs and that PT and conventional UT cannot supply.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Plot a Part 9 assessment point yourself and watch it pass when it should not comfort you (~45-60 min, SYNTHETIC data only — invent every number, no plant files, no real tag numbers). Part A, the FAD sweep: take a 6-inch Sch 40S 304L insulated line, OD 168.3 mm, wall t = 7.11 mm, internal pressure 2.0 MPa, operating 90 °C, yield 150 MPa, tensile 485 MPa, fracture toughness 200 MPa·√m, as-welded so residual stress = 150 MPa through thickness. Compute hoop membrane stress from P·D_mean/(2t). Then for crack depths a = 1, 2, 4 and 6 mm compute (i) L_r using the simple ligament reference stress σ_m/(1 − a/t), (ii) K_r = [M·σ_m·√(πa) + M·σ_res·√(πa)] / K_mat with M taken as 1.1 for a ≤ 2 mm and 1.6 above, and (iii) the allowable K_r from the Level 2 curve K_r = (1 − 0.14·L_r²)·[0.3 + 0.7·exp(−0.65·L_r⁶)]. Tabulate assessment K_r against allowable K_r and mark which depths pass. Write one sentence on what the a = 6 mm row means physically. Part B, the sensitivity that matters: rerun the a = 4 mm case twice — once with pressure halved (the de-rating lever) and once with residual stress removed as if the joint had been post-weld heat treated. Compare how far each moves the assessment point, and state in one line which lever actually controls the answer for this mechanism. Part C, the decision memo: in no more than 150 words, write the recommendation you would sign for a real finding of this kind, given that PT gave you a 60 mm surface length and no depth at all. It must name the input you do not have, state what you assumed instead, say what the FAD result does and does not demonstrate, and give the disposition — grind out and reassess the excavation under Part 5, repair, replace, or run — with the reason. If your memo cannot justify a run interval, say so explicitly and name the missing quantity that would be needed to justify one.","html":"\u003cp>Plot a Part 9 assessment point yourself and watch it pass when it should not comfort you (~45-60 min, SYNTHETIC data only — invent every number, no plant files, no real tag numbers). Part A, the FAD sweep: take a 6-inch Sch 40S 304L insulated line, OD 168.3 mm, wall t = 7.11 mm, internal pressure 2.0 MPa, operating 90 °C, yield 150 MPa, tensile 485 MPa, fracture toughness 200 MPa·√m, as-welded so residual stress = 150 MPa through thickness. Compute hoop membrane stress from P·D_mean/(2t). Then for crack depths a = 1, 2, 4 and 6 mm compute (i) L_r using the simple ligament reference stress σ_m/(1 − a/t), (ii) K_r = [M·σ_m·√(πa) + M·σ_res·√(πa)] / K_mat with M taken as 1.1 for a ≤ 2 mm and 1.6 above, and (iii) the allowable K_r from the Level 2 curve K_r = (1 − 0.14·L_r²)·[0.3 + 0.7·exp(−0.65·L_r⁶)]. Tabulate assessment K_r against allowable K_r and mark which depths pass. Write one sentence on what the a = 6 mm row means physically. Part B, the sensitivity that matters: rerun the a = 4 mm case twice — once with pressure halved (the de-rating lever) and once with residual stress removed as if the joint had been post-weld heat treated. Compare how far each moves the assessment point, and state in one line which lever actually controls the answer for this mechanism. Part C, the decision memo: in no more than 150 words, write the recommendation you would sign for a real finding of this kind, given that PT gave you a 60 mm surface length and no depth at all. It must name the input you do not have, state what you assumed instead, say what the FAD result does and does not demonstrate, and give the disposition — grind out and reassess the excavation under Part 5, repair, replace, or run — with the reason. If your memo cannot justify a run interval, say so explicitly and name the missing quantity that would be needed to justify one.\u003c/p>"},"number":4,"minutes":14,"words":3084,"q":"api 579 part 9 and the crack you found under the jacket: why the fad passes an eclscc flaw that will still put you on the ground deep-dive #1 took a cui wall-loss finding through api 579 part 5 and showed that a thin area below t_min can still be fit for service. this week takes the other finding that comes out from under the same jacket — external chloride stress corrosion cracking on austenitic stainless — into part 9, assessment of crack-like flaws. the machinery is different: no remaining strength factor, no thickness averaging, but a fracture-mechanics assessment plotted on a failure assessment diagram. the lesson is sharper than the machinery, and it is genuinely counter-intuitive. run the numbers honestly on a lightly stressed austenitic line and the fad will pass a crack that is eighty-five percent through the wall. that is not a defect in the standard. it is the standard telling you that fracture is not the governing limit state for this mechanism — and that if you read the pass as permission to run, you have used a correct calculation to answer the wrong question. concept of the week — the failure assessment diagram, and the stress split that decides the answer part 9 of api 579-1/asme ffs-1 governs crack-like flaws: planar cracks, lack of fusion, lack of penetration, sharp groove-like corrosion, and — explicitly named in scope — environmental cracking. the first thing to internalise is that part 9 uses a completely different acceptance criterion from the local metal loss work in deep-dive #1. part 5 asks whether enough load-carrying material remains, and answers with a remaining strength factor. part 9 asks whether a sharp flaw will propagate unstably, and answers with fracture mechanics. there is no rsf, no thickness averaging, no critical thickness profile. the inputs are a flaw depth, a flaw length, a stress field, and a material fracture toughness, and the output is a point plotted on a two-dimensional diagram. the diagram is the failure assessment diagram , and its two axes exist because a cracked component can fail two ways. the vertical axis is the toughness ratio, k_r, the ratio of the applied crack driving force to the material fracture toughness — the brittle-fracture axis. the horizontal axis is the load ratio, l_r, the ratio of a reference stress in the cracked ligament to the material yield strength — the plastic-collapse axis. pure brittle fracture is the point (0, 1): no plasticity, failure when the driving force reaches toughness. pure plastic collapse is the point (l_r max, 0): infinite toughness, failure when the remaining ligament yields through. real components fail somewhere between, and the fad curve is the locus of that transition. the level 2 curve is the standard option 1 form, k_r = (1 − 0.14·l_r²)·[0.3 + 0.7·exp(−0.65·l_r⁶)], valid up to a cut-off l_r max = (σ_ys + σ_uts)/(2·σ_ys). plot your assessment point; inside the curve and left of the cut-off is acceptable, outside is not. the curve dips below both intercepts in the middle, and that dip is the whole reason the diagram exists: fracture and collapse interact , so a flaw comfortably safe against each mechanism taken alone can still be unacceptable when they are considered together. the assessment levels follow the usual pattern but with a specific trap. level 1 is a screening-curve route and its restrictions are severe — simple geometry, base metal or as-welded joints, membrane loading, and a known or assumed toughness. level 2 is the real working method: full stress decomposition, stress intensity factor solutions from the part 9 annexes, reference stress solutions, and the fad plot. level 3 is numerical, typically finite element with a j-integral evaluation, and it is also the route the standard points you to when a crack growth analysis is required. level 2 in part 9 also offers partial safety factors applied to stress, flaw size and fracture toughness, which is how the standard converts input uncertainty into margin. note where the largest of those factors sits: on flaw size. the standard already knows that measured crack depth is the least reliable number you will bring to the assessment. now the part that decides more part 9 assessments than anything else, and the part most often got wrong: the classification of stress into primary and secondary . primary stresses are those needed to satisfy equilibrium with applied loads — pressure, weight, sustained mechanical loads. they are not relieved by local yielding, and they contribute to both axes: they drive k_r through the applied stress intensity factor, and they drive l_r through the reference stress. secondary and residual stresses are self-equilibrating — thermal gradients, weld residual stress, fabrication and cold-work stress. they are relieved by local yielding, so they do not contribute to plastic collapse and do not appear in l_r. but they absolutely do contribute to the crack driving force, so they enter k_r, through a plasticity interaction factor that accounts for the coupling between the two stress systems. api 579 supplies default residual stress distributions for as-welded joints, and the default is unforgiving: in the absence of post-weld heat treatment or measured data, assume weld residual stress at yield magnitude through the thickness. carry that split as a working rule, because on an insulated stainless line it produces a specific and non-obvious consequence. the stress that drives external chloride scc is overwhelmingly residual and fabrication stress, not pressure stress . a typical utility or process line in austenitic stainless is running a hoop membrane stress of a few tens of mpa against a yield-magnitude weld residual field an order of magnitude larger. so l_r is small, k_r is dominated by a term that has nothing to do with the process, and the practical corollary is one worth stating out loud in a review: you cannot de-risk external chloride scc by de-rating the equipment . dropping the mawp moves your assessment po","summaryHtml":"Deep-Dive #1 took a CUI wall-loss finding through API 579 Part 5 and showed that a thin area below t_min can still be fit for service. This week takes the other finding that comes out from under the same jacket — external chloride stress corrosion cracking on austenitic stainless — into Part 9, Assessment of Crack-Like Flaws. The machinery is different: no remaining strength factor, no thickness averaging, but a fracture-mechanics assessment plotted on a Failure Assessment Diagram. The lesson is sharper than the machinery, and it is genuinely counter-intuitive. Run the numbers honestly on a lightly stressed austenitic line and the FAD will pass a crack that is eighty-five percent through the wall. That is not a defect in the standard. It is the standard telling you that fracture is not the governing limit state for this mechanism — and that if you read the pass as permission to run, you have used a correct calculation to answer the wrong question."},{"id":"AI_2026_08_21","stream":"asset","date":"2026-08-21","title":"Corrosion loops and CMLs: what a handful of thickness readings can and cannot tell you about a circuit","summary":"Deep-Dive #1 assessed damage after it was found. Deep-Dive #2 built the tripwire that warns you the rate assumption has moved. This one goes underneath both of them, to the measurement set that everything else is computed from. A corrosion loop is a claim about where degradation is the same; a CML set is a sample drawn from that claim; and a corrosion rate is the difference between two noisy numbers. Almost every integrity output you produce — a remaining life, an API 581 damage factor, an FCA in an API 579 assessment — is an inference from that sample. This week is about what the sample can honestly support, where the estimator breaks, and why the CML paradigm that works well for internal thinning transfers badly to CUI.","sections":[{"heading":"Concept of the week — the loop is the inference unit, the CML set is a sample, and the rate is a difference of two noisy numbers","html":"\u003cp>Start with the object, because the definition carries more weight than it looks. A corrosion loop groups equipment and piping that share a process environment, materials of construction, and operating conditions, and that are therefore subject to the same damage mechanisms \u003cstrong>at approximately the same rates\u003c/strong>. That last clause is not decoration — it is the entire licence for what you do next. Because you assert the rate is common across the loop, you are entitled to pool data across components inside it: a reading taken on one spool becomes evidence about a spool fifty metres away that you did not touch. A circuit is the piping-side bookkeeping unit that inherits that assertion. If you cannot defend &quot;same mechanism, similar rate&quot; for two components, they do not belong in the same loop, and any pooling you do across them is not conservatism, it is contamination.\u003c/p>\n\u003cp>Once you see the loop as an inference unit, the CML set becomes what it actually is: \u003cstrong>a sample from a spatial distribution of wall thickness\u003c/strong>, and the question &quot;how many CMLs&quot; turns into &quot;how well does this sample estimate the quantity my decision depends on&quot;. API 570 deliberately does not prescribe a count per unit length. It requires that the number and placement be sufficient to characterise the corrosion behaviour of the circuit, and that placement follow the dominant damage mechanism and be documented and repeatable. That is not vagueness. The right count genuinely depends on the shape of the thickness distribution, which depends on the mechanism, and no table can encode that. Under general thinning the distribution is tight and roughly symmetric, the decision quantity is close to the loop mean, sampling error falls as the spatial standard deviation over the square root of N, and a modest, well-placed set is genuinely adequate. That is the case the CML concept was designed for, and in that case it works.\u003c/p>\n\u003cp>The second structural point is about \u003cstrong>fixed versus relocated CMLs\u003c/strong>, and it is the one most often got wrong in practice. A corrosion rate is not a measurement; it is the difference between two measurements divided by the time between them. When you re-read the same physical point, with the same procedure and ideally comparable surface preparation, a large part of the systematic error — probe placement, surface roughness, couplant, calibration bias, operator technique — is common to both readings and cancels in the difference. That cancellation is the whole reason CMLs are permanently marked and given identities. The moment an inspector cannot find the mark and takes the reading 150 mm away, you have differenced two independent draws from the spatial distribution and then divided by time. What you get is not a corrosion rate, it is spatial variability wearing a corrosion rate's units. This is the origin of the two signatures every reviewer should recognise instantly: apparent negative corrosion, where the wall has grown since last time, and a single implausible high rate on one CML in a circuit that is otherwise quiet. Both are usually location errors, not corrosion.\u003c/p>\n\u003cp>Now the arithmetic that makes this concrete, and it is worth carrying as a number rather than a feeling. Take an ultrasonic thickness reading with a standard deviation of about 0.15 mm on real plant surfaces — a fair working figure once you include surface condition and operator effects, and easily worse through coating or on a rough external surface. The difference between two such readings has a standard deviation of roughly 0.15 times the square root of 2, about 0.21 mm. Divide by a four-year interval and the noise on your corrosion rate has a standard deviation of about 0.053 mm/yr, before any corrosion has happened at all. On a circuit genuinely corroding at 0.30 mm/yr that noise is under a fifth of the signal and you can live with it. On a circuit genuinely corroding at 0.05 mm/yr, the noise is as large as the entire rate. The measured short-term rate on that circuit is essentially a random number, and half the CMLs will show negative corrosion.\u003c/p>\n\u003cp>Two consequences follow, and they are the practical takeaway. First, \u003cstrong>there is a minimum interval below which a short-term rate cannot mean anything\u003c/strong>, and it depends on how slowly the circuit is corroding: real loss between readings has to be comfortably larger than about 0.2 mm of differencing noise. This is the honest reason API 570 has you compute both long-term and short-term rates and apply judgement rather than mechanically taking the latest number — the short-term rate is the noisier estimator by construction, and on slow circuits it is dominated by noise. Second, \u003cstrong>if you cannot wait, you can average\u003c/strong>. Pooling across N CMLs in a genuine loop reduces the noise on the loop rate by the square root of N, so recovering a 0.05 mm/yr rate to within 20 percent on a four-year interval needs on the order of 28 CMLs behaving as one population — which is only legitimate if the loop assertion is true. This is the quiet reason a well-drawn loop is worth more than extra readings: the loop is what lets you average at all.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://arvengtraining.com/en/placement-of-condition-monitoring-locations-according-to-api-570/\" target=\"_blank\" rel=\"noopener noreferrer\">Placement of Condition Monitoring Locations According to API 570\u003c/a>\n        \u003cspan class=\"lnk-src\">Arveng Training &amp; Engineering\u003c/span>\u003cspan class=\"lnk-note\">The clearest short statement of what API 570 does and does not require on CML count and placement — useful precisely because it shows the code sets a sufficiency test, not a number.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.gate.energy/the-brainery/choosing-amp-using-condition-monitoring-locations-cmls\" target=\"_blank\" rel=\"noopener noreferrer\">Choosing and Using Condition Monitoring Locations (CMLs)\u003c/a>\n        \u003cspan class=\"lnk-src\">GATE Energy\u003c/span>\u003cspan class=\"lnk-note\">Practical treatment of CML identity, marking and repeatability — the mechanics behind why a relocated reading destroys the rate.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2021-02-25/9541/piping-cml-optimization-optimizing-the-definition\" target=\"_blank\" rel=\"noopener noreferrer\">Piping CML Optimization: Optimizing the Definition\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering Journal\u003c/span>\u003cspan class=\"lnk-note\">Argues that most CML programmes fail at the definition step rather than the counting step — the same claim this section makes about the loop being the inference unit.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/corrosion+loop\" target=\"_blank\" rel=\"noopener noreferrer\">Corrosion Loop (topic index)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Running index of corrosion-loop and corrosion-control-document coverage, for the loop-drawing half of the exercise.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Where the estimator breaks — localised damage, and why the CUI loop is not the process loop","html":"\u003cp>Everything above holds while the damage is general. Localised damage breaks it, and it breaks it in a specific, quantifiable way that is worth being precise about. When damage is localised, the decision quantity is no longer the loop mean, it is the loop \u003cstrong>minimum\u003c/strong> — the deepest spot, wherever it is. And the minimum of N fixed CMLs is a \u003cstrong>biased-high estimator of the true minimum\u003c/strong>: it can only ever report the shallowest-of-the-deep points you happened to have marked, and it is blind to everything else. If a circuit has M plausible damage sites and you have N fixed CMLs on it, the probability that your set contains the worst one is on the order of N over M, which for realistic numbers is small. Worse, the bias is not conservative in the direction you would like — it systematically overstates remaining wall, and it does so more severely the more localised the damage is, which is exactly when the consequence of overstating is highest.\u003c/p>\n\u003cp>The crucial corollary is that \u003cstrong>adding fixed CMLs does not fix this\u003c/strong>. Doubling from 20 points to 40 on a circuit with 400 candidate sites moves your chance of landing on the worst spot from about 5 percent to about 10 percent, at double the cost, and leaves you with the same structurally biased estimator. What fixes it is a change of measurement modality, not of point count: full-coverage or high-coverage screening — scanned UT or corrosion mapping, profile radiography, PEC grids, laser or 3D scanning — over the area, then targeted characterisation of what the screen flags. That is the technical content behind the doctrine of screen broadly, characterise narrowly, and it is the same reasoning that says a PEC footprint average cannot serve as a minimum thickness. Point sampling estimates a mean well and a minimum badly; area methods estimate a minimum well because they are not sampling at all.\u003c/p>\n\u003cp>CUI is the case where this bites hardest, and where the CML paradigm needs to be redrawn rather than adjusted. The classical corrosion loop is defined by what is \u003cstrong>inside\u003c/strong> the pipe: process fluid, temperature, pressure, contaminants, materials. CUI is driven by what is \u003cstrong>outside\u003c/strong> it — liquid water held against the steel under a barrier — and the variables that control that have almost nothing to do with the process stream. A CUI loop is properly defined by surface-temperature history including idle and spared time, insulation type and age, jacket and vapour-barrier type and condition, coating specification and age, water-ingress and water-trapping geometry (supports and shoes, penetrations, nozzles and branch connections, valves and flanges, low points, dead ends, terminations, vertical-to-horizontal transitions, damaged or dented cladding), and local exposure such as coastal salt aerosol, cooling-tower drift, or a steam vent. Two lines in identical process service belong in different CUI loops if one carries 1990s mineral wool under aged aluminium and the other carries cellular glass installed last year. And conversely, a hot line and a cold line in completely different services can share a CUI loop if they share a jacket condition, a geometry and an exposure. Redrawing the loops on those criteria is the single highest-leverage thing most CUI programmes have not done, because every downstream pooling argument inherits it.\u003c/p>\n\u003cp>The measurement changes character too. A CUI CML is not a readable point — it is an \u003cstrong>insulation removal\u003c/strong>, a destructive sample of the barrier that costs real money and degrades the very system you are trying to preserve, since a re-made jacket seldom matches the original. So you are permitted only a few, and the sampling arithmetic gets unforgiving. Suppose you strip a set of openings on a circuit and find nothing. What upper bound does that put on how widespread the damage is? The rule of three is the tool: with n independent clean samples and no findings, the 95 percent upper confidence bound on the underlying prevalence is approximately three divided by n. Ten clean openings bound prevalence at about 26 percent. Twenty bound it at about 14 percent. To get the bound below 10 percent you need on the order of 30 clean openings on that one circuit. And the finite-population correction rescues almost nothing: on a circuit with about 40 susceptible locations, ten clean openings still only exclude prevalence above roughly 25 percent. Two clean strip points, which is what many programmes actually execute, tell you essentially nothing — the honest bound is above 75 percent.\u003c/p>\n\u003cp>That arithmetic is the real argument for the strategy, and it should change how you write the conclusion of a survey. Random or convenience openings can never be your primary evidence, because the sample sizes required to bound prevalence are unaffordable. Three routes remain, and a mature programme runs all three: \u003cstrong>stratify\u003c/strong> — place openings deliberately on the water-trapping geometry, which is a far more efficient design because it samples the high-prevalence stratum, with the strict condition that you may then report a bound on that stratum only and never quote it as a circuit-wide prevalence (a common and serious reporting error in both directions); \u003cstrong>screen\u003c/strong> — use methods that cover area rather than points, so that coverage stops being a sampling fraction at all; and \u003cstrong>monitor\u003c/strong> — instrument the barrier state continuously, which is the argument for under-insulation moisture sensing and the reason it belongs in this discussion rather than in a technology roadmap. Finally, note that the rule-of-three bound assumes an opening reveals damage that is present. It does not, quite, so every bound quoted above is optimistic and the true bound is wider still.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2012-11-01/2995/a-discussion-on-the-piping-thi\" target=\"_blank\" rel=\"noopener noreferrer\">A Discussion on Piping Thickness Measurement and CML Placement\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering Journal\u003c/span>\u003cspan class=\"lnk-note\">The foundational treatment of point sampling versus the damage you are trying to catch — still the clearest statement of why placement beats count.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S0957582024003732\" target=\"_blank\" rel=\"noopener noreferrer\">Statistical study of localized internal corrosion defects in oil and gas pipelines through sampling inspection\u003c/a>\n        \u003cspan class=\"lnk-src\">Process Safety and Environmental Protection (ScienceDirect)\u003c/span>\u003cspan class=\"lnk-note\">What a sampling inspection can and cannot infer about a defect population — the peer-reviewed version of the prevalence-bound argument above.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S0010938X1530161X\" target=\"_blank\" rel=\"noopener noreferrer\">Sample selection for extreme value analysis of inspection data collected from corroded surfaces\u003c/a>\n        \u003cspan class=\"lnk-src\">Corrosion Science (ScienceDirect)\u003c/span>\u003cspan class=\"lnk-note\">Directly on how sample selection biases an estimate of the worst-case wall loss — read the sample-selection section, it is the localised-damage estimator problem stated formally.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/condition+monitoring+locations\" target=\"_blank\" rel=\"noopener noreferrer\">Condition Monitoring Locations (CMLs) — topic index\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Running index for CML practice, including the external-corrosion and CUI-specific treatments.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Industry watch — RP 574 moved the structural minimum thickness floor, and CML optimisation went hierarchical","html":"\u003cp>Take the code baseline first, because two of the documents that govern this material moved recently and together. API 570 is on its 5th Edition, published February 2024, with Addendum 1 issued in 2025 and a further amendment dated 1 October 2025. Its companion recommended practice, API RP 574, Inspection Practices for Piping System Components, also went to a 5th Edition in February 2024. RP 574 is the document that actually carries the practical CML guidance that API 570 only requires in principle, and the 5th Edition added material on selecting inspection activities and on selecting locations for inspection — plus, of direct interest to your programme, new guidance on \u003cstrong>stainless steel tubing in chloride service\u003c/strong>, which is the small-bore end of the ECLSCC problem and is routinely omitted from piping inspection plans because tubing sits in a documentation gap between piping and instrumentation.\u003c/p>\n\u003cp>The change with the sharpest teeth, though, is that RP 574's \u003cstrong>piping structural minimum thickness values were revised on a new technical basis\u003c/strong>. This matters more to CUI work than it first appears. For large-diameter, low-pressure piping — flare headers, vapour lines, utility and relief piping, much of it insulated — the governing retirement thickness is usually not the pressure-design thickness at all; it is the structural minimum needed to carry the pipe's own weight, contents, and span loading between supports. External metal loss on exactly those lines is the CUI case. So a revision to a structural-minimum table can move the retirement thickness, and therefore the remaining life and the next inspection date, on a large slice of your insulated inventory \u003cstrong>without a single reading changing\u003c/strong>. The action is concrete and worth doing once: pull a sample of your insulated circuits and check, for each, whether t_min is pressure-governed or structurally governed, and which edition of the table your structural values came from. Any circuit where the answer is a table value carried forward from an older document is a circuit whose remaining life has an undocumented dependency.\u003c/p>\n\u003cp>On the practice side, CML optimisation has quietly become a statistics discipline. The direction worth knowing is \u003cstrong>hierarchical Bayesian modelling of CMLs\u003c/strong> — approaches in which CMLs borrow strength from one another while still being allowed to behave independently where the data demands it. That is worth pausing on, because it is the formal version of something you already assert informally every time you draw a loop. A corrosion loop says &quot;these components share a rate&quot;, and pooling their data is the consequence. Total pooling ignores real component-to-component variation; no pooling throws away the loop assertion and leaves every CML to be estimated from its own two noisy readings, with all the noise problems from the first section. Partial pooling is the middle, and its appeal is that it does not require you to be right about the loop — it lets the data decide how much pooling the evidence supports, and shrinks
