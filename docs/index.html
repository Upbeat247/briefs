ture mostly skips.\u003c/p>\n\u003cp>Carry forward the same caveat as always: any validation built on inspection records inherits the coverage and detection limits of the program that produced them. A calibration curve is an argument, not a proof, and its scope statement is where its honesty lives.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.nature.com/articles/s41529-026-00761-4\" target=\"_blank\" rel=\"noopener noreferrer\">Advanced sensor systems and machine learning for pipeline integrity management (2026)\u003c/a>\n        \u003cspan class=\"lnk-src\">npj Materials Degradation (Nature)\u003c/span>\u003cspan class=\"lnk-note\">This week's current development — a 2026 review of sensor-plus-ML integrity, honest about the validation/generalisation gap you are learning to close.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S2949822826009019\" target=\"_blank\" rel=\"noopener noreferrer\">A review of machine learning-based approaches for corrosion rate prediction\u003c/a>\n        \u003cspan class=\"lnk-src\">Elsevier\u003c/span>\u003cspan class=\"lnk-note\">Companion survey of corrosion-rate ML methods — read it counting how many report calibration rather than only fit accuracy.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2012-07-01/537/risk-based-inspection---settin\" target=\"_blank\" rel=\"noopener noreferrer\">Risk Based Inspection — Setting Risk Targets\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Revisit from Digest #4: the threshold your calibrated POE is finally compared against is still an Owner/User risk target, not a model output.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Extend the script one more step (~30-45 min, SYNTHETIC data only). Generate 200 synthetic components with true corrosion rates drawn from a distribution; for each, compute the model POE at a fixed interval, then simulate the \"truth\" (did it actually exceed?). Bin the components by predicted POE (e.g. deciles), and for each bin plot observed exceedance fraction vs predicted — that is your reliability diagram. Compute the Brier score. Now inject the censoring bias: randomly mark 40% of components \"never inspected,\" drop their exceedances from the observed set, and re-plot — watch the curve move toward looking better-calibrated than it is. The one-line finding: which direction the bias pushes your apparent calibration, and why that is the dangerous direction.","html":"\u003cp>Extend the script one more step (~30-45 min, SYNTHETIC data only). Generate 200 synthetic components with true corrosion rates drawn from a distribution; for each, compute the model POE at a fixed interval, then simulate the &quot;truth&quot; (did it actually exceed?). Bin the components by predicted POE (e.g. deciles), and for each bin plot observed exceedance fraction vs predicted — that is your reliability diagram. Compute the Brier score. Now inject the censoring bias: randomly mark 40% of components &quot;never inspected,&quot; drop their exceedances from the observed set, and re-plot — watch the curve move toward looking better-calibrated than it is. The one-line finding: which direction the bias pushes your apparent calibration, and why that is the dangerous direction.\u003c/p>"},"number":5,"minutes":6,"words":1351,"q":"does the model actually work? — back-testing, calibration, and the two questions they answer digest #5 (track 2). four weeks built a model that turns a physics prior plus sensor and ut evidence into a posterior, then into a probability of exceedance and a date. this week asks the only question a lead will be asked in the review: how do you know it is right? the answer is back-testing, and it has a sharp internal structure — a model can rank components perfectly and still hand you dangerously wrong dates. separating those two failure modes, and knowing which one your interval decision depends on, is the whole lesson. discrimination vs calibration — two different questions, and only one sets your date a prediction model can be graded on two independent axes, and conflating them is the most common mistake in defending a model-derived interval. discrimination asks: does the model rank components in the right order — are the ones it scores worst actually the ones that corrode fastest? you measure it with rank metrics (roc-auc, rank correlation against observed metal loss). good discrimination is what lets an rbi program point the next turnaround at the right lines. but discrimination is scale-free: a model can rank a hundred circuits in perfect worst-first order while every single poe number it prints is wrong by a factor of three. calibration asks the harder question: when the model says 5% probability of exceedance, does roughly 5% actually exceed? a perfectly calibrated model's stated probabilities match observed frequencies. this is the axis that governs interval-setting, because last week's decision compared an absolute poe number against an absolute acceptance threshold. if the model is well-ordered but systematically under-predicts — says 2% when the truth is 15% — every interval it produces is too long, and it will do so confidently and consistently. discrimination cannot catch that error; only calibration can. the tool for seeing it is the reliability diagram: bin components by predicted poe, and for each bin plot the observed exceedance fraction against the predicted value. perfect calibration lies on the 45° line; points below the line mean the model is over-confident (predicting more failures than occur), points above mean it is under-predicting — the unsafe direction for an interval extension. the single-number companion is the brier score — the mean squared error between predicted probability and the 0/1 outcome, lower is better. it bundles calibration and discrimination into one scalar, which is convenient for tracking a model version-to-version but useless for diagnosis, because it cannot tell you which of the two axes moved. report the reliability diagram to diagnose and the brier score to trend; never report only the brier score. sources probability calibration — scikit-learn documentation scikit-learn the exact tools your back-test needs — calibration_curve for the reliability diagram and brier_score_loss — with runnable examples. calibration checks: brier score and reliability diagrams statstest plain-language explainer of the two metrics you will quote in the review, and how to read the diagram. model calibration, explained: a visual guide with code towards data science visual walk-through of why a well-ranking model can still be badly calibrated — the core distinction of this week. back-testing on cui finding history — the rare-event trap and the censoring trap back-testing sounds simple: freeze the model at a past date, let it predict, then score its predictions against what inspections later found. on cui finding history, two traps make a naive back-test lie in your favour. the first is the rare-event (base-rate) trap. cui exceedances are uncommon per inspection — most cmls on most rounds are fine. if the true exceedance base rate is 5%, a lazy model that predicts 5% for everything scores a brier of about 0.0475 and an accuracy of 95%, and has told you literally nothing. rare outcomes make aggregate scores look excellent by default. that is why you must read the reliability diagram in the low-probability bins specifically, weight the assessment toward the actual finding events, and always quote a discrimination metric alongside the brier score — a model with no discrimination is exposed instantly by an auc near 0.5 even when its brier score flatters it. the second trap is censoring, and it is the cui-specific one. your finding history is not a clean record of where corrosion happened — it is a record of where you looked and where the damage was severe enough to record. components that were never inspected contribute no exceedance, so they silently count as passes; a cml that was corroding hard but sat under intact jacket and never got opened never enters the denominator as a miss. this is the same coverage-and-detection term from last week, now biasing your validation instead of your prediction: calibrating on finding history alone tends to make the model look better-calibrated than it is, because the failures it missed are exactly the ones the inspection program also missed. the honest back-test conditions on inspection effectiveness — score the model only over components that were actually inspected with a method credited to detect the damage per api rp 583, and state that scope out loud. the reconciliation habit ties it back to the decision. when a fresh measured rate lands, do not simply fold it into the average. compare it against the model's posterior: a reading inside the credible interval confirms the model; a reading above the upper bound is not a new data point to re-average — it is evidence the model is miscalibrated for that circuit, and it should re-open the assessment. that is the difference between updating a model and being quietly overruled by it. sources reconciling measured versus sme-determined corrosion rates in dmr/rbi development inspectioneering current (apr 2026) treatment of exactly the reconciliation problem — what to do when the measured rat","summaryHtml":"Digest #5 (Track 2). Four weeks built a model that turns a physics prior plus sensor and UT evidence into a posterior, then into a probability of exceedance and a date. This week asks the only question a Lead will be asked in the review: how do you know it is right? The answer is back-testing, and it has a sharp internal structure — a model can rank components perfectly and still hand you dangerously wrong dates. Separating those two failure modes, and knowing which one your interval decision depends on, is the whole lesson."},{"id":"AI_2026_08_07","stream":"asset","date":"2026-08-07","title":"API 579 Part 5: turning a CUI wall-loss finding into a run/repair decision","summary":"First entry in the Friday technical stream. This one is deliberately foundational and deliberately away from the Monday modelling track: not \"how likely is CUI here\" but \"we have already found the metal loss — now what is the defensible engineering answer?\" The tool is API 579-1/ASME FFS-1 Part 5, Assessment of Local Metal Loss, and the single idea worth carrying out of it is that a local thin area can sit below the code minimum required thickness and still be fit for service. Everything else — the remaining strength factor, the future corrosion allowance, the critical thickness profile, the structural-discontinuity exclusion — is machinery around that one idea.","sections":[{"heading":"Concept of the week — the RSF decision, and why t_min is the wrong test for a local patch","html":"\u003cp>When a jacket comes off and you find a dished, rusted patch of external wall loss, the instinct trained by API 570 is to compare the thinnest reading against t_min and call it. That instinct is wrong for a local flaw, and knowing exactly why is the difference between a senior inspector and a senior inspection engineer. t_min is a \u003cem>design\u003c/em> thickness: it comes from a pressure-design formula (B31.3 for piping, Section VIII Div 1 for vessels) that assumes the thickness it solves for exists everywhere in the shell. A short, isolated thin patch is not that condition — the surrounding full-thickness material carries load around it. Applying a global design rule to a local condition is conservative in an arbitrary, unquantified way, and it drives repairs that the mechanics do not require.\u003c/p>\n\u003cp>API 579-1/ASME FFS-1 Part 5 replaces the thickness test with a \u003cem>strength\u003c/em> test. It reduces the flaw to two dimensionless numbers. The remaining thickness ratio is R_t = (t_mm − FCA) / t_c, where t_mm is the minimum measured thickness inside the flaw, FCA is the future corrosion allowance you intend to consume before the next intervention, and t_c is the wall away from the flaw, already corrected for uniform loss and FCA. The longitudinal extent is normalised by the shell's own bending stiffness: λ = 1.285 · s / √(D · t_c), with s the axial length of the flaw and D the inside diameter. The two combine through the Folias bulging factor M_t into the remaining strength factor, RSF = R_t / [1 − (1 − R_t)/M_t]. Sanity-check the ends: a very short flaw (λ → 0, M_t → 1) gives RSF → 1, the flaw is mechanically invisible; a very long flaw (λ → ∞) gives RSF → R_t, the component is only as strong as its thinnest wall, which is the general-metal-loss answer. Part 5 is the smooth interpolation between those two truths, and the Level 1 screening curve of Figure 5.6 is nothing more than the locus of RSF = 0.90 plotted in (λ, R_t) space. RSF_a = 0.90 is the recommended acceptance value for in-service pressure equipment; the verdict is simply RSF ≥ RSF_a → accept at MAWP, otherwise re-rate to MAWP_r = MAWP · (RSF / RSF_a).\u003c/p>\n\u003cp>Work one synthetic case (all numbers invented — never bring real plant data here). A 12&quot; NPS carbon-steel line, OD 323.9 mm, nominal 9.53 mm, code minimum required thickness t_min = 6.2 mm. Jacket removal reveals a CUI patch: general wall around it measures 8.9 mm, deepest point in the patch t_mm = 6.8 mm, axial extent s = 60 mm. You are scoping to the next turnaround, four years out, and the defended local CUI rate is 0.30 mm/yr, so FCA = 1.2 mm. Then t_c = 8.9 − 1.2 = 7.7 mm and R_t = (6.8 − 1.2)/7.7 = 0.727. With D ≈ 306 mm, √(D·t_c) = 48.5 mm and λ = 1.285 × 60 / 48.5 = 1.59, giving M_t = √(1 + 0.4845 λ²) = 1.49 and RSF = 0.727 / [1 − 0.273/1.49] = \u003cstrong>0.890\u003c/strong>. Read what that says. The deepest point after FCA is 5.6 mm — comfortably \u003cem>below\u003c/em> the 6.2 mm code minimum, which under a thickness rule is an immediate repair. Part 5 says the component retains 89% of its undamaged load capacity, one point short of the 0.90 screen, and the honest disposition is a 1.1% re-rate (MAWP_r = 0.989·MAWP) or a Level 2/3 refinement — not a clamp and not a cut-out.\u003c/p>\n\u003cp>The number that actually moved the answer is FCA, not t_mm. Re-run the same flaw stretched to an eight-year interval: FCA = 2.4 mm, t_c = 6.5 mm, R_t = 0.677, λ = 1.73, M_t = 1.56, RSF = 0.853, MAWP_r = 0.948·MAWP. The measurement did not change; the corrosion rate assumption did, and it cost four points of RSF. This is where FFS quietly turns back into your discipline: the FFS report is only as good as the CUI rate feeding FCA, and a locally-derived CUI rate is not the CML-derived general thinning rate for that circuit. If you cannot defend the rate, you cannot defend the run — and Part 5 gives you a clean way to say so, because you can present RSF as a function of assumed rate and let the sensitivity make the argument for a monitoring commitment.\u003c/p>\n\u003cp>Finally, know Part 5's fence line. Screening between Part 4 (general metal loss) and Part 5 is conventionally made on the scatter of the thickness readings — a coefficient of variation below roughly 10% means the loss is behaving as general thinning and Part 4 applies; above it, treat it as local and profile it. Part 5 handles smooth, blunt metal loss only: pitting goes to Part 6, and a crack-like flaw goes to Part 9. That last exclusion matters on your scope specifically, because the austenitic lines carrying ECLSCC risk sit under the same insulation as the carbon-steel CUI lines — an ECLSCC indication is never a Part 5 problem, however shallow it looks.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2022-10-27/10328/fitness-for-service-forum-remaining-strength-factors\" target=\"_blank\" rel=\"noopener noreferrer\">Fitness-for-Service Forum: Remaining Strength Factors (RSF)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Where RSF_a = 0.90 comes from and what the margin actually represents — read this before you defend an RSF number to anyone.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.inspection-for-industry.com/api-579-part-5-local-metal-loss-assessment.html\" target=\"_blank\" rel=\"noopener noreferrer\">API 579 Part 5 — Local Metal Loss Assessment Screening\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspection for Industry\u003c/span>\u003cspan class=\"lnk-note\">Plain walkthrough of the Level 1 screening parameters (t_mm, t_c, R_t, λ, the shelf parameter) with the flaw-characterisation steps in order.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.codeware.com/products/inspect/general-and-local-metal-loss/\" target=\"_blank\" rel=\"noopener noreferrer\">API 579 Part 4 and Part 5 — General and Local Metal Loss\u003c/a>\n        \u003cspan class=\"lnk-src\">Codeware\u003c/span>\u003cspan class=\"lnk-note\">Useful for the Part 4 / Part 5 boundary and how the COV screen on thickness scatter decides which procedure you are in.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2021-06-30/9722/damage-control-cui-assessment\" target=\"_blank\" rel=\"noopener noreferrer\">Damage Control: Corrosion Under Insulation Assessment\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">CUI detection, characterisation and evaluation as one chain — the upstream half of the workflow this brief picks up at.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"The data problem — what Part 5 demands from your NDT, and where CUI tooling quietly fails it","html":"\u003cp>Part 5 does not run on CML readings. It runs on critical thickness profiles: a line of thickness data taken along the longitudinal plane through the deepest point of the flaw, and a second along the circumferential plane through the same point. That is a \u003cem>profile\u003c/em>, not a scatter of points at fixed inspection locations. A four-point CML set on the line gives you no s, no t_mm you can trust, and therefore no λ and no RSF — it gives you a Part 4 general-thinning answer applied to a condition that is not general thinning. So the first practical consequence of learning Part 5 is a change to how you specify the follow-up scan after a CUI finding, not a change to how you calculate.\u003c/p>\n\u003cp>The second consequence lands directly on the technology you are deploying. Pulsed eddy current does not measure minimum wall; it reports a wall thickness averaged over its footprint, and the footprint grows with insulation standoff. For diffuse general loss that average is a reasonable estimate. For exactly the condition Part 5 exists to assess — a compact deep patch inside otherwise sound wall — averaging systematically biases the reading \u003cem>thick\u003c/em>, and biases it worst when the flaw is smallest and deepest, which is the dangerous direction. PEC is a screening and prioritisation instrument: it tells you where to strip. It is not a source of t_mm for a fitness-for-service case. The characterisation pass has to come from a method that resolves geometry — a UT C-scan on a grid fine enough that the true minimum is not falling between nodes, or laser/3D scanning of the exposed surface once the jacket and any scale are off, which has the additional advantage of giving you the full profile as a by-product rather than a handful of numbers. Say this explicitly in the FFS report: which method produced t_mm, at what grid pitch, and what the method's resolution implies about whether the true minimum was found.\u003c/p>\n\u003cp>The third consequence is a trap CUI sets on purpose. Level 1 is only valid if the flaw stands clear of any major structural discontinuity by L_msd ≥ 1.8·√(D·t_c) — in the worked case above, 87 mm from the nearest weld, nozzle or attachment. Now recall where CUI actually initiates: at pipe support shoes and clamps, at nozzle-to-shell junctions, under brackets, at jacket terminations. The population of flaws you find is systematically concentrated inside the exclusion zone, because those are the places where the jacket loses its seal and the geometry traps water. The consequence is not a nuisance — it is that a large share of your real CUI findings are \u003cem>ineligible\u003c/em> for Level 1 and need Level 2 with the discontinuity treated, or Level 3 finite element work. Recognising that at the point of finding, and scoping the assessment accordingly, is a genuinely senior move; discovering it after someone has already issued a Level 1 acceptance is not.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2013-03-01/3230/fitness-for-service-assessment\" target=\"_blank\" rel=\"noopener noreferrer\">Fitness-for-Service (FFS) Assessment: Severe Local Corrosion\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Shows the thickness-profile data an FFS on severe local corrosion actually consumes, versus what a routine CML round produces.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://onepetro.org/ISOPEIOPEC/proceedings-abstract/ISOPE15/All-ISOPE15/ISOPE-I-15-837/16840\" target=\"_blank\" rel=\"noopener noreferrer\">Level 3 Fitness for Service Assessment of CUI Damage in a Deisobutanizer Tower\u003c/a>\n        \u003cspan class=\"lnk-src\">ISOPE / OnePetro\u003c/span>\u003cspan class=\"lnk-note\">A real CUI case that escalated past Level 1 to 3D finite element assessment — the endpoint of the escalation path described above.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://onepetro.org/OTCBRASIL/proceedings-abstract/23OTCB/23OTCB/535911\" target=\"_blank\" rel=\"noopener noreferrer\">Corrosion Under Insulation (CUI) — RBI, NDI and Fitness for Service API-579\u003c/a>\n        \u003cspan class=\"lnk-src\">OTC Brasil / OnePetro\u003c/span>\u003cspan class=\"lnk-note\">Joins the three threads — risk-based targeting, the NDT that characterises, and the API 579 assessment that dispositions.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Industry watch — the FFS standard is widening its scope, and the code baseline under it moved in 2025","html":"\u003cp>API 579-1/ASME FFS-1 is still on its 4th Edition (December 2021), so nothing has changed under your metal-loss assessments. What is moving is the standard's perimeter. The ASME/API Fitness-For-Service Joint Committee is developing a new Part 16, &quot;Assessment of Fiber Reinforced Polymer Equipment,&quot; which would for the first time bring in-service FRP composite equipment inside the FFS framework — today the standard is essentially a metals document. The technical basis already exists in Welding Research Council Bulletin 601, and the proposed part is built around five evaluation routes: external visual inspection, acoustic emission, acousto-ultrasonic, attenuation-based ultrasonic analysis, and a proprietary NDE approach. The part is not yet approved.\u003c/p>\n\u003cp>Why this belongs on a CUI engineer's radar rather than a composites engineer's: it is a live demonstration of how FFS extends into a material class, and the structural pattern is the one you already know. A new part is not a new equation set first — it is a new \u003cem>evidence\u003c/em> framework, defining which inspection methods are credible enough to feed an assessment level. That is the same argument you will have to win when you want PEC, distributed moisture sensing or laser profilometry credited inside an integrity decision rather than treated as an interesting side-measurement. Watch how Part 16 justifies method-to-level mapping; it is a template for the case you will eventually write.\u003c/p>\n\u003cp>Meanwhile, check your own code baseline is current, because the inspection codes moved more recently than 579 did. API 570 is on its 5th Edition (February 2024) with Addendum 1 (2025); API 653 is on its 5th Edition (November 2014) with addenda through Addendum 4 (2025). Editions, addenda and errata run on independent schedules, so verify against API's current publication list rather than against a procedure document that quotes an edition someone typed in years ago — a Level 1 assessment that computes RSF flawlessly but derives t_min from a superseded code clause is still a defective report.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://utcomp.com/news/about-api-579-1-asme-ffs-1-part-16/\" target=\"_blank\" rel=\"noopener noreferrer\">About API 579-1/ASME FFS-1 Part 16\u003c/a>\n        \u003cspan class=\"lnk-src\">UTComp\u003c/span>\u003cspan class=\"lnk-note\">What the proposed FRP part covers, its WRC 601 basis, and the five evaluation methods it puts forward.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://utcomp.com/api-579-1-asme-ffs-1-update/api-579-part-16-assessment-levels-for-frp-assets/\" target=\"_blank\" rel=\"noopener noreferrer\">API 579, Part 16: FRP Fitness-For-Service assessment levels\u003c/a>\n        \u003cspan class=\"lnk-src\">UTComp\u003c/span>\u003cspan class=\"lnk-note\">The method-to-assessment-level mapping — the part worth studying as a template for crediting new inspection technology.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://becht.com/becht-blog/entry/fitness-for-service-api-579-1-asme-ffs-1-substantive-changes-to-the-2016-edition/\" target=\"_blank\" rel=\"noopener noreferrer\">API 579-1/ASME FFS-1: Substantive Changes to the 2016 Edition\u003c/a>\n        \u003cspan class=\"lnk-src\">Becht\u003c/span>\u003cspan class=\"lnk-note\">Includes the revised Part 5 treatment of groove-like flaws and the shelf parameter — useful context for how Part 5 has been sharpened over editions.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://reliamag.com/guides/api-510-570-653-inspection-intervals/\" target=\"_blank\" rel=\"noopener noreferrer\">API 510, 570 and 653 inspection intervals\u003c/a>\n        \u003cspan class=\"lnk-src\">Reliable Magazine\u003c/span>\u003cspan class=\"lnk-note\">Quick reference for the current edition/addendum status of the three inspection codes, with the interval rules alongside.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Build a one-page Part 5 Level 1 calculator and run the sensitivity (~45 min, SYNTHETIC data only — no plant files). In a spreadsheet or a short Python script, take inputs D, t_nom, measured general wall, t_mm, s, t_min, corrosion rate and interval. Compute FCA = rate x interval, t_c, R_t = (t_mm - FCA)/t_c, lambda = 1.285*s/sqrt(D*t_c), M_t = sqrt(1 + 0.4845*lambda^2), RSF = R_t / (1 - (1 - R_t)/M_t), and MAWP_r/MAWP = min(1, RSF/0.90). Reproduce the worked case (D=306 mm, general wall 8.9 mm, t_mm=6.8 mm, s=60 mm, rate 0.30 mm/yr) and confirm RSF = 0.890 at a 4-year interval and 0.853 at 8 years. Then sweep the interval from 1 to 10 years and plot RSF against it: the year at which the curve crosses 0.90 is the longest defensible run at full MAWP, and the steepness of the curve is a direct picture of how much of your decision rests on the CUI rate rather than the measurement. Finally, add the two Level 1 validity flags the calculator should refuse to hide - R_t >= 0.20 and t_mm - FCA >= 2.5 mm, and L_msd >= 1.8*sqrt(D*t_c) - and note in one line what fraction of the CUI locations you typically find would fail that last one on geometry alone.","html":"\u003cp>Build a one-page Part 5 Level 1 calculator and run the sensitivity (~45 min, SYNTHETIC data only — no plant files). In a spreadsheet or a short Python script, take inputs D, t_nom, measured general wall, t_mm, s, t_min, corrosion rate and interval. Compute FCA = rate x interval, t_c, R_t = (t_mm - FCA)/t_c, lambda = 1.285*s/sqrt(D*t_c), M_t = sqrt(1 + 0.4845*lambda^2), RSF = R_t / (1 - (1 - R_t)/M_t), and MAWP_r/MAWP = min(1, RSF/0.90). Reproduce the worked case (D=306 mm, general wall 8.9 mm, t_mm=6.8 mm, s=60 mm, rate 0.30 mm/yr) and confirm RSF = 0.890 at a 4-year interval and 0.853 at 8 years. Then sweep the interval from 1 to 10 years and plot RSF against it: the year at which the curve crosses 0.90 is the longest defensible run at full MAWP, and the steepness of the curve is a direct picture of how much of your decision rests on the CUI rate rather than the measurement. Finally, add the two Level 1 validity flags the calculator should refuse to hide - R_t &gt;= 0.20 and t_mm - FCA &gt;= 2.5 mm, and L_msd &gt;= 1.8*sqrt(D*t_c) - and note in one line what fraction of the CUI locations you typically find would fail that last one on geometry alone.\u003c/p>"},"number":1,"minutes":10,"words":2166,"q":"api 579 part 5: turning a cui wall-loss finding into a run/repair decision first entry in the friday technical stream. this one is deliberately foundational and deliberately away from the monday modelling track: not \"how likely is cui here\" but \"we have already found the metal loss — now what is the defensible engineering answer?\" the tool is api 579-1/asme ffs-1 part 5, assessment of local metal loss, and the single idea worth carrying out of it is that a local thin area can sit below the code minimum required thickness and still be fit for service. everything else — the remaining strength factor, the future corrosion allowance, the critical thickness profile, the structural-discontinuity exclusion — is machinery around that one idea. concept of the week — the rsf decision, and why t_min is the wrong test for a local patch when a jacket comes off and you find a dished, rusted patch of external wall loss, the instinct trained by api 570 is to compare the thinnest reading against t_min and call it. that instinct is wrong for a local flaw, and knowing exactly why is the difference between a senior inspector and a senior inspection engineer. t_min is a design thickness: it comes from a pressure-design formula (b31.3 for piping, section viii div 1 for vessels) that assumes the thickness it solves for exists everywhere in the shell. a short, isolated thin patch is not that condition — the surrounding full-thickness material carries load around it. applying a global design rule to a local condition is conservative in an arbitrary, unquantified way, and it drives repairs that the mechanics do not require. api 579-1/asme ffs-1 part 5 replaces the thickness test with a strength test. it reduces the flaw to two dimensionless numbers. the remaining thickness ratio is r_t = (t_mm − fca) / t_c, where t_mm is the minimum measured thickness inside the flaw, fca is the future corrosion allowance you intend to consume before the next intervention, and t_c is the wall away from the flaw, already corrected for uniform loss and fca. the longitudinal extent is normalised by the shell's own bending stiffness: λ = 1.285 · s / √(d · t_c), with s the axial length of the flaw and d the inside diameter. the two combine through the folias bulging factor m_t into the remaining strength factor, rsf = r_t / [1 − (1 − r_t)/m_t]. sanity-check the ends: a very short flaw (λ → 0, m_t → 1) gives rsf → 1, the flaw is mechanically invisible; a very long flaw (λ → ∞) gives rsf → r_t, the component is only as strong as its thinnest wall, which is the general-metal-loss answer. part 5 is the smooth interpolation between those two truths, and the level 1 screening curve of figure 5.6 is nothing more than the locus of rsf = 0.90 plotted in (λ, r_t) space. rsf_a = 0.90 is the recommended acceptance value for in-service pressure equipment; the verdict is simply rsf ≥ rsf_a → accept at mawp, otherwise re-rate to mawp_r = mawp · (rsf / rsf_a). work one synthetic case (all numbers invented — never bring real plant data here). a 12 nps carbon-steel line, od 323.9 mm, nominal 9.53 mm, code minimum required thickness t_min = 6.2 mm. jacket removal reveals a cui patch: general wall around it measures 8.9 mm, deepest point in the patch t_mm = 6.8 mm, axial extent s = 60 mm. you are scoping to the next turnaround, four years out, and the defended local cui rate is 0.30 mm/yr, so fca = 1.2 mm. then t_c = 8.9 − 1.2 = 7.7 mm and r_t = (6.8 − 1.2)/7.7 = 0.727. with d ≈ 306 mm, √(d·t_c) = 48.5 mm and λ = 1.285 × 60 / 48.5 = 1.59, giving m_t = √(1 + 0.4845 λ²) = 1.49 and rsf = 0.727 / [1 − 0.273/1.49] = 0.890 . read what that says. the deepest point after fca is 5.6 mm — comfortably below the 6.2 mm code minimum, which under a thickness rule is an immediate repair. part 5 says the component retains 89% of its undamaged load capacity, one point short of the 0.90 screen, and the honest disposition is a 1.1% re-rate (mawp_r = 0.989·mawp) or a level 2/3 refinement — not a clamp and not a cut-out. the number that actually moved the answer is fca, not t_mm. re-run the same flaw stretched to an eight-year interval: fca = 2.4 mm, t_c = 6.5 mm, r_t = 0.677, λ = 1.73, m_t = 1.56, rsf = 0.853, mawp_r = 0.948·mawp. the measurement did not change; the corrosion rate assumption did, and it cost four points of rsf. this is where ffs quietly turns back into your discipline: the ffs report is only as good as the cui rate feeding fca, and a locally-derived cui rate is not the cml-derived general thinning rate for that circuit. if you cannot defend the rate, you cannot defend the run — and part 5 gives you a clean way to say so, because you can present rsf as a function of assumed rate and let the sensitivity make the argument for a monitoring commitment. finally, know part 5's fence line. screening between part 4 (general metal loss) and part 5 is conventionally made on the scatter of the thickness readings — a coefficient of variation below roughly 10% means the loss is behaving as general thinning and part 4 applies; above it, treat it as local and profile it. part 5 handles smooth, blunt metal loss only: pitting goes to part 6, and a crack-like flaw goes to part 9. that last exclusion matters on your scope specifically, because the austenitic lines carrying eclscc risk sit under the same insulation as the carbon-steel cui lines — an eclscc indication is never a part 5 problem, however shallow it looks. sources fitness-for-service forum: remaining strength factors (rsf) inspectioneering where rsf_a = 0.90 comes from and what the margin actually represents — read this before you defend an rsf number to anyone. api 579 part 5 — local metal loss assessment screening inspection for industry plain walkthrough of the level 1 screening parameters (t_mm, t_c, r_t, λ, the shelf parameter) with the flaw-characterisation steps in order. api 579 part 4 and part 5 — general and local metal loss codeware useful for the part 4 / part 5 boundary and how the cov screen on thickn","summaryHtml":"First entry in the Friday technical stream. This one is deliberately foundational and deliberately away from the Monday modelling track: not &quot;how likely is CUI here&quot; but &quot;we have already found the metal loss — now what is the defensible engineering answer?&quot; The tool is API 579-1/ASME FFS-1 Part 5, Assessment of Local Metal Loss, and the single idea worth carrying out of it is that a local thin area can sit below the code minimum required thickness and still be fit for service. Everything else — the remaining strength factor, the future corrosion allowance, the critical thickness profile, the structural-discontinuity exclusion — is machinery around that one idea."},{"id":"D_2026_08_03","stream":"integrity","date":"2026-08-03","title":"From posterior to date — probability of exceedance and setting the interval","summary":"Digest #4 (Track 2). Last week the physics prior became a posterior. This week the posterior becomes a date. Probability of exceedance is the bridge: it converts a distribution over corrosion rate into \"how likely is this component to reach t-min before the proposed inspection date\" — and it exposes exactly which assumption is carrying your interval decision. The Lead-level move is not computing the POE; it is knowing where the acceptance threshold came from and what the number quietly assumes.","sections":[{"heading":"Probability of exceedance — turning a rate posterior into an interval","html":"\u003cp>Probability of exceedance (POE) at a candidate interval t is simply: P(the component reaches t-min within t years). With a posterior over corrosion rate, exceedance at time t requires a rate greater than the available metal divided by t, so POE(t) = P(rate &gt; (t_current − t_min) / t). Sweep t and you get a monotonically rising POE curve; the interval is where that curve crosses your acceptance threshold.\u003c/p>\n\u003cp>Work a synthetic example, continuing last week's update. Posterior rate ≈ Normal(0.29, 0.027²) mm/yr. Current thickness 8.0 mm, t-min 5.0 mm, so 3.0 mm is available. The deterministic answer: remaining life 3.0 / 0.29 ≈ 10.4 years, and the classic half-life rule gives a 5.2-year interval. The probabilistic answer at a 1% acceptance threshold: z = 2.326, so the critical rate is 0.29 + 2.326 × 0.027 ≈ 0.352 mm/yr, giving t = 3.0 / 0.352 ≈ 8.5 years. Same data, three more years — and this time the extra years are attached to a stated probability rather than to a rule of thumb.\u003c/p>\n\u003cp>Now the diagnostic that matters more than the answer. Re-run the same posterior at 5% and at 0.1%: you get about 9.0 and 8.1 years. The interval barely moves. That insensitivity is the signal — when the posterior is tight, the threshold choice is doing almost no work and the data is carrying the decision. Repeat it with a wide posterior (say σ = 0.15) and the same three thresholds give roughly 5.6 and 4.0 years: now the threshold is doing most of the work, and you are really arguing about risk appetite, not about corrosion. Always report which regime you are in. It tells the approver whether to challenge your evidence or your risk target.\u003c/p>\n\u003cp>The half-life rule is a crude uncertainty proxy that assumes one fixed level of ignorance for every component. POE replaces that flat assumption with the uncertainty you actually have — which is why a well-evidenced circuit can honestly earn a longer interval and a thinly-evidenced one is forced shorter, from the same arithmetic.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.inspection-for-industry.com/API-581-RBI-Probability-of-Failure-Calculations.html\" target=\"_blank\" rel=\"noopener noreferrer\">API 581 RBI Probability of Failure Calculations\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspection for Industry\u003c/span>\u003cspan class=\"lnk-note\">Walks the generic-failure-frequency × damage-factor × management-factor structure your POE has to plug into.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://cenosco.com/insights/api-581-rbi-calculations\" target=\"_blank\" rel=\"noopener noreferrer\">Exploring API 581: Delving into Risk-Based Inspection Calculations\u003c/a>\n        \u003cspan class=\"lnk-src\">Cenosco\u003c/span>\u003cspan class=\"lnk-note\">Clear walk-through of how 581 turns damage state into a plan date via the risk target.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S1875510021005813\" target=\"_blank\" rel=\"noopener noreferrer\">A probabilistic approach to estimate the remaining life and reliability of corroded pipelines\u003c/a>\n        \u003cspan class=\"lnk-src\">Journal of Petroleum Science and Engineering (Elsevier)\u003c/span>\u003cspan class=\"lnk-note\">The same POE-to-reassessment-interval logic set out formally for corroded pipe.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Where the threshold comes from — and what still caps your answer","html":"\u003cp>The number your POE curve is compared against is not in API 581. API 581 leaves the risk target to the Owner/User; its inspection-planning logic is that the plan date is the date the calculated risk reaches that target. So &quot;1% POE&quot; is never a standard you can cite — it is a threshold you must derive from your own risk target and then defend.\u003c/p>\n\u003cp>That derivation has to pass through consequence. Risk is probability × consequence, so two circuits with identical posteriors do not earn identical intervals. A 1% POE on a utility water line and a 1% POE on a hydrocarbon line routed past an occupied building are the same probability and radically different risks. If your model outputs an interval without a consequence input, it is not an RBI output — it is a thinning calculation wearing an RBI label.\u003c/p>\n\u003cp>And the arithmetic answer is not automatically deliverable. Under API 570 the thickness-measurement interval is the lesser of half the remaining life and a class-based maximum, so an 8.5-year answer on a Class 1 line does not become an 8.5-year interval by virtue of being probabilistically sound. It becomes deliverable only through the RBI route — an assessment per API 580 with a documented risk target, documented inspection effectiveness, and named ownership of the extension. Knowing which of those two routes you are on, and saying so on the first slide, is a Lead-level habit.\u003c/p>\n\u003cp>Finally, build the evergreening trigger in at the same time as the interval. Define it against the posterior, not against the mean: if a subsequent reading falls above the upper credible bound of the posterior, that is not a rate to re-average — it is evidence the model is wrong, and it should re-open the assessment rather than quietly slide the next date.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2012-07-01/537/risk-based-inspection---settin\" target=\"_blank\" rel=\"noopener noreferrer\">Risk Based Inspection — Setting Risk Targets\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">The standards leave the target to you; this is the clearest treatment of how owners actually set and defend one.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.aoccorp.com/blog/proposed-api-581-inspection-plan-optimization\" target=\"_blank\" rel=\"noopener noreferrer\">Proposed API 581 Inspection Plan Optimization\u003c/a>\n        \u003cspan class=\"lnk-src\">AOC Corp\u003c/span>\u003cspan class=\"lnk-note\">On the point that inspection reduces uncertainty rather than risk — which is why the plan date moves when the posterior tightens.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://content.ampp.org/ampp/proceedings-abstract/CONF_MAR2024/2024/1/60654\" target=\"_blank\" rel=\"noopener noreferrer\">An Insight to the RBI of Corrosion under Insulation (CUI) and Corrosion under Fireproofing (CUF)\u003c/a>\n        \u003cspan class=\"lnk-src\">AMPP Annual Conference\u003c/span>\u003cspan class=\"lnk-note\">The CUI/CUF-specific RBI workflow your interval decision has to sit inside.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Worth knowing — physics-informed Bayesian models and spatial evidence","html":"\u003cp>Two current papers are worth an hour because they are the next two moves on this track, done elsewhere.\u003c/p>\n\u003cp>At AMPP 2026, &quot;Physics-Informed Bayesian Modeling for Integrity Assessment of Underground Pipeline Coatings&quot; applies exactly the architecture you are building — a physics prior updated by inspection evidence — to buried coating condition. Different mechanism, same skeleton, and worth reading specifically for how the authors present a posterior to a decision audience.\u003c/p>\n\u003cp>The second is the spatial one, and it matters for your sensor portfolio. A 2026 Structural Concrete paper does Bayesian parameter updating with spatially distributed inspection data: the evidence is a profile along a length, not a reading at a point. That is the data shape a distributed CUI sensor produces, and it changes the update — you are no longer only sharpening a rate, you are also updating where the damage is, which feeds the detection-probability term that a rate-only POE ignores. Note the transfer honestly: reinforced concrete, different kinetics, but the updating machinery carries over.\u003c/p>\n\u003cp>The caveat to carry into both: a POE built on a smooth rate distribution assumes the CML you measured represents the worst location. CUI does not oblige. It is patchy — at supports, penetrations, jacket damage, low points — so the dominant uncertainty is often &quot;did we look in the right place&quot;, governed by inspection effectiveness and coverage per API RP 583, not by the width of the rate posterior. A POE quoted without a coverage statement is a confident answer to the wrong question.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://content.ampp.org/ampp/proceedings-abstract/CONF_MAR26/2026/1/107391\" target=\"_blank\" rel=\"noopener noreferrer\">Physics-Informed Bayesian Modeling for Integrity Assessment of Underground Pipeline Coatings (2026)\u003c/a>\n        \u003cspan class=\"lnk-src\">AMPP Annual Conference 2026\u003c/span>\u003cspan class=\"lnk-note\">This week's current development — the physics-prior-plus-Bayesian-update architecture, presented to an integrity audience.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://onlinelibrary.wiley.com/doi/10.1002/suco.70261\" target=\"_blank\" rel=\"noopener noreferrer\">Reinforcement corrosion assessment through Bayesian parameter updating with spatially distributed inspection data (2026)\u003c/a>\n        \u003cspan class=\"lnk-src\">Structural Concrete (Wiley)\u003c/span>\u003cspan class=\"lnk-note\">How to update from a spatial profile rather than a point — the maths behind using distributed sensor data.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S0951832025010269\" target=\"_blank\" rel=\"noopener noreferrer\">A data-driven model for pipeline corrosion under insulation-induced failure analysis\u003c/a>\n        \u003cspan class=\"lnk-src\">Reliability Engineering &amp; System Safety (Elsevier)\u003c/span>\u003cspan class=\"lnk-note\">Revisit for its final step specifically: translating probabilistic thresholds into RBI inspection strategies.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Extend last week's script (~30-45 min, SYNTHETIC data only). Take the posterior rate ~ Normal(0.29, 0.027²) mm/yr, 3.0 mm available metal, and compute POE(t) = 1 - Φ(((3.0/t) - μ)/σ) for t = 1..15 years. Print the interval at 5%, 1% and 0.1% thresholds alongside the half-life answer. Then re-run with σ = 0.15 and write one line on which decision actually changed and why — that sentence is the finding, not the plot. Bonus if you have 15 more minutes: multiply the POE by a crude coverage term (say 0.5 probability the worst spot was inspected) and watch the defensible interval collapse.","html":"\u003cp>Extend last week's script (~30-45 min, SYNTHETIC data only). Take the posterior rate ~ Normal(0.29, 0.027²) mm/yr, 3.0 mm available metal, and compute POE(t) = 1 - Φ(((3.0/t) - μ)/σ) for t = 1..15 years. Print the interval at 5%, 1% and 0.1% thresholds alongside the half-life answer. Then re-run with σ = 0.15 and write one line on which decision actually changed and why — that sentence is the finding, not the plot. Bonus if you have 15 more minutes: multiply the POE by a crude coverage term (say 0.5 probability the worst spot was inspected) and watch the defensible interval collapse.\u003c/p>"},"number":4,"minutes":6,"words":1269,"q":"from posterior to date — probability of exceedance and setting the interval digest #4 (track 2). last week the physics prior became a posterior. this week the posterior becomes a date. p f the remaining life and a class-based maximum, so an 8.5-year answer on a class 1 line does not become an 8.5-year interval by virtue of being probabilistically sound. it becomes deliverable only through the rbi route — an assessment per api 580 with a documented risk target, documented inspection effectiveness, and named ownership of the extension. knowing which of those two routes you are on, and saying so on the first slide, is a lead-level habit. finally, build the evergreening trigger in at the same time as the interval. define it against the posterior, not against the mean: if a subsequent reading falls above the upper credible bound of the posterior, that is not a rate to re-average — it is evidence the model is wrong, and it should re-open the assessment rather than quietly slide the next date. sources risk based inspection — setting risk targets inspectioneering the standards leave the target to you; this is the clearest treatment of how owners actually set and defend one. proposed api 581 inspection plan optimization aoc corp on the point that inspection reduces uncertainty rather than risk — which is why the plan date moves when the posterior tightens. an insight to the rbi of corrosion under insulation (cui) and corrosion under fireproofing (cuf) ampp annual conference the cui/cuf-specific rbi workflow your interval decision has to sit inside. worth knowing — physics-informed bayesian models and spatial evidence two current papers are worth an hour because they are the next two moves on this track, done elsewhere. at ampp 2026, physics-informed bayesian modeling for integrity assessment of underground pipeline coatings applies exactly the architecture you are building — a physics prior updated by inspection evidence — to buried coating condition. different mechanism, same ","summaryHtml":"Digest #4 (Track 2). Last week the physics prior became a posterior. This week the posterior becomes a date. Probability of exceedance is the bridge: it converts a distribution over corrosion rate into &quot;how likely is this component to reach t-min before the proposed inspection date&quot; — and it exposes exactly which assumption is carrying your interval decision. The Lead-level move is not computing the POE; it is knowing where the acceptance threshold came from and what the number quietly assumes."},{"id":"D_2026_07_13","stream":"integrity","date":"2026-07-13","title":"Bayesian updating — turning inspection + moisture data into a defensible CUI rate","summary":"Digest #3 (Track 2). Last week you had a physics-informed baseline rate; this week it becomes a prior you sharpen with evidence. The discipline: prior × likelihood → posterior, keeping the full distribution so you can defend an interval with a probability of exceedance — and never conflating a UT reading (which measures loss) with a moisture reading (which updates corrosion-state probability).","sections":[{"heading":"From a physics prior to a posterior corrosion rate","html":"\u003cp>Your physics-informed baseline is a prior, not a number. Bayesian updating sharpens it as evidence arrives: prior × likelihood → posterior. Two evidence streams update it in fundamentally different ways, and conflating them is the most common modelling mistake.\u003c/p>\n\u003cp>A UT or PEC thickness reading is a direct (but noisy) measurement of cumulative metal loss. It tightens the rate posterior strongly at that CML — the likelihood is sharply peaked around the measured loss.\u003c/p>\n\u003cp>A moisture-sensor wetness fraction does not measure metal loss. It updates the probability that the item is in an active-corrosion state (wet AND inside the susceptible temperature band), reweighting the prior toward the higher-rate regime rather than pinning a value.\u003c/p>\n\u003cp>Why this matters for the Senior → Lead step: keeping the full posterior — not a point estimate — is what lets you compute a probability of exceedance at a candidate interval and feed the API 581 thinning damage factor with an honest confidence. That is the difference between &quot;I extended the interval on judgement&quot; and &quot;here is the posterior, here is the POE at the proposed date, here is the corroborating moisture-state evidence&quot; — an auditable decision a Lead can defend.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S0951832025010269\" target=\"_blank\" rel=\"noopener noreferrer\">A data-driven (Bayesian network) model for CUI-induced failure analysis (2025)\u003c/a>\n        \u003cspan class=\"lnk-src\">Reliability Engineering &amp; System Safety (Elsevier)\u003c/span>\u003cspan class=\"lnk-note\">The productionised version of this week's idea — a Bayesian network + Monte Carlo model that updates as inspection/monitoring data arrive.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspenet.com/en/articles/inspection-corrosion-under-insulation-cui/\" target=\"_blank\" rel=\"noopener noreferrer\">Inspection of Corrosion Under Insulation (CUI)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspenet\u003c/span>\u003cspan class=\"lnk-note\">How moisture-sensor data feeds RBI probability-of-exceedance and shifts calendar-based intervals to condition-driven.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/corrosion+under+insulation\" target=\"_blank\" rel=\"noopener noreferrer\">Corrosion Under Insulation — topic hub\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Ongoing CUI program and monitoring articles.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Anchor: API RP 583, 2nd edition","html":"\u003cp>API RP 583 (Corrosion Under Insulation and Fireproofing), 2nd edition, remains the reference for CUI/CUF likelihood assessment and NDE method capability/limitations. Keep your Bayesian likelihoods consistent with it — in particular, its method-capability tables tell you how much a given inspection should tighten the posterior (a low-effectiveness method warrants a wider likelihood, not a false-confident spike).\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/tag/api+rp+583\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 583 — topic hub\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Plain-language commentary on the CUI/CUF recommended practice your likelihoods should track.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/content/2021-09-30/9844/a-guide-to-corrosion-under-insulation-management\" target=\"_blank\" rel=\"noopener noreferrer\">A Guide to Corrosion Under Insulation Management\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">End-to-end CUI program structure — keep the model consistent with the program it feeds.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"In VS Code, code a ~20-line Normal–Normal conjugate update on SYNTHETIC data: prior rate ~ Normal(0.20, 0.08²) mm/yr, three synthetic UT readings implying ~0.30 mm/yr (measurement noise σ = 0.05). Compute the posterior mean and variance and print the 90% credible interval before and after — watch it tighten and pull toward the data. Then note in one line how a \"wet 60% of the time\" moisture reading would shift the prior instead. Synthetic only; never NLNG data.","html":"\u003cp>In VS Code, code a ~20-line Normal–Normal conjugate update on SYNTHETIC data: prior rate ~ Normal(0.20, 0.08²) mm/yr, three synthetic UT readings implying ~0.30 mm/yr (measurement noise σ = 0.05). Compute the posterior mean and variance and print the 90% credible interval before and after — watch it tighten and pull toward the data. Then note in one line how a &quot;wet 60% of the time&quot; moisture reading would shift the prior instead. Synthetic only; never NLNG data.\u003c/p>"},"number":3,"minutes":2,"words":439,"q":"bayesian updating — turning inspection + moisture data into a defensible cui rate digest #3 (track 2). last week you had a physics-informed baseline rate; this week it becomes a prior you sharpen with evidence. the discipline: prior × likelihood → posterior, keeping the full distribution so you can defend an interval with a probability of exceedance — and never conflating a ut reading (which measures loss) with a moisture reading (which updates corrosion-state probability). from a physics prior to a posterior corrosion rate your physics-informed baseline is a prior, not a number. bayesian updating sharpens it as evidence arrives: prior × likelihood → posterior. two evidence streams update it in fundamentally different ways, and conflating them is the most common modelling mistake. a ut or pec thickness reading is a direct (but noisy) measurement of cumulative metal loss. it tightens the rate posterior strongly at that cml — the likelihood is sharply peaked around the measured loss. a moisture-sensor wetness fraction does not measure metal loss. it updates the probability that the item is in an active-corrosion state (wet and inside the susceptible temperature band), reweighting the prior toward the higher-rate regime rather than pinning a value. why this matters for the senior → lead step: keeping the full posterior — not a point estimate — is what lets you compute a probability of exceedance at a candidate interval and feed the api 581 thinning damage factor with an honest confidence. that is the difference between i extended the interval on judgement and here is the posterior, here is the poe at the proposed date, here is the corroborating moisture-state evidence — an auditable decision a lead can defend. sources a data-driven (bayesian network) model for cui-induced failure analysis (2025) reliability engineering system safety (elsevier) the productionised version of this week's idea — a bayesian network + monte carlo model that updates as inspection/monitoring data arrive. inspection of corrosion under insulation (cui) inspenet how moisture-sensor data feeds rbi probability-of-exceedance and shifts calendar-based intervals to condition-driven. corrosion under insulation — topic hub inspectioneering ongoing cui program and monitoring articles. anchor: api rp 583, 2nd edition api rp 583 (corrosion under insulation and fireproofing), 2nd edition, remains the reference for cui/cuf likelihood assessment and nde method capability/limitations. keep your bayesian likelihoods consistent with it — in particular, its method-capability tables tell you how much a given inspection should tighten the posterior (a low-effectiveness method warrants a wider likelihood, not a false-confident spike). sources api rp 583 — topic hub inspectioneering plain-language commentary on the cui/cuf recommended practice your likelihoods should track. a guide to corrosion under insulation management inspectioneering end-to-end cui program structure — keep the model consistent with the program it feeds.","summaryHtml":"Digest #3 (Track 2). Last week you had a physics-informed baseline rate; this week it becomes a prior you sharpen with evidence. The discipline: prior × likelihood → posterior, keeping the full distribution so you can defend an interval with a probability of exceedance — and never conflating a UT reading (which measures loss) with a moisture reading (which updates corrosion-state probability)."},{"id":"D_2026_07_06","stream":"integrity","date":"2026-07-06","title":"From monitoring to modeling — building a CUI prediction model that RBI can use","summary":"Last week was the sensing layer; this week is the modeling layer (your Track 2). Two threads: what the data-driven CUI-rate prediction methods actually do and which one to start with, and how to anchor whatever you build in API 581 so it changes inspection intervals instead of sitting on the shelf. Build the methodology here on synthetic data, port to real data at work.","sections":[{"heading":"From sensor streams to a CUI-rate model — the three method families","html":"\u003cp>The Track-2 goal is concrete: predict a CUI corrosion rate (and therefore remaining life) per circuit from data you already generate — thickness histories, operating temperature, coating/jacket age and condition, and now moisture-sensor streams. The published methods fall into three families.\u003c/p>\n\u003cp>Physics/empirical models express rate as a function of the drivers: the CUI temperature band, time-of-wetness, chloride loading, coating age. Few parameters, transparent, defensible to a reviewer, and workable when data is sparse — but coarse.\u003c/p>\n\u003cp>Data-driven models (artificial neural networks, ANFIS/fuzzy logic, Gaussian-process regression) train on field NDT plus operating features; recent 2025 work frames CUI as a data-driven failure analysis on pipelines. Higher fidelity where you have labelled examples, but data-hungry and opaque unless you constrain them.\u003c/p>\n\u003cp>Hybrid / physics-informed models use the physics as a backbone and let data refine the parameters. For your situation this is the pragmatic starting point: it stays explainable, works with the sparse labels you will have early, and improves as inspection and sensor history accumulate.\u003c/p>\n\u003cp>The two sensor architectures from last week feed the model differently: point/zone nodes give time-series that become time-of-wetness features; distributed sensors give spatial profiles that become location-specific rate features. Design the feature set around what each architecture actually produces.\u003c/p>\n\u003cp>Caveat the literature surfaces repeatedly: models validate well against API 581 CUI rates, but 581's CUI data is confined to roughly −12 °C to 176 °C — so a model calibrated on that basis has a valid envelope, and extrapolation beyond it is unsupported until you have your own data there.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S0951832025010269\" target=\"_blank\" rel=\"noopener noreferrer\">A data-driven model for pipeline corrosion under insulation-induced failure analysis (2025)\u003c/a>\n        \u003cspan class=\"lnk-src\">Reliability Engineering &amp; System Safety (Elsevier)\u003c/span>\u003cspan class=\"lnk-note\">The current state of the art — a 2025 data-driven CUI failure model. Read the method section for the feature set.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.mdpi.com/2071-1050/11/23/6853\" target=\"_blank\" rel=\"noopener noreferrer\">Combined Experimental and Field Data Sources in a Prediction Model for Corrosion Rate under Insulation\u003c/a>\n        \u003cspan class=\"lnk-src\">MDPI (open access)\u003c/span>\u003cspan class=\"lnk-note\">Fully open-access and readable end-to-end — shows how to fuse lab and field data into one CUI-rate model.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.researchgate.net/publication/276007070_Available_Prediction_Methods_for_Corrosion_under_Insulation_CUI_A_Review\" target=\"_blank\" rel=\"noopener noreferrer\">Available Prediction Methods for Corrosion under Insulation (CUI): A Review\u003c/a>\n        \u003cspan class=\"lnk-src\">ResearchGate\u003c/span>\u003cspan class=\"lnk-note\">Survey of the prediction landscape — orient here before you pick an approach to build.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Anchor the model in API 581 so it earns RBI credit","html":"\u003cp>A prediction model that lives outside the RBI framework is an interesting side project; one that maps into API 581 changes inspection intervals. The bridge is the thinning damage factor.\u003c/p>\n\u003cp>In 581, the thinning damage factor is driven by the Art parameter — age × corrosion rate ÷ (furnished thickness minus corrosion allowance) — and by inspection effectiveness. More and better inspections (and on-line monitoring) reduce the uncertainty in the corrosion rate and lower the damage factor; probability of failure rises with time as the damage factor accumulates.\u003c/p>\n\u003cp>So in RBI terms your CUI model has one job: produce a better-justified corrosion rate, with tighter uncertainty, than the default 581 CUI tables — and your moisture/corrosion monitoring counts as the on-line monitoring that raises inspection confidence. If the model output cannot be expressed as a corrosion rate plus a confidence that 581 can consume, it will not move the inspection plan, however clever it is.\u003c/p>\n\u003cp>Read the 4th-edition change summary before anchoring anything: API RP 581 was revised, and the thinning and PoF treatment evolved — anchor to the current edition, not a remembered one. And note the honest gap: 581's built-in CUI data is limited, which is precisely why a locally-calibrated model has value — it fills the gap the standard leaves, provided it speaks the standard's language.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2025-02-27/11449/api-rp-581-risk-based-inspection-technology-summary-of-changes-in-the-newly-rel\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 581 Risk-Based Inspection Technology: Summary of Changes in the 4th Edition (Feb 2025)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">What changed in the current edition — read this before anchoring a model to 581.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2016-12-29/5947/examining-the-latest-changes-to-api-rp-581-risk-based-inspection\" target=\"_blank\" rel=\"noopener noreferrer\">Examining API RP 581 RBI Methodology: Thinning and the PoF Calculations\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">How the thinning damage factor and probability of failure are actually computed — the maths your model must feed.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/api+rp+581\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 581 — Risk-Based Inspection Technology (topic hub)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Ongoing 581 reading feed — bookmark alongside the CUI hub.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"On paper, sketch the input feature list for a CUI-rate model for one representative circuit class. Split the features into three columns — inspection history, operating data, moisture-sensor streams — and mark which ones map onto API 581's corrosion-rate and inspection-effectiveness inputs. That one page is the spec for the synthetic-data prototype.","html":"\u003cp>On paper, sketch the input feature list for a CUI-rate model for one representative circuit class. Split the features into three columns — inspection history, operating data, moisture-sensor streams — and mark which ones map onto API 581's corrosion-rate and inspection-effectiveness inputs. That one page is the spec for the synthetic-data prototype.\u003c/p>"},"number":2,"minutes":3,"words":744,"q":"from monitoring to modeling — building a cui prediction model that rbi can use last week was the sensing layer; this week is the modeling layer (your track 2). two threads: what the data-driven cui-rate prediction methods actually do and which one to start with, and how to anchor whatever you build in api 581 so it changes inspection intervals instead of sitting on the shelf. build the methodology here on synthetic data, port to real data at work. from sensor streams to a cui-rate model — the three method families the track-2 goal is concrete: predict a cui corrosion rate (and therefore remaining life) per circuit from data you already generate — thickness hist
