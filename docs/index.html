a wild single-CML rate toward the loop rate in proportion to how little that CML's own data is worth. That is precisely the fix for the implausible-high-rate CML, and it connects directly to the Bayesian machinery in your Track 2 work. Running alongside it is extreme value analysis, which attacks the other half of the problem — estimating the tail, the deepest point you did not measure, from the points you did — with a January 2025 practitioner treatment on heat exchanger tube wall thickness and a substantial academic literature on how sample selection biases the result.\u003c/p>\n\u003cp>One caution on how this is marketed, since you will meet it in vendor material. CML optimisation case studies lead with cost: fewer active CMLs, reduced monitoring spend, six-figure savings. Cost reduction is a real and legitimate outcome, but it is the wrong headline to carry into an integrity review, and leading with it invites exactly the challenge you do not want. The defensible framing is \u003cstrong>reallocation\u003c/strong>: the same inspection hours moved off circuits where point readings were estimating a mean that was never in doubt, and onto circuits where localised damage means point readings were never a valid estimator in the first place. On your insulated inventory that reallocation has a specific destination — area screening and barrier-state monitoring rather than more strip points — and stating it that way makes the saving a by-product of a better estimator rather than the objective.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2024-08-29/11207/technical-basis-for-revision-of-api-574-piping-structural-minimal-thickness-valu\" target=\"_blank\" rel=\"noopener noreferrer\">Technical Basis for Revision of API 574 Piping Structural Minimum Thickness Values\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering Journal\u003c/span>\u003cspan class=\"lnk-note\">The reasoning behind the revised structural minimum thickness tables — read this before you next quote a structural t_min from an older copy.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.api.org/products-and-services/standards/important-standards-announcements/570-574-tradepress\" target=\"_blank\" rel=\"noopener noreferrer\">API Strengthens Piping Inspection Standards with New Updates (API 570 5th Ed and RP 574 5th Ed)\u003c/a>\n        \u003cspan class=\"lnk-src\">American Petroleum Institute\u003c/span>\u003cspan class=\"lnk-note\">The publisher announcement covering both documents, including the new RP 574 guidance on inspection location selection and on stainless steel tubing in chloride service.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://e2g.com/industry-insights-ar/optimizing-corrosion-monitoring-programs-with-bayesian-analysis/\" target=\"_blank\" rel=\"noopener noreferrer\">Optimizing Corrosion Monitoring Programs with Bayesian Analysis\u003c/a>\n        \u003cspan class=\"lnk-src\">The Equity Engineering Group\u003c/span>\u003cspan class=\"lnk-note\">Hierarchical Bayesian CML modelling — CMLs borrowing strength from one another. The formal version of what a corrosion loop asserts.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/content/2025-01-17/11413/extreme-value-analysis-eva-for-heat-exchanger-tube-wall-thickness-calculations\" target=\"_blank\" rel=\"noopener noreferrer\">Extreme Value Analysis (EVA) for Heat Exchanger Tube Wall Thickness Calculations\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">January 2025 — estimating the worst point you did not measure from the points you did, in a practitioner setting.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Do the sampling arithmetic on a synthetic insulated circuit, then redraw its loops (~45-60 min, SYNTHETIC data only — invent every number, no plant files, no real tag numbers). Part A, the noise floor: take an ultrasonic reading standard deviation of 0.15 mm, so differencing noise is about 0.21 mm. For assumed true rates of 0.05, 0.15 and 0.30 mm/yr, compute the ratio of real wall loss to differencing noise at intervals of 2, 4 and 8 years, and mark every cell where the loss is less than twice the noise. Those cells are the combinations where a short-term corrosion rate is not a measurement. Then compute, for the 0.05 mm/yr case at a 4-year interval, how many CMLs would have to be pooled as one loop to bring the rate uncertainty to within 20 percent — and write one sentence on what has to be true about the loop for that pooling to be legitimate. Part B, the prevalence bound: your circuit has 40 locations you judge susceptible, and the budget allows 12 insulation openings. Using the rule of three, compute the 95 percent upper bound on prevalence if all 12 come back clean, then compute how many clean openings you would need to bound prevalence below 10 percent. Write the honest one-line conclusion your report should carry instead of \"no CUI found\". Part C, redraw the loops: invent eight insulated lines that sit in only two process corrosion loops — same fluids, same materials, same design conditions — but give them differing insulation types and ages, jacket conditions, coating ages, support and penetration counts, and idle or spared hours per year. Re-group all eight into CUI loops using only the external criteria, and count how many CUI loops you get. Finish with a short paragraph on what your Part A and Part B numbers together imply about the balance between strip points, area screening and barrier-state monitoring on this circuit — that paragraph is the argument, written in sampling terms rather than technology terms.","html":"\u003cp>Do the sampling arithmetic on a synthetic insulated circuit, then redraw its loops (~45-60 min, SYNTHETIC data only — invent every number, no plant files, no real tag numbers). Part A, the noise floor: take an ultrasonic reading standard deviation of 0.15 mm, so differencing noise is about 0.21 mm. For assumed true rates of 0.05, 0.15 and 0.30 mm/yr, compute the ratio of real wall loss to differencing noise at intervals of 2, 4 and 8 years, and mark every cell where the loss is less than twice the noise. Those cells are the combinations where a short-term corrosion rate is not a measurement. Then compute, for the 0.05 mm/yr case at a 4-year interval, how many CMLs would have to be pooled as one loop to bring the rate uncertainty to within 20 percent — and write one sentence on what has to be true about the loop for that pooling to be legitimate. Part B, the prevalence bound: your circuit has 40 locations you judge susceptible, and the budget allows 12 insulation openings. Using the rule of three, compute the 95 percent upper bound on prevalence if all 12 come back clean, then compute how many clean openings you would need to bound prevalence below 10 percent. Write the honest one-line conclusion your report should carry instead of &quot;no CUI found&quot;. Part C, redraw the loops: invent eight insulated lines that sit in only two process corrosion loops — same fluids, same materials, same design conditions — but give them differing insulation types and ages, jacket conditions, coating ages, support and penetration counts, and idle or spared hours per year. Re-group all eight into CUI loops using only the external criteria, and count how many CUI loops you get. Finish with a short paragraph on what your Part A and Part B numbers together imply about the balance between strip points, area screening and barrier-state monitoring on this circuit — that paragraph is the argument, written in sampling terms rather than technology terms.\u003c/p>"},"number":3,"minutes":14,"words":3130,"q":"corrosion loops and cmls: what a handful of thickness readings can and cannot tell you about a circuit deep-dive #1 assessed damage after it was found. deep-dive #2 built the tripwire that warns you the rate assumption has moved. this one goes underneath both of them, to the measurement set that everything else is computed from. a corrosion loop is a claim about where degradation is the same; a cml set is a sample drawn from that claim; and a corrosion rate is the difference between two noisy numbers. almost every integrity output you produce — a remaining life, an api 581 damage factor, an fca in an api 579 assessment — is an inference from that sample. this week is about what the sample can honestly support, where the estimator breaks, and why the cml paradigm that works well for internal thinning transfers badly to cui. concept of the week — the loop is the inference unit, the cml set is a sample, and the rate is a difference of two noisy numbers start with the object, because the definition carries more weight than it looks. a corrosion loop groups equipment and piping that share a process environment, materials of construction, and operating conditions, and that are therefore subject to the same damage mechanisms at approximately the same rates . that last clause is not decoration — it is the entire licence for what you do next. because you assert the rate is common across the loop, you are entitled to pool data across components inside it: a reading taken on one spool becomes evidence about a spool fifty metres away that you did not touch. a circuit is the piping-side bookkeeping unit that inherits that assertion. if you cannot defend same mechanism, similar rate for two components, they do not belong in the same loop, and any pooling you do across them is not conservatism, it is contamination. once you see the loop as an inference unit, the cml set becomes what it actually is: a sample from a spatial distribution of wall thickness , and the question how many cmls turns into how well does this sample estimate the quantity my decision depends on . api 570 deliberately does not prescribe a count per unit length. it requires that the number and placement be sufficient to characterise the corrosion behaviour of the circuit, and that placement follow the dominant damage mechanism and be documented and repeatable. that is not vagueness. the right count genuinely depends on the shape of the thickness distribution, which depends on the mechanism, and no table can encode that. under general thinning the distribution is tight and roughly symmetric, the decision quantity is close to the loop mean, sampling error falls as the spatial standard deviation over the square root of n, and a modest, well-placed set is genuinely adequate. that is the case the cml concept was designed for, and in that case it works. the second structural point is about fixed versus relocated cmls , and it is the one most often got wrong in practice. a corrosion rate is not a measurement; it is the difference between two measurements divided by the time between them. when you re-read the same physical point, with the same procedure and ideally comparable surface preparation, a large part of the systematic error — probe placement, surface roughness, couplant, calibration bias, operator technique — is common to both readings and cancels in the difference. that cancellation is the whole reason cmls are permanently marked and given identities. the moment an inspector cannot find the mark and takes the reading 150 mm away, you have differenced two independent draws from the spatial distribution and then divided by time. what you get is not a corrosion rate, it is spatial variability wearing a corrosion rate's units. this is the origin of the two signatures every reviewer should recognise instantly: apparent negative corrosion, where the wall has grown since last time, and a single implausible high rate on one cml in a circuit that is otherwise quiet. both are usually location errors, not corrosion. now the arithmetic that makes this concrete, and it is worth carrying as a number rather than a feeling. take an ultrasonic thickness reading with a standard deviation of about 0.15 mm on real plant surfaces — a fair working figure once you include surface condition and operator effects, and easily worse through coating or on a rough external surface. the difference between two such readings has a standard deviation of roughly 0.15 times the square root of 2, about 0.21 mm. divide by a four-year interval and the noise on your corrosion rate has a standard deviation of about 0.053 mm/yr, before any corrosion has happened at all. on a circuit genuinely corroding at 0.30 mm/yr that noise is under a fifth of the signal and you can live with it. on a circuit genuinely corroding at 0.05 mm/yr, the noise is as large as the entire rate. the measured short-term rate on that circuit is essentially a random number, and half the cmls will show negative corrosion. two consequences follow, and they are the practical takeaway. first, there is a minimum interval below which a short-term rate cannot mean anything , and it depends on how slowly the circuit is corroding: real loss between readings has to be comfortably larger than about 0.2 mm of differencing noise. this is the honest reason api 570 has you compute both long-term and short-term rates and apply judgement rather than mechanically taking the latest number — the short-term rate is the noisier estimator by construction, and on slow circuits it is dominated by noise. second, if you cannot wait, you can average . pooling across n cmls in a genuine loop reduces the noise on the loop rate by the square root of n, so recovering a 0.05 mm/yr rate to within 20 percent on a four-year interval needs on the order of 28 cmls behaving as one population — which is only legitimate if the loop assertion is true. this is the quiet reason a well-drawn loop is worth more than extra readings: the loop is w","summaryHtml":"Deep-Dive #1 assessed damage after it was found. Deep-Dive #2 built the tripwire that warns you the rate assumption has moved. This one goes underneath both of them, to the measurement set that everything else is computed from. A corrosion loop is a claim about where degradation is the same; a CML set is a sample drawn from that claim; and a corrosion rate is the difference between two noisy numbers. Almost every integrity output you produce — a remaining life, an API 581 damage factor, an FCA in an API 579 assessment — is an inference from that sample. This week is about what the sample can honestly support, where the estimator breaks, and why the CML paradigm that works well for internal thinning transfers badly to CUI."},{"id":"D_2026_08_17","stream":"integrity","date":"2026-08-17","title":"What \"we inspected it\" is actually worth — POD, coverage, and the effectiveness term","summary":"Digest #6 (Track 2). Two weeks running, a term has been left as a placeholder. Digest #4 warned that a rate-only probability of exceedance ignores localisation and coverage. Digest #5 showed that censoring — the fact that finding history records where you looked, not where damage was — quietly flatters a back-test. Both were the same missing quantity: the probability that an inspection would have found the damage if it were there. This week that term gets built properly, because it is the hinge between a model and the inspection programme that feeds it. Get it wrong and a clean inspection report becomes an argument for a longer interval when it should barely have moved the number.","sections":[{"heading":"POD is a curve, not a number — and a90/95 is the honest version of it","html":"\u003cp>Probability of detection is a function of defect size, written POD(a). Small damage is missed often, large damage is missed rarely, and the curve between them is what a qualification trial measures. Saying &quot;this method has a POD of 80%&quot; is meaningless until you state at what size, because the same procedure might be at 20% for a 1 mm pit and 95% for 4 mm of general loss.\u003c/p>\n\u003cp>There are two standard ways to measure it. Hit/miss analysis records only whether each known flaw was found; it is simple, applies to any method, and needs a lot of specimens — roughly 60 flaws as a working minimum — because each observation carries only one bit of information. Signal-response analysis, usually written &quot;a-hat versus a&quot;, records the actual signal amplitude against the true flaw size, extracts far more information per specimen, and so needs fewer of them, but only works where the method produces a continuous quantitative response. MIL-HDBK-1823A is the canonical reference for both: it specifies how to design the specimen set, run the trial, and fit the curve with confidence bounds.\u003c/p>\n\u003cp>That brings in the notation you will meet in any procedure qualification: a90 and a90/95. a90 is the flaw size at which the fitted curve reaches 90% detection — a best estimate. a90/95 is the size at which you are 95% confident the detection probability is at least 90%, which is a lower confidence bound on the curve and therefore a larger, more conservative flaw size. The gap between them is a sample-size penalty: a thin demonstration produces a wide confidence band and a poor a90/95 even if the technique is genuinely good. When a vendor quotes a90 and not a90/95, they are quoting the number that ignores how little evidence supports it.\u003c/p>\n\u003cp>The CUI translation matters. For insulated piping, the size variable is not crack length; it is a combination of wall-loss depth and lateral extent, and different methods are sensitive to different parts of that combination. Pulsed eddy current returns an average wall thickness over a footprint — so its detection capability depends on the ratio of the corroded patch to that footprint. A deep, tight pit inside a large PEC footprint gets averaged against surrounding sound metal and can sit low on the POD curve no matter how deep it is, which is the same mathematics behind the warning in Digest #4 that a PEC footprint average is not a t_mm. Profile radiography, by contrast, is comparatively strong on localised loss and weak on broad thinning around the circumference. &quot;Which method is best&quot; is the wrong question. &quot;What does each method's POD curve look like against the damage morphology I actually expect&quot; is the right one.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.nde-ed.org/NDEEngineering/POD/introPOD.xhtml\" target=\"_blank\" rel=\"noopener noreferrer\">Probability of Detection — NDE Engineering fundamentals\u003c/a>\n        \u003cspan class=\"lnk-src\">NDT Resource Center (nde-ed.org)\u003c/span>\u003cspan class=\"lnk-note\">The clearest short introduction to POD(a), hit/miss versus signal-response analysis, and where a90/95 comes from.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://statistical-engineering.com/wp-content/uploads/2017/10/MIL-HDBK-1823A2009.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">MIL-HDBK-1823A — Nondestructive Evaluation System Reliability Assessment\u003c/a>\n        \u003cspan class=\"lnk-src\">US DoD (via Statistical Engineering)\u003c/span>\u003cspan class=\"lnk-note\">The canonical method for running a POD trial and fitting the curve with confidence bounds — skim Sections 3 and 4 and Appendix G.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.dst.defence.gov.au/sites/default/files/publications/documents/DSTO-TR-2622%20PR.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Guidelines for Interpretation of Published Data on Probability of Detection (DSTO-TR-2622)\u003c/a>\n        \u003cspan class=\"lnk-src\">Australian Defence Science and Technology Organisation\u003c/span>\u003cspan class=\"lnk-note\">How to read someone else's POD numbers without over-crediting them — directly applicable to vendor performance claims.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.researchgate.net/publication/383148449_Exploring_Probability_of_Detection_POD_Analysis_in_Nondestructive_Testing_A_Comprehensive_Review_and_Potential_Applications_in_Phased_Array_Ultrasonic_Corrosion_Mapping\" target=\"_blank\" rel=\"noopener noreferrer\">Exploring Probability of Detection (POD) Analysis in NDT — with application to phased array ultrasonic corrosion mapping\u003c/a>\n        \u003cspan class=\"lnk-src\">ResearchGate (review paper)\u003c/span>\u003cspan class=\"lnk-note\">POD methodology applied to corrosion mapping rather than crack detection — the closer analogue to your CUI problem.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Coverage x POD = effectiveness — and how API 581 turns that product into a damage factor","html":"\u003cp>A POD curve alone still overstates what a round of inspection achieves, because it answers &quot;would I detect this flaw if I put the probe on it&quot;. The programme question is &quot;would I have found the damage at all&quot;, and that adds a second, usually larger, source of failure: the damage might sit outside the part you inspected. To a first approximation the two multiply — effectiveness is roughly coverage times POD at the size of interest.\u003c/p>\n\u003cp>That product is brutal, and it is worth doing the arithmetic once so the intuition sticks. A method with a genuinely good POD of 0.8 at the damage size you care about, applied to 10% of a circuit where the damage could be anywhere, has about an 8% chance of finding it. A clean result from that round is very weak evidence of a clean circuit. Sensitivity and coverage are not interchangeable, and a superb technique deployed at token coverage is a poor inspection — which is exactly why screening methods with modest POD but high coverage often beat high-sensitivity spot checks for CUI, and why the sensible architecture is screen broadly, then characterise the hits.\u003c/p>\n\u003cp>API RP 581 encodes this whole idea as inspection effectiveness categories, A through E: Highly Effective, Usually Effective, Fairly Effective, Poorly Effective, and Ineffective / no inspection. The categories are defined per damage mechanism in the standard's tables, which describe the inspection strategy — method, extent, and coverage — that earns each grade, and an A-level strategy is characterised as carrying roughly 80-100% confidence of identifying the true damage state, with B around 60-80%. Effectiveness then enters the risk calculation through Bayesian conditioning, which is the same machinery as Digest #3 applied to the damage state rather than the corrosion rate: an effective inspection that finds nothing shifts posterior weight away from the severe damage states and lowers the damage factor, while an ineffective one leaves the prior essentially untouched. The standard also gives combination rules — two B inspections credit as one A, two C as one B, two D as one C — and pointedly gives no such rule for E, because accumulating observations that carry no information still yields no information.\u003c/p>\n\u003cp>Here is the number that should make you uncomfortable, and it is the reason this topic belongs on the CUI track rather than the NDT track. Industry reporting on external inspection of insulated piping puts the probability of detecting actual CUI well below 50%, with figures in the 15-25% range quoted for typical external approaches. If that is anywhere near right for your programme, then a walk-down plus a handful of strip points is not a Highly Effective inspection no matter how carefully it was executed, and crediting it as one is precisely how a well-run RBI programme drifts into intervals it has not earned. The Lead-level habit is simple to state and uncomfortable to practise: whenever a damage factor drops after an inspection, ask what effectiveness category was claimed, and what coverage and method capability justify it. Effectiveness is an engineering assertion that someone must own, not a dropdown in the software.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"http://www.trinity-bridge.com/blogs/leveraging-versatility-api-rp-581-inspection-effectiveness-tables\" target=\"_blank\" rel=\"noopener noreferrer\">Leveraging the Versatility of the API RP 581 Inspection Effectiveness Tables\u003c/a>\n        \u003cspan class=\"lnk-src\">Trinity Bridge\u003c/span>\u003cspan class=\"lnk-note\">How the effectiveness tables are meant to be read and applied per damage mechanism — the practical companion to the standard.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.inspection-for-industry.com/API-581-Inspection-Effectiveness-and-Optimization.html\" target=\"_blank\" rel=\"noopener noreferrer\">API 581 Inspection Effectiveness and Optimization\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspection for Industry\u003c/span>\u003cspan class=\"lnk-note\">Sets out the A-E categories, the confidence ranges behind them, and the combination rules (2B = 1A, 2C = 1B, 2D = 1C, and nothing for E).\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/videos/2025-07-24/11668/detecting-corrosion-under-insulation-using-in-line-inspection\" target=\"_blank\" rel=\"noopener noreferrer\">Detecting Corrosion Under Insulation Using In-Line Inspection\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Source of the uncomfortable number — external CUI detection probability reported well below 50% — and the argument for internal or screening alternatives.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://blog.eddyfi.com/en/corrosion-under-insulation-the-7-inspection-methods-you-must-know-about\" target=\"_blank\" rel=\"noopener noreferrer\">Corrosion Under Insulation: the inspection methods you must know about\u003c/a>\n        \u003cspan class=\"lnk-src\">Eddyfi Technologies\u003c/span>\u003cspan class=\"lnk-note\">Method-by-method capability rundown — read it as a set of implied POD-versus-morphology statements, not as a shopping list.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Worth knowing — POD is context-dependent, and 2026 research says so out loud","html":"\u003cp>A 2026 review in the Journal of Nondestructive Evaluation, &quot;A Review of Probability of Detection Evaluation for Acoustic Emission and Ultrasonic Testing in Composite Structures: Context-Dependent Reliability for Inspection Planning&quot;, is worth reading past its composites subject matter for one transferable argument: POD is not a property of a technique. It is a property of the whole inspection system — technique plus geometry, access, surface and coating condition, procedure, noise environment, and the human running it. The review's core complaint is that published POD values are routinely lifted out of the trial conditions that produced them and reused as though they were equipment specifications.\u003c/p>\n\u003cp>That lands hard on CUI work, where the field conditions are about as far from a laboratory specimen set as inspection gets: jacket in the way, standoff varying with insulation thickness, wet or crushed insulation changing the response, awkward access on elevated racks, and damage morphology that ranges from broad thinning to isolated under-band pitting. A vendor POD curve produced on clean flat plate is an upper bound on what you will achieve, not an estimate of it. The DSTO interpretation guidelines linked above exist for exactly this reason, and the honest engineering move when you have no site-specific qualification is to carry the POD as a stated assumption with a sensitivity range rather than a single borrowed number.\u003c/p>\n\u003cp>The same 2026 framing closes the loop back to Digest #5. The censoring correction proposed there — score the back-test only over components inspected by a method credited to detect the damage — needs a POD value to be more than a gesture, and the formal literature on Bayesian updating from imperfect inspection data does exactly this: it treats each inspection outcome as a noisy observation with an explicit POD and sizing-error model, so a clean result from a weak inspection updates the posterior only slightly. That is the mathematically correct version of the intuition this whole digest has been building. Where you cannot supply a defensible POD, the right output is a range and a stated assumption, not a confident single interval.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://link.springer.com/article/10.1007/s10921-026-01356-4\" target=\"_blank\" rel=\"noopener noreferrer\">A Review of Probability of Detection Evaluation for Acoustic Emission and Ultrasonic Testing: Context-Dependent Reliability for Inspection Planning (2026)\u003c/a>\n        \u003cspan class=\"lnk-src\">Journal of Nondestructive Evaluation (Springer)\u003c/span>\u003cspan class=\"lnk-note\">This week's current development — the case that POD belongs to the inspection context, not the instrument, and what that means for planning.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S0951832015002495\" target=\"_blank\" rel=\"noopener noreferrer\">Bayesian inferences of generation and growth of corrosion defects on energy pipelines based on imperfect inspection data\u003c/a>\n        \u003cspan class=\"lnk-src\">Reliability Engineering &amp; System Safety (Elsevier)\u003c/span>\u003cspan class=\"lnk-note\">The formal version of this week's lesson: POD and sizing error carried explicitly inside the Bayesian update, rather than assumed away.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.cambridge.org/core/journals/data-centric-engineering/article/decisiontheoretic-inspection-planning-using-imperfect-and-incomplete-data/2E36A47DA1F8819B0AF58C6D4032C9D0\" target=\"_blank\" rel=\"noopener noreferrer\">Decision-theoretic inspection planning using imperfect and incomplete data\u003c/a>\n        \u003cspan class=\"lnk-src\">Data-Centric Engineering (Cambridge)\u003c/span>\u003cspan class=\"lnk-note\">Open-access treatment of choosing inspections when the data are both imperfect and incomplete — the decision layer above the POD term.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Put the POD term into the script (~30-45 min, SYNTHETIC data only). Until now every simulated inspection has been perfect: if the component was corroding, the inspection saw it. Replace that with a detection model — each inspection detects existing damage with probability p = coverage x POD, and start with a simple logistic POD in wall-loss depth (say 10% at 0.5 mm rising to 90% at 3 mm) times a coverage fraction you set. Then do the part that matters: update the posterior on a CLEAN inspection result. A no-finding from a round with p = 0.2 should barely move the rate posterior, while a no-finding from a round with p = 0.9 should shift it appreciably toward the low-rate end. Record the posterior mean and credible interval after one clean inspection at each of p = 0.2, 0.5 and 0.9. Finish with one calculation and one sentence: how many clean p = 0.2 inspections it takes to shift the posterior as much as a single clean p = 0.9 inspection, and whether that ratio is broadly consistent with API 581's two-C-equals-one-B style combination rules. If your number says the standard's doubling rule is generous relative to your own POD assumptions, that observation — not the code — is the thing to bring to the next RBI review.","html":"\u003cp>Put the POD term into the script (~30-45 min, SYNTHETIC data only). Until now every simulated inspection has been perfect: if the component was corroding, the inspection saw it. Replace that with a detection model — each inspection detects existing damage with probability p = coverage x POD, and start with a simple logistic POD in wall-loss depth (say 10% at 0.5 mm rising to 90% at 3 mm) times a coverage fraction you set. Then do the part that matters: update the posterior on a CLEAN inspection result. A no-finding from a round with p = 0.2 should barely move the rate posterior, while a no-finding from a round with p = 0.9 should shift it appreciably toward the low-rate end. Record the posterior mean and credible interval after one clean inspection at each of p = 0.2, 0.5 and 0.9. Finish with one calculation and one sentence: how many clean p = 0.2 inspections it takes to shift the posterior as much as a single clean p = 0.9 inspection, and whether that ratio is broadly consistent with API 581's two-C-equals-one-B style combination rules. If your number says the standard's doubling rule is generous relative to your own POD assumptions, that observation — not the code — is the thing to bring to the next RBI review.\u003c/p>"},"number":6,"minutes":9,"words":1875,"q":"what \"we inspected it\" is actually worth — pod, coverage, and the effectiveness term digest #6 (track 2). two weeks running, a term has been left as a placeholder. digest #4 warned that a rate-only probability of exceedance ignores localisation and coverage. digest #5 showed that censoring — the fact that finding history records where you looked, not where damage was — quietly flatters a back-test. both were the same missing quantity: the probability that an inspection would have found the damage if it were there. this week that term gets built properly, because it is the hinge between a model and the inspection programme that feeds it. get it wrong and a clean inspection report becomes an argument for a longer interval when it should barely have moved the number. pod is a curve, not a number — and a90/95 is the honest version of it probability of detection is a function of defect size, written pod(a). small damage is missed often, large damage is missed rarely, and the curve between them is what a qualification trial measures. saying this method has a pod of 80% is meaningless until you state at what size, because the same procedure might be at 20% for a 1 mm pit and 95% for 4 mm of general loss. there are two standard ways to measure it. hit/miss analysis records only whether each known flaw was found; it is simple, applies to any method, and needs a lot of specimens — roughly 60 flaws as a working minimum — because each observation carries only one bit of information. signal-response analysis, usually written a-hat versus a , records the actual signal amplitude against the true flaw size, extracts far more information per specimen, and so needs fewer of them, but only works where the method produces a continuous quantitative response. mil-hdbk-1823a is the canonical reference for both: it specifies how to design the specimen set, run the trial, and fit the curve with confidence bounds. that brings in the notation you will meet in any procedure qualification: a90 and a90/95. a90 is the flaw size at which the fitted curve reaches 90% detection — a best estimate. a90/95 is the size at which you are 95% confident the detection probability is at least 90%, which is a lower confidence bound on the curve and therefore a larger, more conservative flaw size. the gap between them is a sample-size penalty: a thin demonstration produces a wide confidence band and a poor a90/95 even if the technique is genuinely good. when a vendor quotes a90 and not a90/95, they are quoting the number that ignores how little evidence supports it. the cui translation matters. for insulated piping, the size variable is not crack length; it is a combination of wall-loss depth and lateral extent, and different methods are sensitive to different parts of that combination. pulsed eddy current returns an average wall thickness over a footprint — so its detection capability depends on the ratio of the corroded patch to that footprint. a deep, tight pit inside a large pec footprint gets averaged against surrounding sound metal and can sit low on the pod curve no matter how deep it is, which is the same mathematics behind the warning in digest #4 that a pec footprint average is not a t_mm. profile radiography, by contrast, is comparatively strong on localised loss and weak on broad thinning around the circumference. which method is best is the wrong question. what does each method's pod curve look like against the damage morphology i actually expect is the right one. sources probability of detection — nde engineering fundamentals ndt resource center (nde-ed.org) the clearest short introduction to pod(a), hit/miss versus signal-response analysis, and where a90/95 comes from. mil-hdbk-1823a — nondestructive evaluation system reliability assessment us dod (via statistical engineering) the canonical method for running a pod trial and fitting the curve with confidence bounds — skim sections 3 and 4 and appendix g. guidelines for interpretation of published data on probability of detection (dsto-tr-2622) australian defence science and technology organisation how to read someone else's pod numbers without over-crediting them — directly applicable to vendor performance claims. exploring probability of detection (pod) analysis in ndt — with application to phased array ultrasonic corrosion mapping researchgate (review paper) pod methodology applied to corrosion mapping rather than crack detection — the closer analogue to your cui problem. coverage x pod = effectiveness — and how api 581 turns that product into a damage factor a pod curve alone still overstates what a round of inspection achieves, because it answers would i detect this flaw if i put the probe on it . the programme question is would i have found the damage at all , and that adds a second, usually larger, source of failure: the damage might sit outside the part you inspected. to a first approximation the two multiply — effectiveness is roughly coverage times pod at the size of interest. that product is brutal, and it is worth doing the arithmetic once so the intuition sticks. a method with a genuinely good pod of 0.8 at the damage size you care about, applied to 10% of a circuit where the damage could be anywhere, has about an 8% chance of finding it. a clean result from that round is very weak evidence of a clean circuit. sensitivity and coverage are not interchangeable, and a superb technique deployed at token coverage is a poor inspection — which is exactly why screening methods with modest pod but high coverage often beat high-sensitivity spot checks for cui, and why the sensible architecture is screen broadly, then characterise the hits. api rp 581 encodes this whole idea as inspection effectiveness categories, a through e: highly effective, usually effective, fairly effective, poorly effective, and ineffective / no inspection. the categories are defined per damage mechanism in the standard's tables, which describe the inspection strategy — method, extent, and cov","summaryHtml":"Digest #6 (Track 2). Two weeks running, a term has been left as a placeholder. Digest #4 warned that a rate-only probability of exceedance ignores localisation and coverage. Digest #5 showed that censoring — the fact that finding history records where you looked, not where damage was — quietly flatters a back-test. Both were the same missing quantity: the probability that an inspection would have found the damage if it were there. This week that term gets built properly, because it is the hinge between a model and the inspection programme that feeds it. Get it wrong and a clean inspection report becomes an argument for a longer interval when it should barely have moved the number."},{"id":"AI_2026_08_14","stream":"asset","date":"2026-08-14","title":"API RP 584: Integrity Operating Windows, and the hard problem of writing one for CUI","summary":"Deep-Dive #1 picked up the story after the damage was found. This one moves upstream to the mechanism that is supposed to stop you being surprised in the first place. Integrity Operating Windows are widely misunderstood as a second set of safety limits; they are not. An IOW is a limit on a parameter that controls the RATE of a damage mechanism, and its whole purpose is to tell you when the corrosion-rate assumption underneath your inspection plan has stopped being true. The second half is the part nobody writes down: how you build an IOW for CUI, ECLSCC and CUF, where the parameter that actually drives the damage is not on the DCS at all.","sections":[{"heading":"Concept of the week — an IOW limits damage rate, not safety, and that distinction is the whole point","html":"\u003cp>Three families of limit sit on any piece of operating equipment and they are routinely collapsed into one. Design limits come from the code and the design case: MAWP, MDMT, design temperature. Cross one and you are outside what the equipment was built to withstand, and the response is an engineering evaluation of the equipment itself. Safe operating limits are the process-safety envelope — the consequences of deviation that a PHA identified, usually one-sided, usually instrumented, usually with an operator action measured in minutes. Integrity Operating Windows are the third family, and they are different in kind. An IOW is a limit on a process parameter chosen because crossing it changes the rate at which a named damage mechanism proceeds, or activates a mechanism that was previously dormant.\u003c/p>\n\u003cp>The consequence of that definition is the thing worth carrying: \u003cstrong>an IOW exceedance usually causes no immediate hazard at all\u003c/strong>. Nothing leaks, nothing alarms, nothing is unsafe that afternoon. What an exceedance does is invalidate an assumption. Your next-inspection date, your remaining life, your API 581 thinning damage factor, the future corrosion allowance you fed into an API 579 Part 5 assessment last quarter — every one of those rests on a corrosion rate that was defended under an assumed operating envelope. The IOW is the tripwire that tells you the envelope moved. So the correct mental model is that IOWs are the feedback loop that keeps an inspection plan honest \u003cstrong>between\u003c/strong> inspections. Without them, an interval you set today is an unmonitored bet that operations will not change for five years, and nobody ever checks the bet.\u003c/p>\n\u003cp>API RP 584 sorts IOWs into three tiers — critical, standard and informational — and the discriminator is \u003cstrong>time to consequence, not severity of outcome\u003c/strong>. A critical IOW is one where exceeding the limit produces rapid deterioration on a scale of hours to days; it needs a limit an operator can see, a written action they can take without calling anyone, and normally an instrument and an alarm. A standard IOW is one where an exceedance sustained over weeks to months, or across a turnaround interval, will measurably increase degradation; the response is evaluation by a subject-matter expert — you — and a decision. An informational IOW carries no defined response on exceedance at all; it is trended to build the corrosion knowledge base and to feed the next corrosion review or RBI re-run. The common error is assigning tiers by how frightening the mechanism sounds. HTHA is terrifying and slow. A chloride excursion into a hot austenitic line can crack it in days. Tier follows kinetics, not dread.\u003c/p>\n\u003cp>RP 584 also has a view on what a single IOW must carry to be worth writing: the parameter and the exact point at which it is measured; the limit, upper and lower; the damage mechanism it controls, named from API 571; the equipment and circuits it applies to; the duration of exceedance that is tolerable; the required response; and a named owner. Two of those repay attention. First, \u003cstrong>IOWs are frequently two-sided where safety limits are not\u003c/strong> — too-low velocity gives you under-deposit attack and MIC, too-low temperature gives you dew-point condensation, too-low inhibitor gives you loss of film. Reflexively writing every window as &quot;stay below X&quot; loses half the mechanisms. Second, the scope field ties an IOW to a \u003cstrong>corrosion loop\u003c/strong>, not to the plant. An IOW is a corrosion-loop-level object by construction, because a damage mechanism plus a materials-and-conditions envelope is exactly what a loop is. If you cannot say which loop a window belongs to, you have not finished thinking about it.\u003c/p>\n\u003cp>The last piece of the concept is measurement reliability, and it is where most registers quietly fail. An IOW is only as good as the instrument behind it and where that instrument sits relative to the damage. A bulk process temperature and a metal skin temperature are different numbers, and CUI cares about the surface under the jacket while the DCS is measuring flowing fluid somewhere upstream. A chloride limit sampled monthly cannot police a window whose time to consequence is days. When your monitoring frequency is slower than the time to consequence, you do not have a critical IOW — you have an informational one wearing a critical label, and that is worse than having no IOW at all, because it manufactures assurance. This is why RP 584 wants monitoring frequency stated alongside the limit rather than treated as an implementation detail.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.api.org/products-and-services/standards/important-standards-announcements/rp584\" target=\"_blank\" rel=\"noopener noreferrer\">API Recommended Practice 584, 2nd Edition — Integrity Operating Windows\u003c/a>\n        \u003cspan class=\"lnk-src\">American Petroleum Institute\u003c/span>\u003cspan class=\"lnk-note\">The publisher page for the current edition — check the edition and addendum status here rather than against a procedure that quotes a version someone typed in years ago.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://cognascents.com/integrity-operating-windows-10-questions-every-engineer-should-be-able-to-answer/\" target=\"_blank\" rel=\"noopener noreferrer\">Integrity Operating Windows: 10 Questions Every Engineer Should Be Able to Answer\u003c/a>\n        \u003cspan class=\"lnk-src\">Cognascents\u003c/span>\u003cspan class=\"lnk-note\">The cleanest short treatment of the critical / standard / informational tiers and what an exceedance response has to contain.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://ims-handbook.cenosco.com/docs/integrity-operating-windows-iows-theory\" target=\"_blank\" rel=\"noopener noreferrer\">Integrity Operating Windows (IOWs) — Theory\u003c/a>\n        \u003cspan class=\"lnk-src\">Cenosco IMS Handbook\u003c/span>\u003cspan class=\"lnk-note\">Sets out the anatomy of a single IOW record — parameter, limits, mechanism, scope, duration, response, owner — which is the template the Apply-it exercise builds against.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://process.honeywell.com/content/dam/forge/en/documents/gated/Honeywell-Integrity-Operating-Windows.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Managing Integrity Operating Windows and Critical Plant Limits\u003c/a>\n        \u003cspan class=\"lnk-src\">Honeywell\u003c/span>\u003cspan class=\"lnk-note\">Useful specifically for the boundary between IOWs and the process-safety limit set, which is the distinction this section turns on.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"The hard case — writing IOWs for CUI, ECLSCC and CUF when the driver is not on the DCS","html":"\u003cp>Every textbook IOW example is a variable the historian already trends: a reactor inlet temperature, a sulphur content, a velocity, a pH. CUI is the hardest mechanism in the plant to write a window for, and it is worth being precise about why. The driver of CUI is liquid water in contact with steel, at a temperature where the reaction proceeds, carrying whatever salts and pH the wet insulation delivers. None of those four things is measured by the control system. So a CUI IOW is always a \u003cstrong>proxy\u003c/strong> IOW, and the entire engineering content lies in choosing proxies whose relationship to the damage you can actually defend when challenged.\u003c/p>\n\u003cp>The first proxy is temperature, and it has a shape that breaks the ordinary IOW mental model. For carbon steel the commonly cited CUI-susceptible envelope runs from about -12 °C to 175 °C, with rates peaking in the middle of that range — roughly 50 °C to 125 °C — because below freezing there is no liquid water and above about 150 °C the surface stays dry and any ingress flashes off. A normal IOW says &quot;stay below X&quot;. A CUI temperature window is a \u003cstrong>band to be avoided, bounded on both sides, with the worst condition in the middle\u003c/strong>. That is not a threshold, it is a region, and writing it as &quot;operating temperature &lt; 175 °C&quot; is not merely useless, it is inverted: a line normally running at 220 °C carries low CUI risk \u003cem>while it stays there\u003c/em>, and the integrity event is the day it is turned down to 90 °C for a rate cut. A conventional one-sided limit set would flag exactly nothing on the day the risk went up by an order of magnitude.\u003c/p>\n\u003cp>That leads to the second and more useful insight: \u003cstrong>for CUI the informative parameter is usually cumulative exposure, not an instantaneous value\u003c/strong>. Damage accrues with time spent in the wet band, not with the peak reached. So the parameter worth defining is something like hours per year within 50-125 °C with the jacket in service, or the count of cold shutdowns, steam-outs and de-ice cycles per year, or days per year in idle or spared standby. That changes what you ask the process historian for — a query over a temperature history, not a tag limit. And it catches the classic killer, which is intermittent and spared service: the equipment record says &quot;operates at 200 °C, low CUI susceptibility&quot; while the reality is 1,400 hours a year sitting at ambient full of condensate under a jacket that was designed for the hot case. Two-sided, cumulative, and derived from history rather than read off a gauge — that is what a real CUI IOW looks like, and it is why so few registers contain one.\u003c/p>\n\u003cp>ECLSCC and CUF are variations on the same difficulty. For austenitic stainless under insulation the susceptible surface-temperature band commonly cited is roughly 50-150 °C, and the second necessary ingredient is chloride, which at a coastal site arrives two ways: marine aerosol through a breached jacket, and leaching out of the insulation itself. So the ECLSCC window set is a temperature band, with the same non-monotonic logic, \u003cstrong>plus\u003c/strong> the chloride-source parameters you can actually control — a chloride limit on wash water or steam condensate where lines are externally washed, a leachable-chloride specification on insulation at purchase, and jacket and sealant condition as a barrier-state parameter. Note what that last one is: not a process variable at all, but an inspection-derived condition metric. RP 584 permits that, and it is the right answer when the process variable is uncontrollable. CUF sits further along the same axis again — on a skirt or a structural member there is often no process parameter worth writing, and the only meaningful window is on fireproofing condition, sealant and topcoat state, and water-shedding geometry, policed on a survey frequency rather than a sensor.\u003c/p>\n\u003cp>The senior move is to close the loop back into the plan, and then to be ruthless about the count. For every window you write, finish the sentence that begins &quot;if this is exceeded, the following changes in the inspection plan.&quot; A synthetic example: a line whose CUI rate was defended at 0.10 mm/yr on the basis that it operates above the susceptible envelope accumulates 600 hours in the 50-125 °C band over a year, which trips a standard-tier IOW; the response is an SME review of the assumed rate, and if the rate is revised to 0.25 mm/yr then the next inspection date is recalculated on the API 570 remaining-life route, or the API 581 thinning damage factor is re-derived and the RBI plan reissued. That sentence is the whole value of the window — it is the mechanism by which RBI is actually living rather than re-run every five years. Two related traps to name explicitly. First, a \u003cstrong>deliberate, sustained move outside a window is not an exceedance, it is a change\u003c/strong>, and it belongs in MOC with integrity as a reviewer; treating a permanent re-operation as a series of exceedances is precisely how inspection gets bypassed. Second, resist writing fifty windows. Annex D of RP 584 exists because the standard failure mode is a register that generates limits faster than the organisation can respond to them, until exceedances accumulate unactioned and the whole set is ignored — at which point the register is an audit liability, because it documents that you knew and did nothing.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2024-06-27/11132/managing-asset-integrity-risk-by-integration-of-integrity-operating-windows-iow\" target=\"_blank\" rel=\"noopener noreferrer\">Managing Asset Integrity Risk by Integration of Integrity Operating Windows (IOWs)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering Journal\u003c/span>\u003cspan class=\"lnk-note\">How IOW exceedance data is meant to feed back into risk ranking and inspection planning rather than sitting in its own register.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://becht.com/becht-blog/entry/integrity-operating-windows-iows-a-key-piece-to-your-integrity-program-but-where-else-should-they-be-integrated/\" target=\"_blank\" rel=\"noopener noreferrer\">Integrity Operating Windows (IOWs), a Key Piece to Your Integrity Program — But Where Else Should They Be Integrated?\u003c/a>\n        \u003cspan class=\"lnk-src\">Becht\u003c/span>\u003cspan class=\"lnk-note\">The MOC, PHA and operating-procedure hooks — the difference between an exceedance and a change is made concrete here.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://wilkinsoncoutts.com/integrity-operating-windows-iows-api-rp-584-inspection-programme/\" target=\"_blank\" rel=\"noopener noreferrer\">Importance of Integrity Operating Windows (IOWs) — API RP 584 and the inspection programme\u003c/a>\n        \u003cspan class=\"lnk-src\">Wilkinson Coutts\u003c/span>\u003cspan class=\"lnk-note\">Written from the inspection-engineer side: how a window is supposed to alter an inspection plan when it is breached.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Industry watch — RP 584 added an annex about people, and what a moisture sensor does to the IOW tier","html":"\u003cp>API RP 584 remains on its 2nd Edition, published December 2021; as of August 2026 nothing has superseded it, so your baseline is stable. The change from the 1st Edition (2014) worth knowing is unusual: the committee added \u003cstrong>Annex D, Barriers to Successful IOW Implementation\u003c/strong>. API added an annex about organisational failure, not about technical content. Read that as the verdict after seven years of watching industry practice — the equations were never the problem. Programs fail on ownership, on operations buy-in, on exceedance backlogs nobody closes, and on registers that are never carried through MOC when the plant changes. If you only read one part of the standard before drafting windows of your own, read that annex, because it lists the failure modes you are about to walk into.\u003c/p>\n\u003cp>The practitioner literature has converged on the same place. Inspectioneering ran &quot;You have Got Integrity Operating Windows — What is Next?&quot; in its January/February 2025 issue, and the framing is telling: the article is entirely about the phase \u003cem>after\u003c/em> implementation — exceedance handling, review cadence, register ownership — because that is where most programs stall rather than at the technical definition step. An August 2025 piece takes the natural next step, pairing RBI methodology with a designed IOW program to manage ageing fixed equipment and piping, which is the integration argued for in the section above. On the tooling side the direction is digitisation: pulling exceedances automatically out of the historian instead of a monthly manual sweep. That is not a cosmetic improvement — it directly attacks the latency problem, because a window whose exceedances are discovered six weeks later can never legitimately be a critical-tier window.\u003c/p>\n\u003cp>The connection back to the technology you are deploying is the part worth writing down before your next vendor discussion. Everything in the previous section says a CUI window is a proxy window: you measure temperature and infer wetness. A distributed under-insulation moisture and corrosivity sensor is the first instrument that measures the actual driver rather than a stand-in for it. The interesting consequence is not better data quality, it is a change in the tier arithmetic. Under a proxy scheme, CUI can only ever be a standard or informational IOW, because the monitored quantity is loosely coupled to the damage and is often reviewed at a slower cadence than the damage develops. With a continuously reporting moisture signal, the monitoring frequency finally sits far below the time to consequence, which is exactly RP 584 condition for a limit to be actionable rather than merely trended. So the commercial case for the sensors is normally argued as &quot;we detect CUI earlier&quot;, which is a detection argument and is hard to price. The stronger integrity case, and the one that survives challenge from a process-safety reviewer, is that the sensor converts a proxy IOW into a directly measured one and therefore lets a defined response be attached to a window that previously could not carry one. That is a different and better sentence to put in front of a sanction committee.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2025-02-27/11453/so-youve-got-iows--whats-next\" target=\"_blank\" rel=\"noopener noreferrer\">You have Got Integrity Operating Windows (IOWs) — What is Next?\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering Journal\u003c/span>\u003cspan class=\"lnk-note\">January/February 2025 — the post-implementation phase, which is where programs actually fail. Pairs directly with Annex D.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/blog/2025-08-01/11688/integrity-operating-windows--an-integral-part-of-asset-integrity\" target=\"_blank\" rel=\"noopener noreferrer\">IOWs: An Integral Part of Asset Integrity Management\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">August 2025 — RBI supplemented by a designed IOW program to manage ageing fixed equipment and piping.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.assetintegrityengineering.com/digitising-integrity-operating-windows-iows-strengthening-process-safety-barriers-with-analytics/\" target=\"_blank\" rel=\"noopener noreferrer\">Digitising Integrity Operating Windows: Strengthening Process Safety Barriers With Analytics\u003c/a>\n        \u003cspan class=\"lnk-src\">Asset Integrity Engineering\u003c/span>\u003cspan class=\"lnk-note\">The automated-exceedance-detection direction, and why detection latency is what caps the tier you can honestly assign.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/api+rp+584\" target=\"_blank\" rel=\"noopener noreferrer\">API RP 584 — Integrity Operating Windows (topic index)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Running index of RP 584 coverage — the place to check when you want to know whether a 3rd edition has moved.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Draft a three-row IOW register for one synthetic insulated circuit (~45-60 min, SYNTHETIC data only — no plant files, no real tag numbers). Invent the circuit: a 6\" carbon-steel line and a 3\" 316L branch under the same insulation and jacket, coastal site, nominal operating temperature 190 °C, spared so that it sits idle at ambient roughly 1,200 hours a year, externally washed twice a year. Now write three windows using the full RP 584 record — parameter, measurement point, monitoring frequency, lower limit, upper limit, damage mechanism named from API 571, circuit scope, tolerable duration, response, owner, tier. Suggested set: (1) cumulative hours per year in the 50-125 °C band on the carbon steel, tier standard; (2) wash-water chloride concentration on the 316L branch, tier critical or standard — decide which and justify it from time-to-consequence; (3) jacket and sealant condition score from survey, tier informational or standard. For each one, finish the sentence \"if this is exceeded, the following changes in the inspection plan\" with an actual recalculation route (API 570 remaining life, or a re-derived API 581 thinning damage factor) rather than \"notify the inspection engineer\". Then apply the discipline test to your own draft: for each row, name the instrument or survey that produces the number, and check that its frequency is shorter than the time to consequence you assumed when you set the tier. Downgrade any row that fails that test, and write one line on what it would take — instrument, sensor, or survey cadence — to earn the tier back. That last line is the business case for the moisture sensors, stated in RP 584 terms.","html":"\u003cp>Draft a three-row IOW register for one synthetic insulated circuit (~45-60 min, SYNTHETIC data only — no plant files, no real tag numbers). Invent the circuit: a 6&quot; carbon-steel line and a 3&quot; 316L branch under the same insulation and jacket, coastal site, nominal operating temperature 190 °C, spared so that it sits idle at ambient roughly 1,200 hours a year, externally washed twice a year. Now write three windows using the full RP 584 record — parameter, measurement point, monitoring frequency, lower limit, upper limit, damage mechanism named from API 571, circuit scope, tolerable duration, response, owner, tier. Suggested set: (1) cumulative hours per year in the 50-125 °C band on the carbon steel, tier standard; (2) wash-water chloride concentration on the 316L branch, tier critical or standard — decide which and justify it from time-to-consequence; (3) jacket and sealant condition score from survey, tier informational or standard. For each one, finish the sentence &quot;if this is exceeded, the following changes in the inspection plan&quot; with an actual recalculation route (API 570 remaining life, or a re-derived API 581 thinning damage factor) rather than &quot;notify the inspection engineer&quot;. Then apply the discipline test to your own draft: for each row, name the instrument or survey that produces the number, and check that its frequency is shorter than the time to consequence you assumed when you set the tier. Downgrade any row that fails that test, and write one line on what it would take — instrument, sensor, or survey cadence — to earn the tier back. That last line is the business case for the moisture sensors, stated in RP 584 terms.\u003c/p>"},"number":2,"minutes":12,"words":2711,"q":"api rp 584: integrity operating windows, and the hard problem of writing one for cui deep-dive #1 picked up the story after the damage was found. this one moves upstream to the mechanism that is supposed to stop you being surprised in the first place. integrity operating windows are widely misunderstood as a second set of safety limits; they are not. an iow is a limit on a parameter that controls the rate of a damage mechanism, and its whole purpose is to tell you when the corrosion-rate assumption underneath your inspection plan has stopped being true. the second half is the part nobody writes down: how you build an iow for cui, eclscc and cuf, where the parameter that actually drives the damage is not on the dcs at all. concept of the week — an iow limits damage rate, not safety, and that distinction is the whole point three families of limit sit on any piece of operating equipment and they are routinely collapsed into one. design limits come from the code and the design case: mawp, mdmt, design temperature. cross one and you are outside what the equipment was built to withstand, and the response is an engineering evaluation of the equipment itself. safe operating limits are the process-safety envelope — the consequences of deviation that a pha identified, usually one-sided, usually instrumented, usually with an operator action measured in minutes. integrity operating windows are the third family, and they are different in kind. an iow is a limit on a process parameter chosen because crossing it changes the rate at which a named damage mechanism proceeds, or activates a mechanism that was previously dormant. the consequence of that definition is the thing worth carrying: an iow exceedance usually causes no immediate hazard at all . nothing leaks, nothing alarms, nothing is unsafe that afternoon. what an exceedance does is invalidate an assumption. your next-inspection date, your remaining life, your api 581 thinning damage factor, the future corrosion allowance you fed into an api 579 part 5 assessment last quarter — every one of those rests on a corrosion rate that was defended under an assumed operating envelope. the iow is the tripwire that tells you the envelope moved. so the correct mental model is that iows are the feedback loop that keeps an inspection plan honest between inspections. without them, an interval you set today is an unmonitored bet that operations will not change for five years, and nobody ever checks the bet. api rp 584 sorts iows into three tiers — critical, standard and informational — and the discriminator is time to consequence, not severity of outcome . a critical iow is one where exceeding the limit produces rapid deterioration on a scale of hours to days; it needs a limit an operator can see, a written action they can take without calling anyone, and normally an instrument and an alarm. a standard iow is one where an exceedance sustained over weeks to months, or across a turnaround interval, will measurably increase degradation; the response is evaluation by a subject-matter expert — you — and a decision. an informational iow carries no defined response on exceedance at all; it is trended to build the corrosion knowledge base and to feed the next corrosion review or rbi re-run. the common error is assigning tiers by how frightening the mechanism sounds. htha is terrifying and slow. a chloride excursion into a hot austenitic line can crack it in days. tier follows kinetics, not dread. rp 584 also has a view on what a single iow must carry to be worth writing: the parameter and the exact point at which it is measured; the limit, upper and lower; the damage mechanism it controls, named from api 571; the equipment and circuits it applies to; the duration of exceedance that is tolerable; the required response; and a named owner. two of those repay attention. first, iows are frequently two-sided where safety limits are not — too-low velocity gives you under-deposit attack and mic, too-low temperature gives you dew-point condensation, too-low inhibitor gives you loss of film. reflexively writing every window as stay below x loses half the mechanisms. second, the scope field ties an iow to a corrosion loop , not to the plant. an iow is a corrosion-loop-level object by construction, because a damage mechanism plus a materials-and-conditions envelope is exactly what a loop is. if you cannot say which loop a window belongs to, you have not finished thinking about it. the last piece of the concept is measurement reliability, and it is where most registers quietly fail. an iow is only as good as the instrument behind it and where that instrument sits relative to the damage. a bulk process temperature and a metal skin temperature are different numbers, and cui cares about the surface under the jacket while the dcs is measuring flowing fluid somewhere upstream. a chloride limit sampled monthly cannot police a window whose time to consequence is days. when your monitoring frequency is slower than the time to consequence, you do not have a critical iow — you have an informational one wearing a critical label, and that is worse than having no iow at all, because it manufactures assurance. this is why rp 584 wants monitoring frequency stated alongside the limit rather than treated as an implementation detail. sources api recommended practice 584, 2nd edition — integrity operating windows american petroleum institute the publisher page for the current edition — check the edition and addendum status here rather than against a procedure that quotes a version someone typed in years ago. integrity operating windows: 10 questions every engineer should be able to answer cognascents the cleanest short treatment of the critical / standard / informational tiers and what an exceedance response has to contain. integrity operating windows (iows) — theory cenosco ims handbook sets out the anatomy of a single iow record — parameter, limits, mechanism, scope, duration, response, owner — whic","summaryHtml":"Deep-Dive #1 picked up the story after the damage was found. This one moves upstream to the mechanism that is supposed to stop you being surprised in the first place. Integrity Operating Windows are widely misunderstood as a second set of safety limits; they are not. An IOW is a limit on a parameter that controls the RATE of a damage mechanism, and its whole purpose is to tell you when the corrosion-rate assumption underneath your inspection plan has stopped being true. The second half is the part nobody writes down: how you build an IOW for CUI, ECLSCC and CUF, where the parameter that actually drives the damage is not on the DCS at all."},{"id":"D_2026_08_10","stream":"integrity","date":"2026-08-10","title":"Does the model actually work? — back-testing, calibration, and the two questions they answer","summary":"Digest #5 (Track 2). Four weeks built a model that turns a physics prior plus sensor and UT evidence into a posterior, then into a probability of exceedance and a date. This week asks the only question a Lead will be asked in the review: how do you know it is right? The answer is back-testing, and it has a sharp internal structure — a model can rank components perfectly and still hand you dangerously wrong dates. Separating those two failure modes, and knowing which one your interval decision depends on, is the whole lesson.","sections":[{"heading":"Discrimination vs calibration — two different questions, and only one sets your date","html":"\u003cp>A prediction model can be graded on two independent axes, and conflating them is the most common mistake in defending a model-derived interval.\u003c/p>\n\u003cp>Discrimination asks: does the model rank components in the right order — are the ones it scores worst actually the ones that corrode fastest? You measure it with rank metrics (ROC-AUC, rank correlation against observed metal loss). Good discrimination is what lets an RBI program point the next turnaround at the right lines. But discrimination is scale-free: a model can rank a hundred circuits in perfect worst-first order while every single POE number it prints is wrong by a factor of three.\u003c/p>\n\u003cp>Calibration asks the harder question: when the model says &quot;5% probability of exceedance,&quot; does roughly 5% actually exceed? A perfectly calibrated model's stated probabilities match observed frequencies. This is the axis that governs interval-setting, because last week's decision compared an absolute POE number against an absolute acceptance threshold. If the model is well-ordered but systematically under-predicts — says 2% when the truth is 15% — every interval it produces is too long, and it will do so confidently and consistently. Discrimination cannot catch that error; only calibration can. The tool for seeing it is the reliability diagram: bin components by predicted POE, and for each bin plot the observed exceedance fraction against the predicted value. Perfect calibration lies on the 45° line; points below the line mean the model is over-confident (predicting more failures than occur), points above mean it is under-predicting — the unsafe direction for an interval extension.\u003c/p>\n\u003cp>The single-number companion is the Brier score — the mean squared error between predicted probability and the 0/1 outcome, lower is better. It bundles calibration and discrimination into one scalar, which is convenient for tracking a model version-to-version but useless for diagnosis, because it cannot tell you which of the two axes moved. Report the reliability diagram to diagnose and the Brier score to trend; never report only the Brier score.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://scikit-learn.org/stable/modules/calibration.html\" target=\"_blank\" rel=\"noopener noreferrer\">Probability calibration — scikit-learn documentation\u003c/a>\n        \u003cspan class=\"lnk-src\">scikit-learn\u003c/span>\u003cspan class=\"lnk-note\">The exact tools your back-test needs — calibration_curve for the reliability diagram and brier_score_loss — with runnable examples.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.statstest.com/calibration-checks-brier-score-reliability-diagrams\" target=\"_blank\" rel=\"noopener noreferrer\">Calibration Checks: Brier Score and Reliability Diagrams\u003c/a>\n        \u003cspan class=\"lnk-src\">StatsTest\u003c/span>\u003cspan class=\"lnk-note\">Plain-language explainer of the two metrics you will quote in the review, and how to read the diagram.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://towardsdatascience.com/model-calibration-explained-a-visual-guide-with-code-examples-for-beginners-55f368bafe72/\" target=\"_blank\" rel=\"noopener noreferrer\">Model Calibration, Explained: A Visual Guide with Code\u003c/a>\n        \u003cspan class=\"lnk-src\">Towards Data Science\u003c/span>\u003cspan class=\"lnk-note\">Visual walk-through of why a well-ranking model can still be badly calibrated — the core distinction of this week.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Back-testing on CUI finding history — the rare-event trap and the censoring trap","html":"\u003cp>Back-testing sounds simple: freeze the model at a past date, let it predict, then score its predictions against what inspections later found. On CUI finding history, two traps make a naive back-test lie in your favour.\u003c/p>\n\u003cp>The first is the rare-event (base-rate) trap. CUI exceedances are uncommon per inspection — most CMLs on most rounds are fine. If the true exceedance base rate is 5%, a lazy model that predicts &quot;5% for everything&quot; scores a Brier of about 0.0475 and an accuracy of 95%, and has told you literally nothing. Rare outcomes make aggregate scores look excellent by default. That is why you must read the reliability diagram in the low-probability bins specifically, weight the assessment toward the actual finding events, and always quote a discrimination metric alongside the Brier score — a model with no discrimination is exposed instantly by an AUC near 0.5 even when its Brier score flatters it.\u003c/p>\n\u003cp>The second trap is censoring, and it is the CUI-specific one. Your finding history is not a clean record of where corrosion happened — it is a record of where you looked and where the damage was severe enough to record. Components that were never inspected contribute no &quot;exceedance,&quot; so they silently count as passes; a CML that was corroding hard but sat under intact jacket and never got opened never enters the denominator as a miss. This is the same coverage-and-detection term from last week, now biasing your validation instead of your prediction: calibrating on finding history alone tends to make the model look better-calibrated than it is, because the failures it missed are exactly the ones the inspection program also missed. The honest back-test conditions on inspection effectiveness — score the model only over components that were actually inspected with a method credited to detect the damage per API RP 583, and state that scope out loud.\u003c/p>\n\u003cp>The reconciliation habit ties it back to the decision. When a fresh measured rate lands, do not simply fold it into the average. Compare it against the model's posterior: a reading inside the credible interval confirms the model; a reading above the upper bound is not a new data point to re-average — it is evidence the model is miscalibrated for that circuit, and it should re-open the assessment. That is the difference between updating a model and being quietly overruled by it.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/journal/2026-04-30/12022/reconciling-measured-versus-sme-determined-corrosion-rates-in-dmrrbi-developmen\" target=\"_blank\" rel=\"noopener noreferrer\">Reconciling Measured Versus SME-Determined Corrosion Rates in DMR/RBI Development\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Current (Apr 2026) treatment of exactly the reconciliation problem — what to do when the measured rate and the model/SME rate disagree.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/risk-based+inspection\" target=\"_blank\" rel=\"noopener noreferrer\">Risk-Based Inspection — process and model recalibration\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Curated RBI library; the recurring theme that inspection results should validate and recalibrate the model, not just feed it.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.sciencedirect.com/science/article/abs/pii/S0951832025003497\" target=\"_blank\" rel=\"noopener noreferrer\">Data-driven reliability evolution prediction of underground pipeline under corrosion\u003c/a>\n        \u003cspan class=\"lnk-src\">Reliability Engineering &amp; System Safety (Elsevier)\u003c/span>\u003cspan class=\"lnk-note\">A worked example of validating a corrosion-reliability model against inspection data over time — the back-test structure done formally.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"Worth knowing — the 2026 review that maps sensor-plus-ML integrity end to end","html":"\u003cp>A 2026 review in npj Materials Degradation, &quot;Advanced sensor systems and machine learning for pipeline integrity management,&quot; is worth an hour because it is a map of the exact terrain your two-architecture sensor portfolio sits in — it walks monitoring hardware, corrosion prediction, and the ML methods that join them, and it is candid about the recurring weak point: models validated on narrow datasets that do not generalise. That is this week's lesson stated at review-paper scale — the field's problem is not building predictors, it is proving they hold up out of sample.\u003c/p>\n\u003cp>Read it with one filter. Nearly every model it surveys reports a training-and-test accuracy; very few report a reliability diagram or an out-of-time back-test against a real finding history. When you present your own model, being able to show a calibration curve and a censoring-aware back-test scope is precisely what will separate it from a literature full of impressive-looking R² values that were never asked whether their probabilities mean anything. The Lead-level contribution is not a fancier model — it is the validation discipline the litera
