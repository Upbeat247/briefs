le end-to-end — shows how to fuse lab and field data into one cui-rate model. available prediction methods for corrosion under insulation (cui): a review researchgate survey of the prediction landscape — orient here before you pick an approach to build. anchor the model in api 581 so it earns rbi credit a prediction model that lives outside the rbi framework is an interesting side project; one that maps into api 581 changes inspection intervals. the bridge is the thinning damage factor. in 581, the thinning damage factor is driven by the art parameter — age × corrosion rate ÷ (furnished thickness minus corrosion allowance) — and by inspection effectiveness. more and better inspections (and on-line monitoring) reduce the uncertainty in the corrosion rate and lower the damage factor; probability of failure rises with time as the damage factor accumulates. so in rbi terms your cui model has one job: produce a better-justified corrosion rate, with tighter uncertainty, than the default 581 cui tables — and your moisture/corrosion monitoring counts as the on-line monitoring that raises inspection confidence. if the model output cannot be expressed as a corrosion rate plus a confidence that 581 can consume, it will not move the inspection plan, however clever it is. read the 4th-edition change summary before anchoring anything: api rp 581 was revised, and the thinning and pof treatment evolved — anchor to the current edition, not a remembered one. and note the honest gap: 581's built-in cui data is limited, which is precisely why a locally-calibrated model has value — it fills the gap the standard leaves, provided it speaks the standard's language. sources api rp 581 risk-based inspection technology: summary of changes in the 4th edition (feb 2025) inspectioneering what changed in the current edition — read this before anchoring a model to 581. examining api rp 581 rbi methodology: thinning and the pof calculations inspectioneering how the thinning damage factor and probability of failure are actually computed — the maths your model must feed. api rp 581 — risk-based inspection technology (topic hub) inspectioneering ongoing 581 reading feed — bookmark alongside the cui hub.","summaryHtml":"Last week was the sensing layer; this week is the modeling layer (your Track 2). Two threads: what the data-driven CUI-rate prediction methods actually do and which one to start with, and how to anchor whatever you build in API 581 so it changes inspection intervals instead of sitting on the shelf. Build the methodology here on synthetic data, port to real data at work."},{"id":"D_2026_06_29","stream":"integrity","date":"2026-06-29","title":"Moisture sensing architectures, API RP 583 as program anchor, and RT film discipline","summary":"First digest. Three threads this week: the two-architecture logic behind CUI moisture sensing (point vs distributed), using API RP 583 2nd edition as the structural anchor for a CUI program, and a systematic viewing discipline for radiographic film interpretation.","sections":[{"heading":"Point vs distributed moisture sensing — two architectures, two jobs","html":"\u003cp>CUI moisture sensing is converging on a two-architecture portfolio, and the engineering logic for each is different.\u003c/p>\n\u003cp>Point/zone sensors (e.g. Kaefer BLU-type smart insulation nodes — typically capacitance/relative-humidity plus temperature) are a breadth play: many cheap nodes across many circuits, each answering &quot;is this zone wet?&quot; They give early warning of wetting events across a wide population, but localisation is only as good as node spacing, and they say nothing about metal loss.\u003c/p>\n\u003cp>Distributed sensors (CorrosionRADAR LR-type) run a flexible sensor pair — a moisture sensor plus a sacrificial corrosion sensor — up to ~50 m along a line, using Electro-Magnetic Guided Radar (EMGR, a guided-wave/TDR-adjacent reflectometry method). They localise anomalies to roughly ±1 m and estimate corrosivity in mm/yr. That is a depth play for high-consequence lines: fewer assets covered, but with location and a corrosion-rate signal, feeding analytics platforms (Clarity) that map trends over time.\u003c/p>\n\u003cp>The integration discipline matters more than the hardware: a moisture alarm is a leading indicator — a wetting event, not confirmed metal loss. It should be wired into surveillance like an IOW excursion: named owner, trigger criteria, and a pre-agreed corrective action (targeted inspection of the alarmed zone), not an automatic repair decision. And vendor claims (e.g. large inspection-cost reductions) are marketing until validated on your own lines — pilot with defined success criteria before fleet rollout.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.corrosionradar.com/products-solutions/\" target=\"_blank\" rel=\"noopener noreferrer\">CorrosionRADAR — Products &amp; Solutions (LR + Clarity)\u003c/a>\n        \u003cspan class=\"lnk-src\">CorrosionRADAR\u003c/span>\u003cspan class=\"lnk-note\">Distributed EMGR moisture + sacrificial corrosion sensing; the vendor you are in discussions with.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.corrosionradar.com/news-media/what-do-the-latest-cui-monitoring-standards-and-product-updates-mean-for-asset-owners/\" target=\"_blank\" rel=\"noopener noreferrer\">What do the latest CUI monitoring standards and product updates mean for asset owners?\u003c/a>\n        \u003cspan class=\"lnk-src\">CorrosionRADAR\u003c/span>\u003cspan class=\"lnk-note\">Vendor view on how monitoring is entering CUI standards — read critically.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.onestopndt.com/ndt-news/the-launch-of-corrosionradar-lr-a-new-generation-of-corrosion-under-insulation-cui-risk-monitoring-system\" target=\"_blank\" rel=\"noopener noreferrer\">CorrosionRADAR LR launch — CUI risk monitoring system\u003c/a>\n        \u003cspan class=\"lnk-src\">OnestopNDT\u003c/span>\u003cspan class=\"lnk-note\">Independent(ish) coverage of the LR hardware generation.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"API RP 583 (2nd ed., 2021) as the structural anchor of a CUI program","html":"\u003cp>API RP 583 &quot;Corrosion Under Insulation and Fireproofing&quot; is the single best document to structure a CUI/CUF/ECSCC program around. The 2021 second edition covers external corrosion of carbon and low-alloy steels under insulation and fireproofing, and external chloride SCC of austenitic and duplex stainless steels — including the modern NDE methods that screen for CUI without insulation removal (PEC, profile RT, etc.).\u003c/p>\n\u003cp>Use it as a checklist for program structure: susceptible temperature ranges by material class, feature classes where CUI concentrates (supports, penetrations, low points, jacket damage), screening-vs-strip decision logic, and mitigation (coatings, insulation system selection). Pair it with AMPP/NACE SP0198 for the coatings and mitigation side.\u003c/p>\n\u003cp>For continuous reading, Inspectioneering's CUI tag page is the best single feed — case studies, FFS-for-CUI articles, and management guidance land there regularly. Their CUI management eBook is a solid structured read if you want the full picture in one document.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://inspectioneering.com/tag/api+rp+583\" target=\"_blank\" rel=\"noopener noreferrer\">Inspectioneering — API RP 583 tag (articles and updates)\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Everything Inspectioneering publishes touching RP 583.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/tag/corrosion+under+insulation\" target=\"_blank\" rel=\"noopener noreferrer\">Inspectioneering — Corrosion Under Insulation topic hub\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">The ongoing CUI reading feed — bookmark this.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://inspectioneering.com/content/2021-09-30/9844/a-guide-to-corrosion-under-insulation-management\" target=\"_blank\" rel=\"noopener noreferrer\">eBook: Understanding and Managing Corrosion Under Insulation\u003c/a>\n        \u003cspan class=\"lnk-src\">Inspectioneering\u003c/span>\u003cspan class=\"lnk-note\">Structured end-to-end CUI management guide.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"},{"heading":"RT film interpretation — a viewing discipline, not a guessing game","html":"\u003cp>Film interpretation skill is mostly systematic viewing discipline. The order matters:\u003c/p>\n\u003cp>1. Film quality first, always: density in the acceptable range, the correct IQI (penetrameter) visible with required sensitivity, coverage and identification markers correct. An indication on a film that fails quality checks is not an indication — it is an invalid film.\u003c/p>\n\u003cp>2. Artifact vs discontinuity: screen marks, pressure marks, chemical streaks, static. Artifacts move with the film; discontinuities live in the weld geometry.\u003c/p>\n\u003cp>3. Characterise by signature: porosity — dark, rounded, sharp-edged; slag — dark, irregular, often elongated along the weld; lack of fusion — dark straight line at the fusion face (off-centre); incomplete penetration — dark straight band on the root centreline; excess penetration — light band along the root; root concavity — diffuse dark band along the centreline; cracks — fine, dark, irregular lines, often with branching.\u003c/p>\n\u003cp>The classic confusions are LOF vs IP (position: fusion face vs centreline) and root concavity vs IP (edge sharpness: diffuse vs sharp). Build the pattern library by volume: the AWS Certified Radiographic Interpreter (CRI) programme and ASNT's Radiographic Image Interpretation course are the two structured paths, both built on large real-image sets.\u003c/p>\u003cdiv class=\"links\">\u003ch4>Sources\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.aws.org/certification-and-education/professional-certification/certified-radiographic-interpreter/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Radiographic Interpreter (CRI) programme\u003c/a>\n        \u003cspan class=\"lnk-src\">AWS\u003c/span>\u003cspan class=\"lnk-note\">The credential most aligned with weld film interpretation skill.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://education.asnt.org/local/catalog/view/product.php?productid=30\" target=\"_blank\" rel=\"noopener noreferrer\">ASNT — Radiographic Image Interpretation course\u003c/a>\n        \u003cspan class=\"lnk-src\">ASNT\u003c/span>\u003cspan class=\"lnk-note\">Fundamentals + discontinuity signatures on real images.\u003c/span>\u003c/li>\n\u003cli>\u003ca href=\"https://www.asnt.org/what-is-nondestructive-testing/methods/radiographic-testing\" target=\"_blank\" rel=\"noopener noreferrer\">ASNT — Radiographic Testing method overview\u003c/a>\n        \u003cspan class=\"lnk-src\">ASNT\u003c/span>\u003cspan class=\"lnk-note\">Good free grounding before committing to a course.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"action":{"label":"This week","text":"Spend 30 minutes drafting the vendor question list for the CorrosionRADAR discussions: exact ATEX/IECEx zone rating and certificate numbers, IS entity parameters, operating temperature range, and how Clarity corrosivity estimates map to API 581 damage factors. These are the open gaps — get them answered in writing.","html":"\u003cp>Spend 30 minutes drafting the vendor question list for the CorrosionRADAR discussions: exact ATEX/IECEx zone rating and certificate numbers, IS entity parameters, operating temperature range, and how Clarity corrosivity estimates map to API 581 damage factors. These are the open gaps — get them answered in writing.\u003c/p>"},"number":1,"minutes":4,"words":797,"q":"moisture sensing architectures, api rp 583 as program anchor, and rt film discipline first digest. three threads this week: the two-architecture logic behind cui moisture sensing (point vs distributed), using api rp 583 2nd edition as the structural anchor for a cui program, and a systematic viewing discipline for radiographic film interpretation. point vs distributed moisture sensing — two architectures, two jobs cui moisture sensing is converging on a two-architecture portfolio, and the engineering logic for each is different. point/zone sensors (e.g. kaefer blu-type smart insulation nodes — typically capacitance/relative-humidity plus temperature) are a breadth play: many cheap nodes across many circuits, each answering is this zone wet? they give early warning of wetting events across a wide population, but localisation is only as good as node spacing, and they say nothing about metal loss. distributed sensors (corrosionradar lr-type) run a flexible sensor pair — a moisture sensor plus a sacrificial corrosion sensor — up to ~50 m along a line, using electro-magnetic guided radar (emgr, a guided-wave/tdr-adjacent reflectometry method). they localise anomalies to roughly ±1 m and estimate corrosivity in mm/yr. that is a depth play for high-consequence lines: fewer assets covered, but with location and a corrosion-rate signal, feeding analytics platforms (clarity) that map trends over time. the integration discipline matters more than the hardware: a moisture alarm is a leading indicator — a wetting event, not confirmed metal loss. it should be wired into surveillance like an iow excursion: named owner, trigger criteria, and a pre-agreed corrective action (targeted inspection of the alarmed zone), not an automatic repair decision. and vendor claims (e.g. large inspection-cost reductions) are marketing until validated on your own lines — pilot with defined success criteria before fleet rollout. sources corrosionradar — products solutions (lr + clarity) corrosionradar distributed emgr moisture + sacrificial corrosion sensing; the vendor you are in discussions with. what do the latest cui monitoring standards and product updates mean for asset owners? corrosionradar vendor view on how monitoring is entering cui standards — read critically. corrosionradar lr launch — cui risk monitoring system onestopndt independent(ish) coverage of the lr hardware generation. api rp 583 (2nd ed., 2021) as the structural anchor of a cui program api rp 583 corrosion under insulation and fireproofing is the single best document to structure a cui/cuf/ecscc program around. the 2021 second edition covers external corrosion of carbon and low-alloy steels under insulation and fireproofing, and external chloride scc of austenitic and duplex stainless steels — including the modern nde methods that screen for cui without insulation removal (pec, profile rt, etc.). use it as a checklist for program structure: susceptible temperature ranges by material class, feature classes where cui concentrates (supports, penetrations, low points, jacket damage), screening-vs-strip decision logic, and mitigation (coatings, insulation system selection). pair it with ampp/nace sp0198 for the coatings and mitigation side. for continuous reading, inspectioneering's cui tag page is the best single feed — case studies, ffs-for-cui articles, and management guidance land there regularly. their cui management ebook is a solid structured read if you want the full picture in one document. sources inspectioneering — api rp 583 tag (articles and updates) inspectioneering everything inspectioneering publishes touching rp 583. inspectioneering — corrosion under insulation topic hub inspectioneering the ongoing cui reading feed — bookmark this. ebook: understanding and managing corrosion under insulation inspectioneering structured end-to-end cui management guide. rt film interpretation — a viewing discipline, not a guessing game film interpretation skill is mostly systematic viewing discipline. the order matters: 1. film quality first, always: density in the acceptable range, the correct iqi (penetrameter) visible with required sensitivity, coverage and identification markers correct. an indication on a film that fails quality checks is not an indication — it is an invalid film. 2. artifact vs discontinuity: screen marks, pressure marks, chemical streaks, static. artifacts move with the film; discontinuities live in the weld geometry. 3. characterise by signature: porosity — dark, rounded, sharp-edged; slag — dark, irregular, often elongated along the weld; lack of fusion — dark straight line at the fusion face (off-centre); incomplete penetration — dark straight band on the root centreline; excess penetration — light band along the root; root concavity — diffuse dark band along the centreline; cracks — fine, dark, irregular lines, often with branching. the classic confusions are lof vs ip (position: fusion face vs centreline) and root concavity vs ip (edge sharpness: diffuse vs sharp). build the pattern library by volume: the aws certified radiographic interpreter (cri) programme and asnt's radiographic image interpretation course are the two structured paths, both built on large real-image sets. sources aws certified radiographic interpreter (cri) programme aws the credential most aligned with weld film interpretation skill. asnt — radiographic image interpretation course asnt fundamentals + discontinuity signatures on real images. asnt — radiographic testing method overview asnt good free grounding before committing to a course.","summaryHtml":"First digest. Three threads this week: the two-architecture logic behind CUI moisture sensing (point vs distributed), using API RP 583 2nd edition as the structural anchor for a CUI program, and a systematic viewing discipline for radiographic film interpretation."}];
window.__STREAMS__ = {"integrity":{"label":"Integrity Coaching","accent":"teal"},"asset":{"label":"Asset Integrity","accent":"orange"},"leadership":{"label":"Leadership","accent":"blue"}};
</script>
<script>(function () {
  'use strict';

  var ALL = window.__BRIEFS__ || [];
  var STREAMS = window.__STREAMS__ || {};
  var READ_KEY = 'briefs-read-v1';
  var THEME_KEY = 'briefs-theme-v1';

  var listEl = document.getElementById('list');
  var articleEl = document.getElementById('article');
  var searchEl = document.getElementById('search');
  var filtersEl = document.getElementById('filters');
  var progressEl = document.getElementById('progress');

  // ---------- storage (a locked-down browser can throw on access) ----------

  function store(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function save(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      /* private mode / blocked storage — the page still works, it just forgets */
    }
  }

  var read = store(READ_KEY, {});

  // ---------- theme ----------

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme').textContent = t === 'dark' ? '☀' : '☾';
  }
  var saved = store(THEME_KEY, null);
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));

  document.getElementById('theme').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    save(THEME_KEY, next);
  });

  // ---------- helpers ----------

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  var filter = 'all';
  var query = '';

  function visible() {
    var q = query.trim().toLowerCase();
    return ALL.filter(function (e) {
      if (filter !== 'all' && e.stream !== filter) return false;
      if (!q) return true;
      return e.q.indexOf(q) !== -1 || e.title.toLowerCase().indexOf(q) !== -1;
    });
  }

  // ---------- list ----------

  function cardHtml(e) {
    var s = STREAMS[e.stream] || {};
    var isRead = !!read[e.id];
    return (
      '<button class="card' + (isRead ? ' read' : '') + '" data-id="' + esc(e.id) + '">' +
      '<div class="kicker s-' + esc(e.stream) + '">' +
      '<span class="dot"></span>' + esc(s.label || '') +
      ' <span class="sep">/</span> <span class="meta">#' + e.number + '</span>' +
      ' <span class="sep">/</span> <span class="meta">' + esc(fmtDate(e.date)) + '</span>' +
      ' <span class="sep">/</span> <span class="meta">' + e.minutes + ' min</span>' +
      (isRead ? ' <span class="tick">✓ read</span>' : '') +
      '</div>' +
      '<h2>' + esc(e.title) + '</h2>' +
      (e.summaryHtml ? '<p>' + e.summaryHtml + '</p>' : '') +
      '</button>'
    );
  }

  function renderFilters() {
    var counts = { all: ALL.length };
    ALL.forEach(function (e) { counts[e.stream] = (counts[e.stream] || 0) + 1; });

    var html = '<button class="chip" data-f="all" aria-pressed="' + (filter === 'all') +
      '">All <span class="n">' + counts.all + '</span></button>';

    Object.keys(STREAMS).forEach(function (k) {
      if (!counts[k]) return;
      html += '<button class="chip s-' + k + '" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' +
        '<span class="dot"></span>' + esc(STREAMS[k].label) +
        ' <span class="n">' + counts[k] + '</span></button>';
    });
    filtersEl.innerHTML = html;
  }

  function renderList() {
    var items = visible();
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">Nothing matches that.</div>';
    } else {
      var html = '';
      var year = null;
      items.forEach(function (e) {
        var y = e.date.slice(0, 4);
        if (y !== year) { year = y; html += '<div class="year">' + y + '</div>'; }
        html += cardHtml(e);
      });
      listEl.innerHTML = html;
    }
    renderFilters();
    listEl.hidden = false;
    articleEl.hidden = true;
    progressEl.style.width = '0';
    document.getElementById('chrome').hidden = false;
  }

  // ---------- article ----------

  function renderArticle(e) {
    var s = STREAMS[e.stream] || {};
    var idx = ALL.indexOf(e);
    var newer = ALL[idx - 1];
    var older = ALL[idx + 1];

    var body = e.sections.map(function (sec) {
      return (sec.heading ? '<h2>' + esc(sec.heading) + '</h2>' : '') + sec.html;
    }).join('\n');

    var nav = '';
    if (newer || older) {
      nav = '<div class="nav-more">' +
        (older ? '<button data-id="' + esc(older.id) + '"><span class="lbl">Older</span><span class="ttl">' + esc(older.title) + '</span></button>' : '') +
        (newer ? '<button data-id="' + esc(newer.id) + '"><span class="lbl">Newer</span><span class="ttl">' + esc(newer.title) + '</span></button>' : '') +
        '</div>';
    }

    articleEl.innerHTML =
      '<div class="article">' +
      '<button class="back">← All briefs</button>' +
      '<div class="kicker s-' + esc(e.stream) + '"><span class="dot"></span>' +
      esc(s.label || '') +
      ' <span class="sep">/</span> <span class="meta">#' + e.number + '</span>' +
      ' <span class="sep">/</span> <span class="meta">' + esc(fmtDate(e.date)) + '</span>' +
      ' <span class="sep">/</span> <span class="meta">' + e.minutes + ' min read</span></div>' +
      '<h1>' + esc(e.title) + '</h1>' +
      (e.summaryHtml ? '<p class="lede">' + e.summaryHtml + '</p>' : '') +
      '<hr class="rule">' +
      '<div class="body">' + body + '</div>' +
      (e.action ? '<div class="action"><h4>' + esc(e.action.label) + '</h4>' + e.action.html + '</div>' : '') +
      '<div class="done-row"><button class="btn' + (read[e.id] ? ' ghost' : '') + '" id="mark">' +
      (read[e.id] ? '✓ Read' + (read[e.id] !== true ? ' · ' + esc(fmtDate(String(read[e.id]).slice(0, 10))) : '') : 'Mark as read') +
      '</button></div>' +
      nav +
      '</div>';

    listEl.hidden = true;
    articleEl.hidden = false;
    document.getElementById('chrome').hidden = true;
    window.scrollTo(0, 0);

    document.getElementById('mark').addEventListener('click', function () {
      if (read[e.id]) delete read[e.id];
      else read[e.id] = new Date().toISOString();
      save(READ_KEY, read);
      renderArticle(e);
    });
  }

  // ---------- routing ----------

  function route() {
    var m = location.hash.match(/^#\/b\/(.+)$/);
    if (m) {
      var e = ALL.filter(function (x) { return x.id === decodeURIComponent(m[1]); })[0];
      if (e) { renderArticle(e); return; }
    }
    renderList();
  }

  window.addEventListener('hashchange', route);

  document.addEventListener('click', function (ev) {
    var back = ev.target.closest('.back');
    if (back) { history.length > 1 ? history.back() : (location.hash = ''); return; }

    var chip = ev.target.closest('.chip');
    if (chip) { filter = chip.dataset.f; renderList(); return; }

    var card = ev.target.closest('[data-id]');
    if (card) { location.hash = '#/b/' + encodeURIComponent(card.dataset.id); }
  });

  searchEl.addEventListener('input', function () { query = searchEl.value; renderList(); });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== searchEl) {
      ev.preventDefault();
      if (!articleEl.hidden) location.hash = '';
      searchEl.focus();
    } else if (ev.key === 'Escape') {
      if (document.activeElement === searchEl) { searchEl.value = ''; query = ''; renderList(); searchEl.blur(); }
      else if (!articleEl.hidden) location.hash = '';
    }
  });

  window.addEventListener('scroll', function () {
    if (articleEl.hidden) return;
    var h = document.documentElement.scrollHeight - window.innerHeight;
    progressEl.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + '%';
  }, { passive: true });

  route();
})();
</script>
</body>
